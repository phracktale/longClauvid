  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '9 sources rouvertes : 8 en texte intégral, 1 page bloquée.'
    affirmations: '23 affirmations contrôlées : 18 confirmées, 5 non trouvées.'
    corrections:
    - 'Aucune source ne mesure le sélénium des tissus : le titre énonce une hypothèse.'
    - Des auteurs de l'étude de 2023 détiennent des parts de la société qui vend le dosage, en sont salariés ou
      ont déposé un brevet ; la fiche ne le dit pas.
    - L'étude de 2023 se dit exploratoire et ne corrige pas ses comparaisons multiples.
    - Après COVID-19, 3,9 % des adultes portent les anticorps, contre 10 à 16 % annoncés dans l'EM/SFC.
    - 'Dans l''étude ouverte du sélénium avec la coenzyme Q10, la TSH monte de 1,75 à 2,35 mUI/L en huit semaines
      (p = 0,0045) : un effet sur la thyroïde à surveiller, que la fiche ne cite pas.'
    - 'Biobanque britannique : mêmes réserves que pour B001.'
    inexploree: 'L''affirmation tient : aucun second laboratoire n''a dosé ces anticorps, aucun essai ne sélectionne
      des porteurs.'
    decision: 'Gardée après corrections : le dosage par un laboratoire indépendant est le test qui manque.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      constats:
      - Quatorze des dix-sept faits contrôlés sont confirmés.
      - Le rapport T3/T4 plus bas repose sur 12 porteurs d'anticorps, dans un test à trois groupes.
      - 'L''étude de 2018 et le sous-groupe thyroïdien de 2023 portent le même numéro de comité d''éthique : c''est
        la même cohorte, et la première ne confirme pas la seconde.'
      - Des auteurs de l'étude de 2023 détiennent des parts de la société qui évalue le statut en sélénium, ou en
        sont salariés.
      - '« Seule leur combinaison l''était » ne vaut que pour la présence de la fatigue : sur sa gravité, c''est
        le sélénium seul qui est lié, dans l''étude de 2026, qui est transversale.'
      - 'En 2018, le sélénium du plasma ne diffère pas et celui des globules rouges est plus haut chez les patients
        : le manque de sélénium dans les tissus n''est pas montré.'
      suite: 'Décision maintenue : vérifiée, niveau C. Le test est à écrire avec un seuil et un nombre attendu de
        porteurs.'
- id: B007
  titre: Le cibinétide, agoniste du récepteur de réparation innée, fait repousser les petites fibres nerveuses perdues
    dans le COVID long comme dans la sarcoïdose
  domaine_source: Neuropathie des petites fibres de la sarcoïdose
  processus_commun: Densité des fibres nerveuses de la cornée en microscopie confocale ; fibres nerveuses de l'épiderme
    sur biopsie de peau
  enonce: La perte de petites fibres nerveuses mesurée dans le COVID long et l'EM/SFC serait réversible par le levier
    testé dans la sarcoïdose. Si c'est vrai, chez des patients choisis pour des fibres cornéennes raréfiées, 28
    jours de cibinétide augmentent ces fibres davantage que le placebo.
  pourquoi_inexploree: 'Europe PMC, « cibinetide OR ARA 290 OR innate repair receptor » avec les termes EM/SFC ou
    COVID long : 0 résultat. ClinicalTrials.gov, « cibinetide OR ARA 290 OR erythropoietin » et ces maladies : 0
    essai. Le marqueur, lui, est documenté : « corneal confocal » avec ces maladies donne 7 résultats, dont deux
    études cas-témoins dans le COVID long, et la neuropathie des petites fibres y est décrite sur biopsie de peau.
    C''est donc le levier qui est inexploré, pas la mesure. Non trouvé ne veut pas dire inexistant.'
  test_propose: 'Avant tout essai, vérifier dans les cohortes déjà suivies que les fibres cornéennes remontent quand
    les symptômes s''améliorent. La piste est réfutée si la densité des fibres n''est liée ni aux symptômes ni à
    leur évolution : réparer les fibres serait alors sans objet.'
  donnees_existantes: 'Cohortes de microscopie confocale de la cornée : 40 personnes après COVID (Bitirgen 2022)
    et 60 patients COVID long (Cañadas 2023). Série du Brigham and Women''s Faulkner Hospital avec biopsies de peau
    : 143 patients COVID long et 170 patients EM/SFC (Novak 2026).'
  risques: 'Le niveau B vaut pour la perte de fibres, décrite par plusieurs équipes ; l''effet du levier dans nos
    maladies reste une hypothèse. Dans la sarcoïdose, l''essai ne dure que 28 jours sur 64 patients ; seule la dose
    de 4 mg a atteint le critère, et la douleur n''a pas baissé de façon significative contre placebo. Sur ClinicalTrials.gov,
    la recherche « cibinetide OR ARA 290 » ne trouve aucun essai en cours de la molécule ; les essais repérés se
    sont achevés ou arrêtés entre 2014 et 2017 : sa disponibilité est incertaine. La perte de fibres peut être une
    conséquence et non une cause des symptômes. Molécule expérimentale, testée en phase 2 : à n''envisager que dans
    un essai. Relecture du 2026-11-22, grille statistique : doutes aux questions 1, 2, 3, 4, 6, 7 et 10. Seize patients
    par bras, un seul programme industriel, un effet qui ne suit pas la dose ; la perte de fibres peut être une
    conséquence.'
  niveau: C
  sources:
  - titre: Cibinetide Improves Corneal Nerve Fiber Abundance in Patients With Sarcoidosis-Associated Small Nerve
      Fiber Loss and Neuropathic Pain, Investigative Ophthalmology & Visual Science 2017 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/28475703/
    lu: page
  - titre: ARA 290 improves symptoms in patients with sarcoidosis-associated small nerve fiber loss and increases
      corneal nerve fiber density, Molecular Medicine 2013 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/24136731/
    lu: page
    texte: https://doi.org/10.2119/molmed.2013.00122
  - titre: Corneal confocal microscopy identifies corneal nerve fibre loss and increased dendritic cells in patients
      with long COVID, British Journal of Ophthalmology 2022 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/34312122/
    lu: page
  - titre: Neuroinflammatory Findings of Corneal Confocal Microscopy in Long COVID-19 Patients, 2 Years after Acute
      SARS-CoV-2 Infection, Diagnostics 2023 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/37892009/
    lu: page
  - titre: Peripheral Neuropathy Evaluations of Patients With Prolonged Long COVID, Neurology Neuroimmunology &
      Neuroinflammation 2022 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/35232750/
