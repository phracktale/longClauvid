- id: B011
  titre: Les peptides codés par l'ADN mitochondrial, humanine et MOTS-c, sont abaissés dans la fatigue après fièvre
    Q et dans l'EM/SFC
  domaine_source: Syndrome de fatigue après fièvre Q
  processus_commun: Expression des gènes MT-RNR2 (humanine) et MT-RNR1 (MOTS-c) dans les monocytes ; taux d'humanine
  enonce: Une baisse durable des peptides dérivés de la mitochondrie serait une trace commune des fatigues post-infectieuses.
    Si c'est vrai, elle se retrouve dans le COVID long, et elle distingue les personnes fatiguées des personnes
    infectées puis rétablies.
  pourquoi_inexploree: 'Europe PMC, « humanin OR MOTS-c OR mitochondrial-derived peptide » avec les termes EM/SFC
    ou COVID long : 5 résultats. Une seule étude de mesure, sur 10 personnes par groupe (Raijmakers 2019), et une
    prépublication d''opinion en faveur de MOTS-c (2025). Aucune mesure dans le COVID long n''a été trouvée. ClinicalTrials.gov,
    « MOTS-c OR humanin OR mitochondrial-derived peptide » et ces maladies : 0 essai. Non trouvé ne veut pas dire
    inexistant.'
  test_propose: Doser l'humanine et MOTS-c dans du plasma conservé, et lire MT-RNR1 et MT-RNR2 dans des données
    de séquençage d'ARN déjà produites, chez des patients, des témoins sains et des personnes rétablies. La piste
    est réfutée si les taux ne diffèrent pas, ou s'ils sont aussi bas chez les personnes rétablies.
  donnees_existantes: UK ME/CFS Biobank (plasma, sang pour ARN) ; biobanque RECOVER (sérum, cellules mononucléées).
    Aucun jeu de données d'ARN n'a été vérifié pour ces deux gènes dans cette recherche.
  risques: 'Dix personnes par groupe, une seule équipe. Dans cette étude, les témoins séropositifs pour la fièvre
    Q mais sans fatigue avaient eux aussi une expression abaissée, à un moindre degré : le marqueur suit peut-être
    l''infection passée et non la fatigue. L''effet de MOTS-c sur la performance physique vient de la souris. Selon
    la prépublication de 2025, les données de sécurité et d''efficacité chez l''humain manquent. Sur ClinicalTrials.gov,
    le seul essai de MOTS-c repéré chez l''humain est en cours dans le prédiabète. MOTS-c n''a donc pas sa place
    hors d''un essai.'
  niveau: C
  sources:
  - titre: A possible role for mitochondrial-derived peptides humanin and MOTS-c in patients with Q fever fatigue
      syndrome and chronic fatigue syndrome, Journal of Translational Medicine 2019 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/31088495/
