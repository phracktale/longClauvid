# Banque d'hypothèses à vérifier.
#
# C'est une boîte de dépôt, pas un résultat. Les entrées sont proposées par des agents
# de recherche ou par des personnes ; aucune n'a été vérifiée tant que son statut
# est « à vérifier ». Aucune fiche du registre ne peut s'appuyer sur une entrée de la banque.
# Les règles sont dans PROTOCOLE.md, section « Banque d'hypothèses à vérifier ».
#
# Statuts : à vérifier, vérifiée, promue (champ promue_en), écartée (champ motif).
# « Vérifiée » ne veut pas dire « vraie » : les sources ont été rouvertes, les erreurs relevées,
# et la piste reste une question à tester.
#
# Chaque source dit si la page a été ouverte (« page ») ou seulement son extrait (« extrait »).
# Son champ « texte », s'il existe, donne l'adresse où son texte intégral a été relu.
#
# Le texte déposé n'est pas réécrit. La relecture s'ajoute : ses corrections sont dans le champ
# « relecture », qui prime sur le texte déposé, et ses doutes à la fin du champ « risques ».
# La méthode et le tableau des décisions sont dans analyses/banque/RELECTURE.md.

- id: B001
  titre: La pyruvate déshydrogénase est freinée par ses kinases dans l'EM/SFC, comme dans le sepsis, et ce frein
    se mesure dans le sang
  domaine_source: Déficit en pyruvate déshydrogénase de l'enfant ; sepsis ; cholangite biliaire primitive
  processus_commun: Expression des kinases PDK1, PDK2 et PDK4 dans les cellules mononucléées du sang ; baisse des
    acides aminés sériques qui alimentent le cycle de Krebs
  enonce: Chez une partie des patients EM/SFC, et peut-être COVID long, les kinases PDK inactivent durablement la
    pyruvate déshydrogénase. Le pyruvate est alors détourné vers le lactate à l'effort. Si c'est vrai, la hausse
    de PDK1, PDK2 et PDK4 se retrouve dans une cohorte indépendante, y compris de COVID long.
  pourquoi_inexploree: 'Europe PMC, « pyruvate dehydrogenase » ou « dichloroacetate » avec les termes EM/SFC ou
    COVID long : 12 résultats. Une seule étude de mesure (Fluge 2016, 200 patients et 102 témoins) et une série
    ouverte de dichloroacétate sur 22 patients (Comhaire 2018). Avec les seuls termes COVID long : 0 résultat. ClinicalTrials.gov,
    « dichloroacetate » et ces maladies : 0 essai. Aucune réplication indépendante n''a été trouvée. Non trouvé
    ne veut pas dire inexistant.'
  test_propose: Mesurer l'ARN de PDK1, PDK2 et PDK4 dans des cellules du sang déjà conservées, chez des patients
    et des témoins d'une cohorte indépendante, et refaire le profil d'acides aminés du sérum. La piste est réfutée
    si l'expression des kinases ne diffère pas de celle des témoins, ou si le profil d'acides aminés de 2016 ne
    se retrouve pas.
  donnees_existantes: 'UK ME/CFS Biobank : sérum, cellules mononucléées et sang pour ARN de 340 patients et 136
    témoins sains. Biobanque RECOVER pour le COVID long : sérum et cellules mononucléées.'
  risques: 'Résultat d''une seule équipe. Pour le sepsis, la hausse d''activité des kinases n''a été lue ici que
    dans une étude chez le rat. Les anticorps anti-pyruvate déshydrogénase de la cholangite biliaire primitive sont
    absents dans l''EM/SFC (1 patient sur 161) : le mécanisme n''est pas celui-là. Une petite étude de spectroscopie
    du muscle trouvait un couplage mitochondrial normal chez 8 patients EM/SFC. Le dichloroacétate est un médicament
    à risque : dans un essai sur le syndrome MELAS, il a provoqué une neuropathie périphérique qui a fait arrêter
    l''essai. Dans le déficit en pyruvate déshydrogénase de l''enfant, l''essai de phase 3 a manqué son critère
    principal à 4 mois. La série ouverte de 2018 n''a pas de groupe témoin : 10 patients améliorés sur 22 ne prouvent
    rien. Relecture du 2026-11-22, grille statistique : doutes aux questions 2, 3, 4, 6, 7 et 10. Une seule équipe
    porte le signal ; la hausse des kinases peut être une conséquence de la maladie ou de l''inactivité ; le test
    proposé n''a pas de seuil chiffré.'
  niveau: C
  sources:
  - titre: Metabolic profiling indicates impaired pyruvate dehydrogenase function in myalgic encephalopathy/chronic
      fatigue syndrome, JCI Insight 2016 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/28018972/
