  relecture:
    date: '2026-11-22'
    lecture: '3 sources rouvertes : 2 en texte intégral, 1 par son résumé.'
    affirmations: '36 affirmations contrôlées : 28 confirmées, 1 inexacte, 7 non trouvées.'
    corrections:
    - Les 855 allèles sont des allèles imputés ; l'association n'a été cherchée que dans la région des signaux significatifs.
    - Dans DecodeME, le typage HLA est imputé séparément chez les cas et chez les témoins, et deux allèles liés
      à DQA1*05:01 ne sont pas associés (p = 0,27 et p = 0,042) ; les auteurs prévoient de refaire l'analyse. Un
      artefact n'est pas exclu.
    - 'Le texte de DecodeME ne cite ni rs9273363, ni DRB1*11:04, ni DQA1*03:01 : trois des quatre tests proposés
      demandent ses statistiques résumées.'
    - L'étude de 23andMe est financée par l'entreprise, qui emploie ses auteurs.
    - 'Niveau ramené de B à C : deux maladies, des allèles différents, aucun signal commun répliqué.'
    inexploree: « Une seule étude dédiée » est faux. Dans l'EM/SFC, deux études norvégiennes associent la maladie
      à HLA-C*07:04 et à HLA-DQB1*03:03 (426 patients, PMID 32210306), puis à la région HLA-DQB1 (PMID 34403736).
      Dans le COVID long, deux études espagnoles trouvent HLA-A*03 (71 cas parmi 153 patients, PMID 40107360) puis
      HLA-B*15 (168 cas, PMID 43023789) moins fréquents chez les malades ; la seconde ne retient aucun allèle de
      haute résolution après correction. Le croisement des deux études pangénomiques, lui, reste à faire.
    decision: 'Gardée après corrections : quatre tests fixés d''avance peuvent trancher, mais un seul se lit sur
      un fichier public. Les études norvégiennes désignent la région HLA-DQ dans l''EM/SFC seulement.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections : le test sur statistiques résumées ne coûte rien, et les études
        norvégiennes désignent déjà la région HLA-DQ.'
      constats:
      - Vingt des vingt-trois faits contrôlés sont confirmés.
      - '« Le test ne coûte rien » était inexact : un seul des quatre tests se lit sur un fichier public, et il
        a échoué ; les trois autres demandent un chiffre que les équipes n''ont pas publié.'
      - 'Les études norvégiennes désignent HLA-DQB1 dans l''EM/SFC seulement : elles n''appuient pas un terrain
