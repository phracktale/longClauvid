    url: https://pubmed.ncbi.nlm.nih.gov/29409505/
    lu: page
  - titre: 'D-lactic acidosis: an underrecognized complication of short bowel syndrome, Gastroenterology Research
      and Practice 2015 (résumé)'
    url: https://pubmed.ncbi.nlm.nih.gov/25977687/
