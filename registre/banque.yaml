    lecture: '3 sources rouvertes : 2 en texte intégral, 1 par son résumé.'
    affirmations: '33 affirmations contrôlées : 28 confirmées, 3 inexactes, 2 non trouvées.'
    corrections:
    - 'Le tableau des antibiotiques porte sur toute la cohorte appariée, infectés et témoins confondus : ce n''est
      pas une prise « après une infection ».'
    - Le signal repose sur 16 à 31 cas de fatigue chronique chez les personnes exposées à chaque antibiotique.
    - 'Rapport brut et rapport ajusté sont presque identiques : l''ajustement n''explique rien.'
    - Neuf agents infectieux sur quatorze augmentent le risque de façon significative, et non tous.
    - La clarithromycine, sixième antibiotique testé, est sans effet (1,00) ; la fiche ne la cite pas.
    inexploree: Deux travaux manquaient. Dans une cohorte de 311 patients, la prise d'antibiotiques pendant le COVID-19
      aigu est associée à plus de COVID long, pas à moins (risque relatif 2,0 ; PMID 36673565). Un essai ouvert
      de minocycline, sans groupe témoin, rapporte une amélioration chez 41 des 51 patients qui ont terminé le traitement
      (PMID 39720104). Aucune contre-analyse de la base taïwanaise.
    decision: 'Écartée : voir le motif.'
    contradiction:
      date: '2026-11-22'
      avis: tient
      motif_initial: 'Signal probablement artefactuel : effet invraisemblable, un risque divisé par dix à vingt-cinq
        ; fenêtre d''exposition non décrite ; maladie définie par un code seul (questions 5, 8 et 9 de la grille).
        La contre-analyse proposée n''est pas faite, et l''essai randomisé de la doxycycline dans la fatigue de
        la fièvre Q est négatif. À rouvrir si une émulation d''essai cible est publiée.'
      constats:
      - Les faits du motif sont exacts.
      - 'La clarithromycine, sans effet avec 31 cas, ne cadre pas avec un artefact qui toucherait toute prise d''antibiotique
        : l''artefact, s''il existe, n''est pas uniforme.'
      - 'L''essai de la doxycycline traite une fatigue installée depuis six mois au moins : il ne teste pas la prévention.'
      - 'Le temps immortel reste une hypothèse : l''article ne décrit pas le moment de la prise.'
      suite: Mise à l'écart maintenue ; deux précisions ajoutées au motif.
  motif: 'Signal probablement artefactuel : effet invraisemblable, un risque divisé par dix à vingt-cinq, sur 16
    à 30 cas par antibiotique ; moment de la prise non décrit ; maladie définie par un code seul (questions 5, 8
    et 9 de la grille). La contre-analyse proposée n''est pas faite. L''essai randomisé de la doxycycline est négatif,
    mais il traite une fatigue installée et ne teste pas la prévention. À rouvrir si une émulation d''essai cible
    est publiée.'
- id: B022
  titre: Les lymphocytes mémoire des patients ont des lipides oxydés par défaut de GPX4, et cette oxydation relèverait
    de la ferroptose
  domaine_source: Immunologie du lymphocyte T chez la souris (déficit en GPX4, ferroptose) ; lymphocytes sanguins
    de patients EM/SFC et COVID long
  processus_commun: Oxydation des lipides de membrane des lymphocytes T mémoire (sonde BODIPY-C11), protéine GPX4,
    glutathion, phospholipides riches en acides gras polyinsaturés
  enonce: 'Chez la souris, un lymphocyte T sans GPX4 accumule des lipides oxydés et meurt par ferroptose ; la vitamine
    E à forte dose a rétabli la réponse immunitaire. Une étude de 2025 décrit chez des patients EM/SFC et COVID
    long, surtout dans les lymphocytes mémoire, un glutathion plus haut et des dégâts lipidiques liés à GPX4. L''hypothèse
    : cette oxydation est une vraie ferroptose, et non un simple signe de stress oxydant. Si c''est vrai, dans une
    cohorte indépendante, les lymphocytes mémoire des patients oxydent plus leurs lipides que ceux de personnes
    rétablies, ils sont plus riches en phospholipides polyinsaturés, et un inhibiteur de ferroptose (ferrostatine-1,
    liprostatine-1) abaisse cette oxydation et améliore leur survie ou leur prolifération après activation.'
  pourquoi_inexploree: 'Europe PMC, le 2026-11-23. (1) (TITLE_ABS:"ferroptosis" OR "GPX4") ET (TITLE_ABS:"long COVID"
    OR "post-COVID" OR "post-acute sequelae") : 10 résultats. Une étude chez 127 patients hospitalisés (Zhao 2025),
    une étude chez la souris, des revues, une prépublication théorique. (2) (ferroptosis OR GPX4 OR lipid peroxidation)
    ET (myalgic encephalomyelitis OR chronic fatigue syndrome) : 32 résultats, presque tous des modèles de souris
    ou des plantes ; aucun ne teste une ferroptose chez des patients EM/SFC. (3) TITLE : ferroptosis ET (chronic
    fatigue OR myalgic OR long COVID OR post-COVID OR PASC) : 4 résultats, aucun avec une expérience de réversion
    par inhibiteur sur des cellules de patients. La recherche par termes exacts a manqué l''étude de 2025 : elle
    écrit « glutathione peroxidase 4 », pas « GPX4 », dans son résumé ; elle a été trouvée par une autre requête
    (glutathione). ClinicalTrials.gov (interface v2), terme « ferroptosis » : 31 études ; seule une touche le COVID
    (vitamine E à forte dose en COVID aigu, NCT07412574) ; terme « GPX4 » : 18 études, aucune dans ces maladies.
    Aucun essai n''a été trouvé qui sélectionne des patients sur la ferroptose. Non trouvé ne veut pas dire inexistant.'
  test_propose: 'Dans une seconde équipe, sur des cellules mononucléées de sang (PBMC) congelées ou fraîches de
    patients EM/SFC, de patients COVID long et de personnes rétablies (au moins 30 par groupe, à confirmer par un
    calcul de puissance fait en code), mesurer par cytométrie dans les lymphocytes T mémoire : l''oxydation de la
    sonde BODIPY-C11, la protéine GPX4, et la composition en phospholipides polyinsaturés par lipidomique. Puis
    traiter une partie des cellules par ferrostatine-1 ou liprostatine-1 avant activation, et mesurer survie et
    prolifération. Séparer hommes et femmes, car l''étude de 2025 trouve des profils différents (dégâts lipidiques
    surtout chez les hommes). Seuils écrits avant les données : écart de C11 entre patients et rétablis d''au moins
    0,5 écart-type, et inhibiteur qui abaisse le C11 d''au moins moitié de cet écart. La piste est réfutée si les
    lymphocytes mémoire des patients ne sont pas plus oxydés que ceux des rétablis dans la cohorte indépendante,
    ou si l''inhibiteur abaisse le signal sans changer la survie ni la prolifération (alors l''oxydation existe,
    mais ce n''est pas une ferroptose), ou si ces cellules ne sont pas plus riches en phospholipides polyinsaturés.'
  donnees_existantes: 'Cohorte de l''étude de 2025 : 25 témoins sains, 27 patients EM/SFC, 20 patients COVID long
    (Stanford). Biobanque britannique de l''EM/SFC et biobanque RECOVER : citées dans la banque (B001, B012), je
    n''ai pas rouvert leurs pages ici ; à confirmer : qu''elles conservent des cellules vivantes ou des PBMC congelés
    utilisables pour une cytométrie, et pas seulement du sérum.'
  risques: 'Un seul résumé porte le signal de GPX4 (PNAS 2025, 72 personnes au total, une équipe) ; le texte intégral
    n''a pas pu être ouvert (Europe PMC l''a refusé), et je ne sais pas comment les dégâts lipidiques liés à GPX4
    ont été mesurés. Le glutathion est plus haut chez les patients : c''est le contraire d''une carence qui provoquerait
    la ferroptose. Des cellules T mémoire résistent à la ferroptose chez la souris : elles manquent de phospholipides
    polyinsaturés (PNAS 2026), et l''ablation de GPX4 en phase mémoire n''a pas altéré la réponse de rappel (JEM
    2015). Dans l''étude de 2025, les femmes ont plus de radicaux libres et des lymphocytes T qui prolifèrent plus,
    ce qui va dans le sens inverse d''une mort cellulaire. L''activité de la glutathion peroxydase du sang entier
    ne diffère pas chez 40 patients EM/SFC et 24 témoins (Maes 2011) ; la peroxydation lipidique n''est pas toujours
    trouvée : MDA sans différence globale chez 40 femmes contre 40 témoines (Brkic 2010, p = 0,345), TBARS sans
    hausse après un effort chez 36 personnes (Polli 2019). Les études de la peroxydation dans le COVID long comparent
    à des témoins historiques ou mal appariés (Silva 2026 : 85 patients contre 53 témoins issus d''une biobanque,
    77,65 % de femmes contre 45,28 %, TBARS 5,490 contre 1,846 µmol/L équivalent MDA, r = 0,917 : un effet si grand
    appelle une contre-analyse) ; TBARS ne mesure pas que le MDA. Danger du levier : la ferrostatine et la liprostatine
    ne sont pas des médicaments humains. La vitamine E, qui a rétabli les cellules de souris à forte dose, a augmenté
    le cancer de la prostate dans un essai de 35 533 hommes en bonne santé (400 UI par jour, risque relatif 1,17,
    intervalle à 99 % de 1,004 à 1,36, SELECT). Rien ici ne permet d''en conseiller. Aucune des sources lues n''est
    une étude sélectionnée sur la ferroptose. Relecture du 2026-11-23, grille statistique : doutes aux questions
    1, 2, 3, 4, 5, 6, 7 et 10. Sous-groupes de 4 à 6 personnes, une seule équipe, valeurs de p non corrigées ; une
    valeur de p tirée de 1 268 cellules d''un seul donneur par groupe.'
  niveau: D
  sources:
  - titre: Oxidative stress is a shared characteristic of ME/CFS and Long COVID, PNAS 2025 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/40627396/
    lu: page
  - titre: T cell lipid peroxidation induces ferroptosis and prevents immunity to infection, Journal of Experimental
