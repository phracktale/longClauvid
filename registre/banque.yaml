      concentration, Blood 2011 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/21705493/
    lu: page
  - titre: 'The effects of intravenous iron supplementation on fatigue and general health in non-anemic blood donors
      with iron deficiency: a randomized placebo-controlled superiority trial, 2020 (résumé)'
    url: https://pubmed.ncbi.nlm.nih.gov/32848185/
    lu: page
  - titre: Utility of Serum Ferritin for Predicting ME/CFS in Patients with Long COVID, 2023 (titre seul, liste
      de résultats Europe PMC)
    url: https://pubmed.ncbi.nlm.nih.gov/37510852/
    lu: extrait
  - titre: Effect of Iron Therapy on Fatigue Symptoms in Non-anemic Iron Deficient Women of Reproductive Age, NCT06596161
      (fiche lue par l'interface du registre)
    url: https://clinicaltrials.gov/study/NCT06596161
