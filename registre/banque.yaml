- id: B021
  titre: À Taïwan, la prise de certains antibiotiques est associée à dix fois moins de syndrome de fatigue chronique
    après une infection, un écart trop grand pour être cru tel quel
  domaine_source: Pharmaco-épidémiologie sur la base de l'assurance maladie de Taïwan
  processus_commun: Antibiotiques à effet immunomodulateur supposé (cyclines, macrolides, quinolones) au décours
    d'une infection
  enonce: 'Une antibiothérapie donnée au moment d''une infection réduit le risque de fatigue chronique persistante.
    L''hypothèse la plus probable est contraire : le signal est un artefact de méthode. La piste est réfutée si
    l''association disparaît quand le temps de suivi est compté à partir de la prescription et que l''antibiotique
    est comparé à un autre antibiotique.'
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « antibiotics chronic fatigue syndrome prevention after infection
    cohort immortal time bias », « doxycycline Q fever fatigue syndrome randomized trial ». Trouvé : un seul essai
    randomisé, dans la fatigue de la fièvre Q, où la doxycycline ne fait pas mieux que le placebo. Aucune contre-analyse
    de la base taïwanaise et aucun essai de prévention trouvés. Le registre ne cite pas les antibiotiques.'
  test_propose: 'Émulation d''un essai cible dans une base d''assurance maladie : inclusion le jour de la prescription,
    comparaison entre deux antibiotiques donnés pour la même infection (par exemple azithromycine contre amoxicilline),
    suivi d''un an, issue définie par un code spécifique et non par « malaise et fatigue ». Contrôle négatif : une
    issue sans lien attendu. Lecture fixée d''avance : si l''intervalle à 95 % du rapport de risques est compris
    entre 0,8 et 1,25, le signal publié est un artefact. Il ne mérite d''être poursuivi que si le rapport reste
    sous 0,8 avec un contrôle négatif neutre.'
  donnees_existantes: Base de l'assurance maladie de Taïwan ; toute base nationale de remboursement comparable
  risques: 'Biais de temps immortel très probable : la définition de l''exposition n''est pas décrite dans le texte
    lu et le biais n''y est pas traité. Codes de diagnostic peu spécifiques, qui incluent « malaise et fatigue »
    : l''incidence mesurée, 3,67 à 5,40 pour 1 000 personnes-années, est très élevée pour une maladie rare. Toutes
    les infections listées y augmentent le risque, de 9 % à 86 %, ce qui évoque un effet de surveillance. Résultat
    contraire : essai randomisé négatif de la doxycycline. Danger : les antibiotiques ont des effets indésirables
    et favorisent les résistances ; rien ici ne justifie d''en prendre.'
  niveau: C
  solidite_statistique: '395 811 personnes avec une infection, appariées à autant de témoins. Rapports de risques
    instantanés ajustés : doxycycline 0,10 (0,07–0,15), azithromycine 0,07 (0,05–0,10), moxifloxacine 0,05 (0,04–0,08),
    lévofloxacine 0,04 (0,03–0,06), ciprofloxacine 0,51 (0,31–0,83). Un risque divisé par dix à vingt-cinq par un
    antibiotique courant est invraisemblable : la taille de l''effet est le premier motif de doute. Six antibiotiques
    testés, pas de correction mentionnée. Essai randomisé Qure : 52 patients sous doxycycline et 52 sous placebo
    pendant 24 semaines ; fatigue finale 40,8 (37,3–44,3) contre 37,8 (34,2–41,2), sans avantage. Une seule équipe,
    aucune réplication. Biais principal : temps immortel et classement des cas.'
  sources:
  - titre: 'Increased risk of chronic fatigue syndrome following infection: a 17-year population-based cohort study
      (Journal of Translational Medicine, 2023), lu en partie'
    url: https://link.springer.com/article/10.1186/s12967-023-04636-z
