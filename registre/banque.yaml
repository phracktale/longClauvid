- id: B008
  titre: Des bactéries de l'intestin produisent du D-lactate qui passe dans le sang et trouble la cognition, comme
    dans l'acidose D-lactique du grêle court
  domaine_source: Acidose D-lactique du syndrome du grêle court
  processus_commun: D-lactate dans le plasma ou l'urine ; abondance des bactéries fécales qui en produisent
  enonce: Chez une partie des patients EM/SFC, une élévation modérée et chronique du D-lactate d'origine bactérienne
    contribuerait aux troubles cognitifs. Si c'est vrai, le D-lactate du sang est plus élevé que chez des témoins.
  pourquoi_inexploree: 'Europe PMC, « D-lactate OR D-lactic » avec les termes EM/SFC ou COVID long : 6 résultats.
    Une étude de selles (Sheedy 2009, 108 patients), une revue systématique qui réclame un dosage du D-lactate chez
    les patients (Wallis 2017), et un essai ouvert d''antibiotique et de probiotique sur 44 patients (Wallis 2018).
    Aucun dosage cas-témoins du D-lactate dans le sang n''a été trouvé, ni aucune étude dans le COVID long. ClinicalTrials.gov,
    « D-lactate OR D-lactic » et ces maladies : 7 fiches, dont aucune ne porte sur cette piste. Non trouvé ne veut
    pas dire inexistant.'
  test_propose: Doser le D-lactate, par un dosage qui lui est propre, dans du plasma ou de l'urine déjà conservés,
    chez des patients et des témoins. La piste est réfutée si les taux ne diffèrent pas.
  donnees_existantes: UK ME/CFS Biobank (plasma) ; biobanque RECOVER (sérum, urine, selles).
  risques: 'Dans l''essai ouvert de 2018, le rapport D-lactate sur L-lactate de l''urine n''a pas bougé alors que
    des symptômes s''amélioraient : cela va contre la piste. L''étude de 2009 repose sur des cultures de selles.
    Selon les auteurs de 2018, les streptocoques ne sont ni les seuls ni les premiers producteurs de D-lactate.
    Un essai ouvert ne sépare pas l''effet du traitement de l''effet placebo. L''acidose D-lactique vraie survient
    surtout chez des personnes au grêle court : la transposition à un intestin entier reste à prouver.'
  niveau: C
  sources:
  - titre: Increased d-lactic Acid intestinal bacteria in patients with chronic fatigue syndrome, In Vivo 2009 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/19567398/
    lu: page
