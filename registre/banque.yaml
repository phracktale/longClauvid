- id: B020
  titre: Un nombre de copies d'ADN mitochondrial génétiquement plus élevé est associé à moins d'EM/SFC
  domaine_source: Randomisation mendélienne sur les statistiques résumées de DecodeME
  processus_commun: Nombre de copies d'ADN mitochondrial dans les cellules du sang
  enonce: Un nombre de copies d'ADN mitochondrial bas, déterminé par les gènes, augmente le risque d'EM/SFC. L'hypothèse
    prédit le même effet avec un autre jeu de cas, et un nombre de copies plus bas, mesuré directement, chez les
    malades. Elle est réfutée si la randomisation mendélienne ne se réplique pas ou si la mesure directe ne montre
    aucun écart.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « mitochondrial DNA copy number ME/CFS long COVID case-control
    », « myalgic encephalomyelitis Mendelian randomization DecodeME ». Trouvé : des études de la fonction mitochondriale
    dans le COVID long, lues par leur titre, et une seule randomisation mendélienne, en prépublication. Aucune réplication
    et aucun essai fondé sur ce marqueur trouvés. Le registre cite DecodeME (P13) pour ses huit régions, pas pour
    cette analyse.'
  test_propose: 'Premier test : refaire la randomisation mendélienne sur un jeu de cas indépendant, avec les mêmes
    instruments, plus la médiane pondérée et l''ordonnée de la méthode d''Egger. La piste tient si le rapport de
    cotes reste sous 1 avec un intervalle qui exclut 1 et si l''ordonnée d''Egger ne s''écarte pas de zéro. Second
    test : dans UK Biobank, comparer le nombre de copies estimé chez les 1 455 cas et chez les témoins, à numération
    sanguine égale. Réfutation : écart standardisé dont l''intervalle exclut −0,1.'
  donnees_existantes: Statistiques résumées de DecodeME ; étude pangénomique du nombre de copies ; UK Biobank (estimation
    du nombre de copies à vérifier)
  risques: 'Prépublication non relue par des pairs. Pléiotropie : le nombre de copies mesuré dans le sang dépend
    probablement de la composition en cellules sanguines, et le volume plaquettaire ressort dans la même analyse
    ; à vérifier. Neuf expositions testées. Les témoins de DecodeME viennent d''UK Biobank, source fréquente des
    instruments : le recouvrement d''échantillons peut biaiser l''estimation, à vérifier. Un effet génétique sur
    toute la vie ne dit pas qu''une intervention chez un malade changerait quelque chose.'
  niveau: C
  solidite_statistique: '15 579 cas d''EM/SFC. Rapport de cotes d''environ 0,83 par écart type de nombre de copies,
    méthode de la variance inverse pondérée ; intervalle de confiance et valeur de p non donnés dans le texte lu.
    Seuil de Bonferroni annoncé : p inférieur à 5,6 × 10⁻³ pour neuf expositions. Hétérogénéité faible pour ce marqueur
    (Q de Cochran 87,7 pour 82 degrés de liberté, p = 0,31). Deux autres résultats de la même analyse sont plus
    fragiles : glycoprotéines acétylées, rapport d''environ 1,12 (hétérogénéité p = 0,011) ; volume plaquettaire
    moyen, environ 1,09 (hétérogénéité p = 2,3 × 10⁻⁶). Test de direction de Steiger favorable. Ordonnée d''Egger
    et analyse inverse non trouvées dans le texte. Aucune réplication. Biais principal : pléiotropie horizontale.'
  sources:
  - titre: Insights into Pathophysiological Pathways in ME/CFS Through Genetic Correlation and Mendelian Randomization
