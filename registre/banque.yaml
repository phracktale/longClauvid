- id: B015
  titre: Une infection pendant la grossesse est suivie de moins de COVID long qu'une infection hors grossesse
  domaine_source: Expérience naturelle sur dossiers médicaux électroniques, deux réseaux américains
  processus_commun: 'État immunitaire de la grossesse : tolérance, inflammation modifiée'
  enonce: L'état immunitaire de la grossesse au moment de l'infection réduit le risque de COVID long. L'hypothèse
    prédit un effet lié à la grossesse elle-même, et non au profil des femmes enceintes. Elle est réfutée si les
    mêmes femmes, infectées juste avant la conception ou après le post-partum, montrent la même baisse de risque.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « pregnancy long COVID lower risk mechanism immune tolerance
    », « ME/CFS pregnancy symptom improvement cohort ». Trouvé : l''étude d''origine et ses reprises dans la presse.
    Aucune étude du mécanisme et aucune réplication hors des États-Unis trouvées. Recoupement à signaler : l''hypothèse
    H5 du registre porte sur les hormones sexuelles. Ce qui est nouveau ici est l''expérience naturelle et le versant
    immunitaire.'
  test_propose: 'Dans les mêmes réseaux, comparer trois fenêtres d''infection chez des femmes ayant accouché : l''année
    avant la conception, la grossesse, les six à douze mois après l''accouchement. Chaque femme est comparée à des
    femmes du même âge infectées le même mois. Seuil fixé d''avance : la piste tient si le rapport de risques pendant
    la grossesse reste sous 1 avec un intervalle qui exclut 1, et si celui des deux autres fenêtres inclut 1. Si
    les trois fenêtres montrent la même baisse, il s''agit d''un effet de sélection. Contrôle négatif : une issue
    sans lien attendu, comme une fracture.'
  donnees_existantes: N3C et PCORnet (programme RECOVER) ; registres nordiques des naissances, à vérifier
  risques: 'Sélection : les femmes enceintes sont en meilleure santé que leurs témoins, même appariées. Classement
    : la fatigue après un accouchement peut être attribuée à la maternité et non codée comme COVID long, ce qui
    crée une fausse protection. Les deux réseaux mesurent des incidences qui vont presque du simple au quadruple,
    signe d''une définition fragile. Statut vaccinal manquant pour plus de 82 % des femmes enceintes. À l''inverse,
    le suivi rapproché de la grossesse aurait dû augmenter les diagnostics.'
  niveau: B
  solidite_statistique: '29 975 femmes enceintes dans PCORnet et 42 176 dans N3C. Incidence cumulée à 180 jours
    : 16,47 pour 100 (16,00–16,95) contre 18,88 dans PCORnet ; 4,37 (4,18–4,57) contre 6,21 dans N3C. Rapports de
    risques instantanés ajustés : 0,86 (0,83–0,90) et 0,70 (0,66–0,74). Le risque est plus haut pour une infection
    aux deux premiers trimestres qu''au troisième. Une seule étude, deux réseaux, la même équipe. Valeur E calculée
    en Python (formule de VanderWeele et Ding, rapport pris comme rapport de risques) : 1,60 et 2,21 ; 1,46 et 2,04
    pour la borne la plus proche de 1. Un facteur de confusion modéré suffirait donc à expliquer le résultat de
    PCORnet. Biais principal : sélection et classement des cas.'
  sources:
  - titre: Long COVID after SARS-CoV-2 during pregnancy in the United States (Nature Communications, 2025, DOI 10.1038/s41467-025-57849-9),
      résumé par Europe PMC
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:40169569%20AND%20SRC:MED&resultType=core&format=json
    lu: page
  - titre: Pregnancy linked to lower long COVID risk in study of over 70,000 women (News-Medical)
    url: https://www.news-medical.net/news/20250402/Pregnancy-linked-to-lower-long-COVID-risk-in-study-of-over-70000-women.aspx
    lu: page
  - titre: Pregnancy may reduce long COVID risk (Cornell Chronicle)
    url: https://news.cornell.edu/node/330623
    lu: page
