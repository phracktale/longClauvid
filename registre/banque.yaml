    url: https://cureme.lshtm.ac.uk/?p=431
    lu: page
  - titre: Over 1.4 million biosamples available in RECOVER's biorepository to support Long COVID research
    url: https://recovercovid.org/news/over-14-million-biosamples-available-recovers-biorepository-support-long-covid-research
    lu: page
  - titre: 'The UK ME/CFS Biobank: A Disease-Specific Biobank for Advancing Clinical Research Into ME/CFS, Frontiers
      in Neurology 2018 (texte intégral ; ajoutée à la relecture, la page de la biobanque étant bloquée)'
    url: https://pubmed.ncbi.nlm.nih.gov/30564186/
    lu: page
  origine: agent biologie
  date: '2026-11-22'
  statut: à vérifier
  relecture:
    date: '2026-11-22'
    lecture: '7 sources rouvertes : 5 en texte intégral, 1 par son résumé, 1 page bloquée.'
    affirmations: '23 affirmations contrôlées : 19 confirmées, 4 non trouvées.'
    corrections:
    - 'Aucune source ne montre de D-lactate dans le sang des patients : le titre énonce une hypothèse.'
    - Dans l'essai ouvert de 2018, deux des trois critères principaux sont nuls (sommeil mesuré, humeur), et le
      rapport D-lactate sur L-lactate de l'urine augmente chez 21 patients sur 38.
    - La revue de 2015 écrit que le D-lactate ne suit pas l'état clinique dans l'acidose vraie.
    - L'étude de 2009 n'a été relue que par son résumé.
    inexploree: 'L''affirmation tient : aucun dosage sanguin cas-témoins, aucune étude dans le COVID long, aucun
      essai enregistré.'
    decision: 'Relecture incomplète : l''étude de 2009 qui porte le signal n''est accessible que par son résumé,
      le site de la revue étant bloqué. La piste reste à vérifier jusqu''à la lecture de son texte ; un dosage sur
      plasma conservé suffirait à la réfuter.'
- id: B009
  titre: Une partie des patients EM/SFC manque de vasopressine, comme dans le diabète insipide central partiel
  domaine_source: Déficit en arginine-vasopressine (diabète insipide central) ; tachycardie posturale
  processus_commun: Copeptine plasmatique sous stimulation osmotique ; osmolalité du plasma et de l'urine après
    une nuit sans boire
  enonce: Un déficit partiel de sécrétion de vasopressine entretiendrait le manque de volume sanguin et l'intolérance
    à la station debout chez une partie des patients. Si c'est vrai, leur copeptine reste basse après une perfusion
    de sérum salé hypertonique, le test qui identifie le diabète insipide central.
  pourquoi_inexploree: 'Europe PMC, « copeptin OR vasopressin » avec les termes EM/SFC ou COVID long : 13 résultats.
    Deux études de mesure dans l''EM/SFC, par deux équipes : 18 patients et 15 témoins (Miwa 2017), puis 124 patients
    sans groupe témoin (Huhmar 2026). Dans le COVID long, un cas publié de déficit en vasopressine. Aucun test de
    stimulation de la copeptine n''a été trouvé. ClinicalTrials.gov, « desmopressin OR vasopressin OR copeptin »
    et ces maladies : 0 essai. Non trouvé ne veut pas dire inexistant.'
  test_propose: 'Première étape, sur du plasma conservé : comparer la copeptine et l''osmolalité des patients et
    des témoins. Étape décisive, sur nouvelle collecte : la copeptine après sérum salé hypertonique. La piste est
    réfutée si la copeptine stimulée dépasse le seuil qui écarte un déficit.'
  donnees_existantes: Série de 124 patients de Huhmar 2026, où osmolalités et vasopressine sont déjà mesurées. UK
    ME/CFS Biobank (plasma) pour une copeptine de base. Aucune cohorte avec test de stimulation n'a été trouvée.
  risques: 'Dans l''étude de 2026, la copeptine était dans les normes chez les 13 patients testés, plutôt vers le
    bas : cela affaiblit la piste. Cette étude n''a pas de groupe témoin, d''où le niveau C malgré deux équipes.
    Le test de référence sert justement à distinguer un vrai déficit d''une soif excessive : une vasopressine basse
    ne suffit pas. La desmopressine est un médicament à risque : elle peut causer une hyponatrémie (un cas avec
    hospitalisation dans l''étude de référence sur la copeptine). Dans la tachycardie posturale, son effet n''a
    été mesuré que sur quatre heures ; dans l''EM/SFC, sur cinq jours chez 10 patients, sans placebo. Relecture
    du 2026-11-22, grille statistique : doutes aux questions 1, 2, 3, 6, 7 et 10. Le signal n''est lu que par deux
    résumés ; le seuil du test n''est pas chiffré dans la fiche, alors que la source en donne un.'
  niveau: C
  sources:
  - titre: Low Vasopressin in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome, Endocrine Practice 2026 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/41475665/
    lu: page
  - titre: Down-regulation of renin-aldosterone and antidiuretic hormone systems in patients with ME/CFS, Journal
      of Cardiology 2017 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/27401397/
    lu: page
  - titre: Arginine-vasopressin deficiency due to long COVID-associated infundibulo-neurohypophysitis, Archives
      of Endocrinology and Metabolism 2025 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/40215290/
    lu: page
  - titre: A Copeptin-Based Approach in the Diagnosis of Diabetes Insipidus, New England Journal of Medicine 2018
      (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/30067922/
    lu: page
  - titre: Desmopressin acutely decreases tachycardia and improves symptoms in the postural tachycardia syndrome,
      Heart Rhythm 2012 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/22561596/
    lu: page
  - titre: UK ME/CFS Biobank, Samples & Data
    url: https://cureme.lshtm.ac.uk/?p=431
    lu: page
  - titre: 'The UK ME/CFS Biobank: A Disease-Specific Biobank for Advancing Clinical Research Into ME/CFS, Frontiers
      in Neurology 2018 (texte intégral ; ajoutée à la relecture, la page de la biobanque étant bloquée)'
    url: https://pubmed.ncbi.nlm.nih.gov/30564186/
    lu: page
  - titre: Abnormal arginine-vasopressin secretion and water metabolism in patients with postviral fatigue syndrome,
      Acta neurologica Scandinavica 1993 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/8475696/
    lu: page
  origine: agent biologie
  date: '2026-11-22'
  statut: à vérifier
  relecture:
    date: '2026-11-22'
    lecture: '7 sources rouvertes : 3 en texte intégral, 3 par leur résumé, 1 page bloquée.'
    affirmations: '18 affirmations contrôlées : 11 confirmées, 1 inexacte, 6 non trouvées.'
    corrections:
    - 'COVID long : la source compte trois cas de déficit en vasopressine conformes aux critères de l''OMS, et non
      un seul.'
    - 'Dans l''étude de 2026, la vasopressine est indétectable chez 82 % des patients alors que la copeptine est
      normale chez les 13 testés : les deux mesures se contredisent, et un défaut du dosage de la vasopressine n''est
      pas exclu.'
    - 'Les résumés ne disent ni si l''étude de 2026 a des témoins, ni si celle de 2017 a un placebo : ces deux affirmations
      de la fiche restent à contrôler.'
    inexploree: 'Une étude manquait : en 1993, une épreuve de charge et de restriction en eau chez 9 patients atteints
      de fatigue post-virale et 8 témoins trouvait une vasopressine de base basse et une sécrétion erratique (PMID
      8475696). Aucun test de stimulation de la copeptine, aucun essai enregistré.'
    decision: 'Relecture incomplète : les deux études qui portent le signal ne sont accessibles que par leur résumé.
      La piste reste à vérifier jusqu''à la lecture de leur texte.'
- id: B010
  titre: L'endothéline-1 reste élevée après l'infection ; ses récepteurs se bloquent par des médicaments de l'hypertension
    artérielle pulmonaire
  domaine_source: Hypertension artérielle pulmonaire
  processus_commun: Endothéline-1 circulante
  enonce: Chez une partie des patients, un excès durable d'endothéline-1, qui règle le tonus des vaisseaux, réduirait
    l'irrigation des tissus et du cerveau. Si c'est vrai, l'endothéline-1 est liée à la baisse du débit sanguin
    cérébral en position debout et à la sévérité, et elle est normale chez les personnes rétablies.
  pourquoi_inexploree: 'Europe PMC, « endothelin » dans le titre avec les termes EM/SFC ou COVID long : 7 résultats.
    Le marqueur est trouvé élevé par au moins trois équipes (Haffke 2022 ; Willems 2022 ; Cambras 2023 et Domingo
    2024, même équipe). Deux études chez le hamster, d''une même équipe, montrent que le macitentan, antagoniste
    des récepteurs, limite les lésions articulaires après l''infection (2024, 2026). ClinicalTrials.gov, « bosentan
    OR macitentan OR ambrisentan OR aprocitentan OR sparsentan OR endothelin receptor antagonist » et ces maladies
    : 0 essai. C''est le levier qui est inexploré, pas la mesure. Non trouvé ne veut pas dire inexistant.'
  test_propose: Sur des données déjà recueillies, croiser l'endothéline-1 avec le débit sanguin cérébral au test
    d'inclinaison et avec la sévérité des symptômes. La piste est réfutée si l'endothéline-1 n'est liée ni à l'un
    ni à l'autre.
  donnees_existantes: 'Cohorte de Haffke 2022 : patients, témoins sains et personnes rétablies du COVID. Cohorte
    de Domingo 2024 : 31 patients EM/SFC, 23 COVID long, 31 témoins, avec test debout de 10 minutes. Série du Brigham
    and Women''s Faulkner Hospital avec débit cérébral au test d''inclinaison (Novak 2026), si du sérum y est conservé.
    Biobanque RECOVER (sérum).'
  risques: 'Les antagonistes des récepteurs de l''endothéline sont des médicaments à risque sérieux. La notice américaine
    du macitentan porte un avertissement encadré de toxicité pour l''embryon et le fœtus ; elle signale aussi toxicité
    pour le foie, rétention d''eau, baisse de l''hémoglobine et, après commercialisation, hypotension symptomatique.
    Or l''hypotension orthostatique neurogène touche 15 % des patients de la série de Novak 2026. Les preuves animales
    portent sur l''articulation, pas sur la fatigue. Dans l''étude de Willems, l''endothéline-1 était élevée sans
    dysfonction des gros vaisseaux. Une endothéline élevée peut être le signe d''une lésion de l''endothélium, pas
    la cause des symptômes. Relecture du 2026-11-22, grille statistique : doutes aux questions 2, 4, 6, 7 et 10.
    Études transversales, sévérité mesurée par questionnaires ; une endothéline-1 élevée peut marquer la lésion
    des vaisseaux sans causer les symptômes.'
