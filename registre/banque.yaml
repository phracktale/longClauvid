    url: https://pubmed.ncbi.nlm.nih.gov/42961163/
    lu: page
  - titre: Farnesoid X receptor enhances epithelial ACE2 expression and inhibits virally induced IL-6 secretion,
      American Journal of Physiology Gastrointestinal and Liver Physiology 2023 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/37697930/
    lu: page
