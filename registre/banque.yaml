    url: https://www.medrxiv.org/content/10.1101/2024.10.07.24315052v1.full
    lu: page
  - titre: Initial findings from the DecodeME genome-wide association study of ME/CFS (medRxiv)
    url: https://www.medrxiv.org/content/10.1101/2025.08.06.25333109v1.full-text
    lu: page
