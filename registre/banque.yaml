  origine: agent biologie
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '9 sources rouvertes : 6 en texte intégral, 2 par leur résumé, 1 page bloquée.'
    affirmations: '18 affirmations contrôlées : 15 confirmées, 3 non trouvées.'
    corrections:
    - 'Le lien entre plasmalogènes bas et défaut des peroxysomes est une inférence : l''étude de 2022 ne mesure
      pas les peroxysomes.'
    - Dans l'étude de 2022, deux plasmalogènes seulement passent les seuils, avec de petits écarts et un taux de
      fausses découvertes admis à 15 % ; rien ne ressort chez les hommes.
    - L'étude de Science 2025 ne porte chez l'humain que sur 8 patients atteints de fibrose pulmonaire ; le traitement
      est testé sur 6 souris contre 6. L'université a déposé un brevet sur le ciblage des peroxysomes.
    - L'essai dans la maladie d'Alzheimer est financé par une société savante du plasmalogène ; un industriel a
      fourni le produit et des auteurs ont déposé des brevets.
    - Le plasma de la biobanque britannique est surtout prélevé sur héparine, celui de l'étude de 2022 sur EDTA.
    inexploree: 'Aucun essai enregistré. Deux travaux manquaient : une métabolomique de 2016 sur 45 patients EM/SFC,
      d''une autre équipe, qui range le métabolisme des peroxysomes parmi vingt voies anormales (PMID 27573827)
      ; une étude de 2023 qui trouve les facteurs de biogenèse des peroxysomes abaissés dans le cerveau de 12 personnes
      décédées du COVID-19 (PMID 37190821). Des lipidomiques du COVID long existent (PMID 38368647, 147 patients
      ; PMID 40842862) : leurs résumés ne chiffrent pas les plasmalogènes, mais leurs données pourraient suffire
      au test. La phrase « pas encore mesurés dans le COVID long » n''est plus sûre.'
    decision: 'Gardée après corrections. Demander les plasmalogènes aux auteurs des lipidomiques déjà faites reste
      le premier pas le moins coûteux, mais rien ne montre que leurs données suffisent au test : l''une n''a pas
      de groupe rétabli nommé, l''autre décrit un métabolisme des lipides éthers renforcé, de sens contraire.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections. Premier pas le moins coûteux : demander les plasmalogènes aux
        auteurs des lipidomiques déjà faites.'
      constats:
      - Quatorze des seize faits contrôlés sont confirmés.
      - 'La lipidomique de 2024 compare des patients symptomatiques et asymptomatiques après le COVID-19 : son résumé
        ne nomme ni groupe rétabli ni plasmalogènes. Rien ne montre que ses données suffisent au test.'
      - 'La lipidomique de 2025 a déposé ses données, mais elle décrit un métabolisme des lipides éthers renforcé
        dans deux sous-groupes de patients : au niveau des voies, le sens est contraire à la piste.'
      - 'Dans l''étude de Science, la baisse des lipides éthers est propre aux macrophages des alvéoles, et les
        protéines des peroxysomes sont revenues à la normale au 21e jour : aucune source ne relie un défaut du tissu
        aux plasmalogènes du sang.'
      - Le test n'a pas de seuil, alors que les écarts de 2022 sont de l'ordre de 3 % sur l'échelle logarithmique.
      suite: 'Décision reformulée : vérifiée, niveau C. La demande aux auteurs pose d''abord deux questions : les
        plasmalogènes ont-ils été mesurés, et un groupe de personnes rétablies existe-t-il ?'
- id: B003
  titre: Le SARS-CoV-2 abaisse durablement l'orexine de l'hypothalamus, le neuropeptide qui manque dans la narcolepsie
    de type 1
  domaine_source: Narcolepsie de type 1
  processus_commun: Taux d'orexine A (hypocrétine-1) dans le liquide céphalo-rachidien
  enonce: Une partie des patients COVID long ou EM/SFC aurait un déficit partiel en orexine, le neuropeptide de
    l'éveil. Ce déficit contribuerait à la somnolence et au sommeil non réparateur. Si c'est vrai, leur orexine
    A du liquide céphalo-rachidien est plus basse que celle de témoins.
  pourquoi_inexploree: 'Europe PMC, « orexin OR hypocretin » avec les termes EM/SFC ou COVID long : 15 résultats.
    On y trouve des revues, une étude chez la souris (2026), un cas de narcolepsie de type 1 après COVID (2026)
    et un dosage dans le plasma de 14 survivants de réanimation (2025). Aucun dosage dans le liquide céphalo-rachidien
    de patients COVID long ou EM/SFC n''a été trouvé. ClinicalTrials.gov, « orexin OR hypocretin OR daridorexant
    OR suvorexant OR oveporexton » et ces maladies : 0 essai. Non trouvé ne veut pas dire inexistant.'
  test_propose: Doser l'orexine A dans du liquide céphalo-rachidien déjà prélevé chez des patients et des témoins.
    La piste est réfutée si les taux sont normaux, y compris chez les patients les plus somnolents.
  donnees_existantes: Liquide céphalo-rachidien de l'étude du NIH (16 patients EM/SFC post-infectieuse, 21 témoins),
    de 7 patients neuro-COVID long revus au NIH, et de 34 patients EM/SFC ayant eu une ponction lombaire (Jolley
    2026). La conservation de ces prélèvements est à confirmer auprès des équipes.
  risques: 'Le lien repose sur un modèle animal d''une seule équipe et sur un cas clinique. Dans la sclérose en
    plaques, l''orexine A du liquide céphalo-rachidien n''est pas déficitaire et n''est liée ni à la fatigue ni
    à la somnolence. Le dosage exige une ponction lombaire. Les agonistes du récepteur 2 de l''orexine sont des
    médicaments récents et à risque : l''essai du premier, TAK-994, a été arrêté pour des effets indésirables hépatiques
    ; sous oveporexton, la majorité des participants ont eu une insomnie transitoire et des envies fréquentes d''uriner.
    Leur effet sur le malaise après effort est inconnu. Relecture du 2026-11-22, grille statistique : doutes aux
    questions 2, 3, 4, 7, 8 et 10. Trois à cinq souris mâles par groupe ; le suivi long ne porte que sur les souris
    survivantes ; aucune mesure du sommeil ni de la fatigue chez l''animal.'
  niveau: D
  sources:
  - titre: SARS-CoV-2 infection is associated with hypothalamic orexin suppression and persistent cortical NeuN
      attenuation, Journal of Neuroinflammation 2026 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/42087199/
