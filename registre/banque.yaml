- id: B013
  titre: La région HLA de classe II est associée au COVID long et à l'EM/SFC dans deux études génétiques indépendantes
  domaine_source: Études d'association pangénomique, avec imputation des allèles HLA
  processus_commun: Présentation des antigènes par les molécules HLA de classe II (DQ, DR) aux lymphocytes T CD4
  enonce: 'Les deux maladies partagent un terrain HLA de classe II : la façon dont l''antigène est présenté aux
    lymphocytes T pèse sur le risque. L''hypothèse prédit qu''un même allèle ou un même haplotype DQ–DR est associé
    aux deux maladies, dans le même sens. Elle est réfutée si aucun des allèles désignés par une étude n''est retrouvé
    dans l''autre.'
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « HLA-DRB1*11:04 long COVID », « HLA-DQA1 long COVID replication
    », « HLA class II T cell long COVID 2025 2026 ». Trouvé : une seule étude dédiée, iranienne, de 88 cas et 96
    témoins, en typage de basse résolution. Aucun croisement publié des allèles entre les deux études pangénomiques
    n''a été trouvé. Aucun essai ne sélectionne des patients sur le HLA. Le registre cite DecodeME (piste P13) pour
    ses huit régions, pas pour le HLA. Non trouvé ne veut pas dire inexistant.'
  test_propose: 'Sur les statistiques résumées, quatre tests fixés d''avance : le variant rs9273363, l''allèle DRB1*11:04
    et l''allèle DQA1*03:01 dans DecodeME ; l''allèle DQA1*05:01 dans l''étude 23andMe. Seuil : même sens et p inférieur
    à 0,05/4. Si aucun des quatre ne passe, l''hypothèse d''un terrain commun est réfutée et il reste deux signaux
    propres à chaque maladie. Effectif nécessaire, calculé en Python (test allélique, approximation normale, 10
    témoins par cas, puissance 90 %, alpha 0,05) : 4 367 cas pour un rapport de cotes de 0,917 à une fréquence de
    23,2 % ; 8 106 cas pour un rapport de 1,06 à une fréquence supposée de 30 %.'
  donnees_existantes: Statistiques résumées de DecodeME ; statistiques de l'étude 23andMe (accès à vérifier) ; étude
    pangénomique du COVID long de l'initiative COVID-19 HGI
  risques: 'Les allèles diffèrent entre les deux études et leur sens n''est pas comparable en l''état : DRB1*11:04
    augmente le risque de COVID long, DQA1*05:01 semble protéger de l''EM/SFC. L''étude iranienne trouve DRB1*11
    moins fréquent chez les malades, à l''inverse de 23andMe. Les témoins ne sont pas les mêmes : personnes infectées
    sans COVID long d''un côté, population générale de l''autre. La région HLA varie beaucoup selon l''origine géographique,
    ce qui expose à un biais de stratification. Les effets sont trop petits pour trier des patients. Le signal ne
    désigne ni un antigène ni un médicament.'
  niveau: B
  solidite_statistique: 'COVID long : 54 390 cas et 124 777 témoins, tous auto-déclarés. Variant rs9273363 : rapport
    de cotes 1,06 (IC à 95 % : 1,04–1,08), p = 3,79 × 10⁻¹¹. Allèle DRB1*11:04 : 1,18 (1,11–1,24), p = 7,0 × 10⁻⁹,
    parmi 855 allèles testés. Effets semblables dans trois groupes d''ascendance (hétérogénéité p = 0,75) et après
    ajustement sur l''hospitalisation. Non retrouvé de façon significative dans l''étude HGI (6 450 cas, 46 208
    témoins) ; puissance de cette étude calculée entre 0,46 et 0,87 selon la fréquence de l''allèle, que l''article
    ne donne pas. EM/SFC : 15 579 cas et 259 909 témoins ; DQA1*05:01 à 21,7 % chez les cas contre 23,2 % chez les
    témoins, p = 1,4 × 10⁻¹⁰, soit un rapport de cotes de 0,917 calculé à partir de ces fréquences. Autres allèles
    de 23andMe : DQA1*03:01 à 0,95 (0,93–0,97), C*07:01 à 0,94, B*08:01 à 0,93. Les deux études ont été lues en
    prépublication. Biais principal : classement des cas par auto-déclaration.'
  sources:
  - titre: Multi-ancestry GWAS of Long COVID identifies immune-related loci and etiological links to chronic fatigue
      syndrome, fibromyalgia and depression (medRxiv, 23andMe)
    url: https://www.medrxiv.org/content/10.1101/2024.10.07.24315052v1.full
