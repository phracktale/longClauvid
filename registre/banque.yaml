- id: B017
  titre: L'EM/SFC porte une signature sanguine de résistance à l'insuline et d'atteinte du foie que l'inactivité
    n'explique pas
  domaine_source: Biomarqueurs sanguins de grandes cohortes (UK Biobank, All of Us) et analyse a posteriori d'un
    essai
  processus_commun: Résistance à l'insuline, enzymes du foie élevées, inflammation de bas grade
  enonce: Une résistance à l'insuline et une atteinte hépatique précèdent l'EM/SFC et y contribuent ; elles n'en
    sont pas la conséquence. L'hypothèse prédit que ces marqueurs sont déjà déplacés avant le diagnostic. Elle est
    réfutée s'ils sont normaux chez les personnes qui ne tomberont malades que plus tard.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « insulin resistance ME/CFS metformin trial », « liver enzymes
    myalgic encephalomyelitis cohort », « pioglitazone long COVID ». Trouvé : aucun essai dans l''EM/SFC qui sélectionne
    sur ces marqueurs. Dans le COVID long installé, l''essai REVIVE compare metformine, fluvoxamine et placebo chez
    1 500 participants, sans sélection sur la résistance à l''insuline et en excluant les diabétiques des bras metformine.
    Le registre affirme qu''aucune étude de la metformine n''existe sur un COVID long installé : ce protocole enregistré
    le contredit ; l''avancement de l''essai n''a pas été vérifié. Aucune étude des cas incidents n''a été trouvée.'
  test_propose: 'Dans UK Biobank, prendre les personnes sans diagnostic au prélèvement de 2006–2010 et qui reçoivent
    ensuite un code d''EM/SFC ou de fatigue post-virale. Comparer leurs marqueurs de départ (rapport triglycérides
    sur HDL, indice TyG, ALT, GGT, HbA1c) à ceux de témoins appariés sur l''âge, le sexe et l''indice de masse corporelle.
    Seuil : écart standardisé d''au moins 0,2, à p inférieur à 0,05/14. Réfutation : intervalles tous compris entre
    −0,1 et 0,1. Effectif calculé en Python (test bilatéral, témoins très nombreux, puissance 90 %) : 441 cas incidents
    pour un écart de 0,2 ; 196 pour 0,3. Le nombre de cas incidents disponibles reste à vérifier. Contrôle négatif
    : un marqueur sans lien attendu.'
  donnees_existantes: UK Biobank (biochimie, métabolomique, dossiers médicaux liés) ; All of Us ; statistiques résumées
    de DecodeME pour une randomisation mendélienne
  risques: 'Causalité inverse : le sang a été prélevé au moment où la maladie était déjà déclarée. Médicaments,
    alimentation et prise de poids des malades peuvent déplacer ces marqueurs ; l''analyse de médiation repose sur
    des mesures d''activité déclarées. Diagnostic auto-déclaré. Biais du volontaire en bonne santé : les formes
    sévères sont probablement absentes. L''ajustement sur l''indice de masse corporelle n''a pas pu être vérifié
    à la lecture. Danger : cette piste ne justifie aucune prise d''antidiabétique hors essai.'
  niveau: B
  solidite_statistique: '1 455 cas auto-déclarés et 131 303 témoins. 116 marqueurs diffèrent chez les femmes et
    chez les hommes ; 91 % des écarts sont petits à moyens (d de Cohen entre 0,2 et 0,5). Sont élevés : protéine
    C-réactive, cystatine C, leucocytes, rapport triglycérides sur HDL, indice TyG, ALT, ALP, GGT, HbA1c. Neuf marqueurs
    sur quatorze retrouvés dans All of Us. Avec l''activité comme médiateur, un seul effet indirect significatif
    sur 3 237. Corrélation génétique avec le diabète de type 2 de 0,15 (p = 3 × 10⁻¹⁰) dans une prépublication sur
    DecodeME. Côté COVID long : essai de la vortioxétine, 147 patients randomisés ; interaction entre traitement,
    temps, protéine C-réactive, rapport triglycérides sur HDL et indice de masse corporelle, p = 0,011, analyse
    non prévue au protocole. Biais principal : causalité inverse.'
