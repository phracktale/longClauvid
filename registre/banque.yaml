- id: B007
  titre: Le cibinétide, agoniste du récepteur de réparation innée, fait repousser les petites fibres nerveuses perdues
    dans le COVID long comme dans la sarcoïdose
  domaine_source: Neuropathie des petites fibres de la sarcoïdose
  processus_commun: Densité des fibres nerveuses de la cornée en microscopie confocale ; fibres nerveuses de l'épiderme
    sur biopsie de peau
  enonce: La perte de petites fibres nerveuses mesurée dans le COVID long et l'EM/SFC serait réversible par le levier
    testé dans la sarcoïdose. Si c'est vrai, chez des patients choisis pour des fibres cornéennes raréfiées, 28
    jours de cibinétide augmentent ces fibres davantage que le placebo.
  pourquoi_inexploree: 'Europe PMC, « cibinetide OR ARA 290 OR innate repair receptor » avec les termes EM/SFC ou
    COVID long : 0 résultat. ClinicalTrials.gov, « cibinetide OR ARA 290 OR erythropoietin » et ces maladies : 0
    essai. Le marqueur, lui, est documenté : « corneal confocal » avec ces maladies donne 7 résultats, dont deux
    études cas-témoins dans le COVID long, et la neuropathie des petites fibres y est décrite sur biopsie de peau.
    C''est donc le levier qui est inexploré, pas la mesure. Non trouvé ne veut pas dire inexistant.'
  test_propose: 'Avant tout essai, vérifier dans les cohortes déjà suivies que les fibres cornéennes remontent quand
    les symptômes s''améliorent. La piste est réfutée si la densité des fibres n''est liée ni aux symptômes ni à
    leur évolution : réparer les fibres serait alors sans objet.'
  donnees_existantes: 'Cohortes de microscopie confocale de la cornée : 40 personnes après COVID (Bitirgen 2022)
    et 60 patients COVID long (Cañadas 2023). Série du Brigham and Women''s Faulkner Hospital avec biopsies de peau
    : 143 patients COVID long et 170 patients EM/SFC (Novak 2026).'
  risques: 'Le niveau B vaut pour la perte de fibres, décrite par plusieurs équipes ; l''effet du levier dans nos
    maladies reste une hypothèse. Dans la sarcoïdose, l''essai ne dure que 28 jours sur 64 patients ; seule la dose
    de 4 mg a atteint le critère, et la douleur n''a pas baissé de façon significative contre placebo. Sur ClinicalTrials.gov,
    la recherche « cibinetide OR ARA 290 » ne trouve aucun essai en cours de la molécule ; les essais repérés se
    sont achevés ou arrêtés entre 2014 et 2017 : sa disponibilité est incertaine. La perte de fibres peut être une
    conséquence et non une cause des symptômes. Molécule expérimentale, testée en phase 2 : à n''envisager que dans
    un essai.'
  niveau: B
  sources:
  - titre: Cibinetide Improves Corneal Nerve Fiber Abundance in Patients With Sarcoidosis-Associated Small Nerve
