    url: https://clinicaltrials.gov/study/NCT07280572
    lu: extrait
  - titre: Effect of Metformin in Reducing Fatigue in Long COVID in Adolescents, NCT06147050 (titre seul ; ajoutée
      à la relecture)
    url: https://clinicaltrials.gov/study/NCT06147050
    lu: extrait
  origine: agent statistique
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '6 sources rouvertes : 4 en texte intégral, 1 par son résumé, 1 page lue en partie.'
    affirmations: '35 affirmations contrôlées : 25 confirmées, 3 inexactes, 7 non trouvées.'
    corrections:
    - 'REVIVE est terminé et publié : 399 participants inclus, et non 1 500 ; le bras metformine a été arrêté pour
      futilité en septembre 2024 après un changement de dose, et son résultat est jugé non concluant (PMID 42832803,
      version republiée après rétractation).'
    - 'Aucune source ne teste l''antériorité des marqueurs : les auteurs de l''étude d''origine disent ne rien affirmer
      de causal.'
    - L'article publié comporte une analyse ajustée sur l'indice de masse corporelle, que la fiche disait n'avoir
      pas pu vérifier.
    - La valeur p = 0,011 de l'essai de la vortioxétine est celle du modèle ajusté ; le modèle non ajusté donne
      0,018.
    - Seule la moitié environ des cas d'UK Biobank répond aux critères canadiens ; dans All of Us, cinq marqueurs
      sur quatorze ne sont pas retrouvés.
    - La randomisation mendélienne citée ne trouve pas d'effet causal des triglycérides.
    - 'Niveau ramené de B à C : B vaut pour l''association transversale, retrouvée dans deux cohortes par la même
      équipe ; l''énoncé de la piste, lui, n''a aucune donnée.'
    inexploree: 'La metformine a déjà été testée sur un COVID long installé, sans sélection sur la résistance à
      l''insuline : outre REVIVE, un essai coréen de 14 jours chez 396 adultes ne fait pas mieux que le placebo
      (PMID 41771135). Elle est à l''essai dans une plateforme canadienne (NCT07280572) et chez l''adolescent (NCT06147050,
      statut inconnu). Une méta-analyse de 56 études trouve un indice de résistance à l''insuline plus élevé dans
      le COVID long (PMID 42410961). Aucune étude des cas incidents d''EM/SFC n''a été trouvée : le test proposé
      reste à faire.'
    decision: 'Gardée après corrections : le test sur les cas incidents d''UK Biobank est le plus direct pour dire
      si la signature précède la maladie. Le nombre de cas incidents reste à établir.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections : le test sur les cas incidents d''UK Biobank est le seul qui
        puisse dire si la signature précède la maladie.'
      constats:
      - Treize des dix-sept faits contrôlés sont confirmés.
      - '« Le seul test » était trop fort : la randomisation mendélienne renseigne aussi sur le sens, et elle ne
        trouve pas d''effet causal des triglycérides.'
      - La plateforme d'essai de la metformine est néerlandaise, et non canadienne.
      - « La moitié des cas répond aux critères canadiens » est une attente tirée d'autres études, pas une mesure.
      - 'Les cas ont un indice de masse corporelle plus haut que les témoins, et l''écart grandit quand la définition
        des cas et des témoins se durcit : la signature peut venir du poids ou d''une mauvaise santé en général.
        Apparier sur le poids, comme le test le prévoit, peut aussi effacer un vrai signal.'
      - 'Le diagnostic est déclaré par la personne. La question 9 de la grille n''est pas retenue au sens de la
        règle : les marqueurs du sang sont mesurés, et une seconde cohorte retrouve 9 marqueurs sur 14, dans le
        même sens.'
      suite: 'Décision reformulée : vérifiée, niveau C.'
- id: B018
  titre: L'hypermobilité articulaire est associée à une non-guérison après le COVID-19
  domaine_source: Enquêtes par questionnaire dans une biobanque britannique
  processus_commun: Tissu conjonctif plus lâche
  enonce: Un tissu conjonctif plus lâche, présent avant l'infection, augmente le risque de symptômes persistants.
    L'hypothèse prédit qu'une hypermobilité mesurée à l'examen, avant l'infection ou sans connaître l'état du patient,
    annonce le COVID long. Elle est réfutée si l'association disparaît quand l'hypermobilité n'est plus auto-déclarée.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « hypermobility Ehlers-Danlos long COVID genetic polygenic Mendelian
    randomization », « joint hypermobility non-recovery COVID ». Trouvé : deux enquêtes de la même équipe (2 854
    puis plus de 1 800 adultes) et une série de 20 patients d''une consultation. Aucune mesure clinique en population,
    aucune analyse génétique et aucun essai trouvés. Le registre ne cite pas le tissu conjonctif.'
  test_propose: 'Dans une cohorte où le score de Beighton a été mesuré à l''examen avant 2020, comparer le risque
    de COVID long entre scores hauts et bas, avec ajustement sur l''âge, le sexe et la douleur chronique antérieure.
    Réfutation : rapport de cotes dont l''intervalle à 95 % est sous 1,10. Second test, moins coûteux : dans les
    enquêtes existantes, vérifier si l''hypermobilité déclarée prédit aussi une issue sans lien plausible. Si oui,
    c''est un biais de déclaration.'
  donnees_existantes: COVID Symptom Study Biobank pour le signal ; aucune cohorte trouvée avec un score de Beighton
    mesuré avant l'infection
  risques: 'Exposition et issue sont toutes deux auto-déclarées, dans le même questionnaire : une personne qui déclare
    plus de symptômes coche plus de cases des deux côtés. Échantillon surtout féminin (2 331 sur 2 854) et blanc.
    Pas d''ajustement sur une fibromyalgie ou une douleur antérieure. Une seule équipe. Les participants d''une
    application ne représentent pas la population. Relecture du 2026-11-22, grille statistique : doutes aux questions
    3, 6, 7, 9 et 10. Question 9 : dans les enquêtes, l''hypermobilité et la non-guérison sont déclarées dans le
    même questionnaire. Ce doute est en partie levé par deux études sur diagnostics codés, qui retrouvent l''association
    mais exposent à un biais de surveillance.'
  niveau: C
  solidite_statistique: '2 854 personnes avec une donnée de guérison, dont 914 (32,0 %) non guéries. Rapport de
    cotes ajusté 1,33 (1,10–1,60) ; brut 1,43 (1,20–1,70). La fatigue porte une part de l''association : effet indirect
    0,18 (0,08–0,29). Seconde enquête de la même équipe, plus de 1 800 adultes : risque croissant avec le degré
    d''hypermobilité, sans chiffre lu. Pas de réplication indépendante. Valeur E calculée en Python, en prenant
    la racine du rapport de cotes parce que l''issue est fréquente : 1,57, et 1,28 pour la borne basse. Un biais
    faible suffit donc à produire ce résultat. Biais principal : mesure auto-déclarée des deux côtés.'
  sources:
  - titre: Is joint hypermobility linked to self-reported non-recovery from COVID-19? Case–control evidence from
      the British COVID Symptom Study Biobank (BMJ Public Health, 2024)
    url: https://bmjpublichealth.bmj.com/content/2/1/e000478
    lu: page
