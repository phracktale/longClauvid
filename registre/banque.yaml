  origine: agent biologie
  date: '2026-11-22'
  statut: promue
  relecture:
    date: '2026-11-22'
    lecture: '7 sources rouvertes : 3 en texte intégral, 1 par son résumé, 2 pages lues en partie, 1 page bloquée.'
    affirmations: '16 affirmations contrôlées : 12 confirmées, 3 inexactes, 1 non trouvée.'
    corrections:
    - Le titre est inexact. Dans l'étude de 2019, la production de MOTS-c ne diffère pas entre les groupes, et l'humanine
      du sang non plus ; l'humanine ne baisse que dans des cellules stimulées en culture (p = 0,05). Le signal porte
      sur l'expression des gènes, pas sur les peptides.
    - Doser l'humanine dans le plasma, premier geste du test proposé, a déjà été fait dans la source, sans écart.
    - Les écarts d'expression vont de 4,4 à 5,2 log2, soit de 21 à 37 fois, pour 10 personnes par groupe.
    - 'L''étude de 2019 a déposé ses données d''expression (jeu GSE130353) : le test peut commencer là.'
    inexploree: « Aucune mesure dans le COVID long » est faux. Une autre équipe trouve l'humanine et MOTS-c abaissés
      dans les vésicules extracellulaires du sang de patients COVID long à manifestations neuropsychiatriques, et
      pas chez les autres (PMID 35285072 ; PMID 37072092). Aucun essai enregistré.
    decision: 'Gardée après corrections, sur un autre appui que celui de la fiche : le résultat sur les vésicules
      extracellulaires, à répliquer.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      constats:
      - Huit des neuf faits contrôlés sont confirmés. Le contradicteur n'a pas attaqué l'appui de 2019, déjà retiré.
      - 'Les deux articles sur les vésicules reposent sur la même plateforme de dosage : le second ne réplique pas
        le premier. Celui des vésicules d''origine neuronale n''est lu que par son résumé.'
      - Les groupes comptent 8 ou 15 personnes, sans ajustement sur des facteurs de confusion.
      - '« Pas chez les autres patients » n''est pas une comparaison directe : les deux groupes de COVID long sont
        comparés au même groupe rétabli, jamais l''un à l''autre.'
      - Les témoins sains sont des prélèvements conservés depuis au moins trois ans avant la pandémie.
      - Le test déposé en banque porte sur le plasma et l'ARN, alors que le seul appui restant porte sur des vésicules.
      suite: 'Décision maintenue : promue, niveau C. La piste P15 du registre dit déjà qu''elle repose sur une seule
        équipe et sur un sous-groupe. Deux réserves s''y ajoutent : l''absence de comparaison directe entre les
        deux groupes de patients, et l''âge des prélèvements des témoins.'
  promue_en: P15
  promue_le: '2026-11-22'
- id: B012
  titre: 'Le fer reste mal réparti après l''infection : chargé dans les monocytes, il manque à la fabrication des
    globules rouges'
  domaine_source: Anémie de l'inflammation ; carence en fer sans anémie
  processus_commun: Fer sérique, ferritine, saturation de la transferrine, hepcidine, réticulocytes pauvres en fer
  enonce: 'Chez une partie des patients COVID long, l''inflammation des premières semaines laisserait une mauvaise
    répartition du fer : retenu dans les monocytes, insuffisant pour les globules rouges et les lymphocytes. Si
    c''est vrai, les marqueurs de manque de fer disponible restent anormaux plus de six mois après l''infection
    chez les patients, et pas chez les personnes rétablies.'
  pourquoi_inexploree: 'Europe PMC, « iron OR hepcidin OR ferritin » dans le titre avec les termes EM/SFC ou COVID
    long : 8 résultats. Une étude solide (Hanson 2024, 214 personnes suivies un an) et quelques travaux sur la ferritine
    seule. ClinicalTrials.gov, « iron OR ferric OR hepcidin » et ces maladies : 4 fiches. Aucune ne teste le fer
    dans le COVID long ; une seule teste le fer intraveineux, chez des femmes fatiguées, carencées, sans anémie.
    Aucun essai sélectionné sur ces marqueurs n''a été trouvé. Non trouvé ne veut pas dire inexistant.'
  test_propose: 'Dans une cohorte existante, comparer à plus de six mois la ferritine, la saturation de la transferrine,
    l''hepcidine et les réticulocytes entre patients et personnes rétablies. La piste est réfutée si ces marqueurs
    ne diffèrent plus à distance de l''infection : le signal de 2024 serait alors un marqueur précoce, pas un mécanisme
    entretenu.'
  donnees_existantes: Cohorte de Hanson 2024 (214 personnes, suivies un an). Biobanque RECOVER (sérum, sang total).
  risques: 'Le sens de l''anomalie n''est pas tranché. L''étude de 2024 décrit à la fois un fer sérique bas et des
    monocytes chargés en fer. Une étude chez le hamster relie l''endothéline-1 à une surcharge en fer des tissus
    après l''infection. Donner du fer pourrait donc nuire : rien ici ne permet de le recommander. Hors COVID, le
    fer intraveineux n''a amélioré la fatigue que chez les femmes à ferritine très basse (15 ng/mL ou moins) dans
    un essai de 90 femmes, et pas du tout dans un essai de 405 donneurs de sang carencés. Le signal de 2024 est
    mesuré surtout dans les premières semaines et les premiers mois. Relecture du 2026-11-22, grille statistique
    : doutes aux questions 2, 3, 4, 7 et 10. Douze patients portent l''analyse centrale ; les témoins sont mal appariés.'
  niveau: C
  sources:
  - titre: Iron dysregulation and inflammatory stress erythropoiesis associates with long-term outcome of COVID-19,
      Nature Immunology 2024 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/38429458/
    lu: page
  - titre: Lung epithelial endothelin-1 drives iron dysregulation and skeletal injury after SARS-CoV-2 infection,
      Cell Reports 2026 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/42599803/
    lu: page
