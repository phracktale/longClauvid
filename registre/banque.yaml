- id: B018
  titre: L'hypermobilité articulaire est associée à une non-guérison après le COVID-19
  domaine_source: Enquêtes par questionnaire dans une biobanque britannique
  processus_commun: Tissu conjonctif plus lâche
  enonce: Un tissu conjonctif plus lâche, présent avant l'infection, augmente le risque de symptômes persistants.
    L'hypothèse prédit qu'une hypermobilité mesurée à l'examen, avant l'infection ou sans connaître l'état du patient,
    annonce le COVID long. Elle est réfutée si l'association disparaît quand l'hypermobilité n'est plus auto-déclarée.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « hypermobility Ehlers-Danlos long COVID genetic polygenic Mendelian
    randomization », « joint hypermobility non-recovery COVID ». Trouvé : deux enquêtes de la même équipe (2 854
    puis plus de 1 800 adultes) et une série de 20 patients d''une consultation. Aucune mesure clinique en population,
    aucune analyse génétique et aucun essai trouvés. Le registre ne cite pas le tissu conjonctif.'
  test_propose: 'Dans une cohorte où le score de Beighton a été mesuré à l''examen avant 2020, comparer le risque
    de COVID long entre scores hauts et bas, avec ajustement sur l''âge, le sexe et la douleur chronique antérieure.
    Réfutation : rapport de cotes dont l''intervalle à 95 % est sous 1,10. Second test, moins coûteux : dans les
    enquêtes existantes, vérifier si l''hypermobilité déclarée prédit aussi une issue sans lien plausible. Si oui,
    c''est un biais de déclaration.'
  donnees_existantes: COVID Symptom Study Biobank pour le signal ; aucune cohorte trouvée avec un score de Beighton
    mesuré avant l'infection
  risques: 'Exposition et issue sont toutes deux auto-déclarées, dans le même questionnaire : une personne qui déclare
    plus de symptômes coche plus de cases des deux côtés. Échantillon surtout féminin (2 331 sur 2 854) et blanc.
    Pas d''ajustement sur une fibromyalgie ou une douleur antérieure. Une seule équipe. Les participants d''une
    application ne représentent pas la population.'
  niveau: C
  solidite_statistique: '2 854 personnes avec une donnée de guérison, dont 914 (32,0 %) non guéries. Rapport de
    cotes ajusté 1,33 (1,10–1,60) ; brut 1,43 (1,20–1,70). La fatigue porte une part de l''association : effet indirect
    0,18 (0,08–0,29). Seconde enquête de la même équipe, plus de 1 800 adultes : risque croissant avec le degré
    d''hypermobilité, sans chiffre lu. Pas de réplication indépendante. Valeur E calculée en Python, en prenant
    la racine du rapport de cotes parce que l''issue est fréquente : 1,57, et 1,28 pour la borne basse. Un biais
    faible suffit donc à produire ce résultat. Biais principal : mesure auto-déclarée des deux côtés.'
  sources:
  - titre: Is joint hypermobility linked to self-reported non-recovery from COVID-19? Case–control evidence from
      the British COVID Symptom Study Biobank (BMJ Public Health, 2024)
    url: https://bmjpublichealth.bmj.com/content/2/1/e000478
