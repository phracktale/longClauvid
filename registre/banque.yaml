  origine: agent biologie, zone acides biliaires
  date: '2026-11-23'
  statut: vérifiée
  relecture:
    date: '2026-11-23'
    lecture: '9 sources rouvertes : 5 en texte intégral, lus en partie, 3 par leur résumé, 1 fiche de registre.'
    affirmations: '26 affirmations contrôlées : 21 confirmées, 5 non trouvées.'
    corrections:
    - 'Le sens de 2017 est connu : acides biliaires primaires et secondaires baissent ensemble. Les auteurs y voient
      une atteinte possible du foie ou un effet des médicaments, pas un défaut du microbiote.'
    - 'Aucune source sur l''EM/SFC ne mesure le rapport des acides secondaires aux primaires, ni le récepteur TGR5
      : le mécanisme de la piste n''a pas de donnée.'
    - En 2023, la baisse ne tient qu'à une phrase du résumé ; le texte ne l'analyse pas, et ses ajustements n'incluent
      ni l'activité physique ni le poids.
    - L'étude de 2025 vient de la même équipe et de la même cohorte que celle de 2023. Elle rapporte un acide biliaire
      en hausse, le glycodéoxycholate 3-sulfate.
    - Les copies des trois études sur l'EM/SFC sont des textes intégraux, que la fiche dit lus par leur résumé.
      Le relecteur ne les a lus qu'en partie.
    - Le test proposé réutilise les données de l'étude qui a donné le signal, et n'a pas de seuil.
    inexploree: 'L''affirmation tient : aucune étude dédiée aux acides biliaires dans l''EM/SFC, aucun levier testé.
      L''acide ursodésoxycholique a été essayé dans le COVID long, sans bénéfice.'
    decision: 'Gardée après corrections, au niveau C pour une baisse des acides biliaires du plasma mesurée par
      une équipe, sur 17 patientes. L''étude de 2023 ne la confirme que par une phrase de son résumé. Son explication
      par le microbiote et le récepteur TGR5 est une hypothèse sans donnée, et le profil mesuré ne lui ressemble
      pas : les acides primaires baissent aussi.'
    attaque:
      date: '2026-11-23'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections, au niveau C pour la baisse des acides biliaires du plasma, retrouvée
        par deux équipes. Son explication par le microbiote et le récepteur TGR5 est une hypothèse sans donnée :
        les auteurs de 2017 en proposent une autre.'
      constats:
      - Quinze des seize faits contrôlés sont confirmés.
      - '« Retrouvée par deux équipes » était trop fort. En 2023, la baisse ne tient qu''à une phrase du résumé
        : le texte ne nomme ni ne chiffre aucun acide biliaire. L''indépendance des deux équipes ne se lit pas dans
        les copies.'
      - En 2017, le lithocholate passe le seuil admis avec un test et pas avec l'autre (0,13 et 0,19, pour un seuil
        de 0,15).
      - 'Le profil va contre le mécanisme proposé : en 2017 les acides primaires baissent aussi, alors que dans
        la maladie inflammatoire de l''intestin, seul appui du mécanisme, les primaires et le total sont inchangés.
        En 2025, l''acide biliaire en hausse dérive d''un acide secondaire.'
      - 'Le test ne peut pas réfuter la piste : il exige un ajustement sur l''activité physique, absente des modèles
        de la cohorte ; seule la métagénomique y est déclarée déposée ; il n''a pas de seuil.'
      suite: 'Décision reformulée : vérifiée, niveau C pour la seule baisse de 2017 ; le mécanisme par le microbiote
        est au niveau D.'
- id: B026
  titre: Dans le COVID long, la voie HIF-2α est activée (érythropoïétine et VEGF élevés), comme dans la maladie
    de von Hippel-Lindau où un inhibiteur de HIF-2α existe
  domaine_source: Maladie de von Hippel-Lindau (HIF-2α activé en permanence par la perte du gène VHL ; inhibiteur
    oral belzutifan)
  processus_commun: 'Activité de HIF-2α, lue par ses cibles dans le sang : érythropoïétine (EPO) et VEGF, mesurées
    avec l''hémoglobine, la ferritine et la CRP'
  enonce: 'Une partie des patients COVID long (et peut-être EM/SFC) a une voie HIF-2α activée sans manque d''oxygène
    du sang : la protéine S1 du spike, ou l''inflammation, la maintiendrait allumée dans l''endothélium. Cette activation
    abîmerait la barrière des petits vaisseaux. Si c''est vrai, à hémoglobine égale, l''EPO et le VEGF de ces patients
    sont plus hauts que chez des témoins, et l''écart augmente avec la sévérité des symptômes et avec les anticorps
    anti-S1.'
  pourquoi_inexploree: 'Europe PMC, requête (belzutifan OR roxadustat OR daprodustat OR vadadustat OR « prolyl hydroxylase
    inhibitor ») ET (« long COVID » OR « post-COVID » OR « post-acute sequelae » OR « chronic fatigue syndrome »
    OR « myalgic encephalomyelitis »), le 2026-11-23 : 33 résultats, dont un seul porte sur l''inhibition de HIF-2α
    dans le COVID long (Ribeiro 2026, et sa préversion medRxiv 2024 de la même équipe) ; les autres sont des revues
    ou hors sujet. Europe PMC, « ABSTRACT:HIF ET ABSTRACT:chronic fatigue syndrome » : 0 résultat. ClinicalTrials.gov
    (interface v2), mêmes termes avec belzutifan, roxadustat, daprodustat, vadadustat, « HIF-2 », « hypoxia-inducible
    factor » : 0 essai. ClinicalTrials.gov, erythropoietin OR epoetin OR darbepoetin avec ces maladies : 0 essai.
    Les essais d''oxygène (caisson hyperbare, hypoxie-hyperoxie intermittente) existent (19 résultats pour hypoxia
    OR hyperoxia OR hyperbaric), mais aucun ne mesure HIF-2α, l''EPO ou le VEGF dans les titres lus. Les revues
    sur HIF-1α dans le COVID (Int J Mol Sci 2025) parlent surtout de la phase aiguë. Non trouvé ne veut pas dire
    inexistant.'
  test_propose: 'Sur des plasmas déjà prélevés, doser l''EPO et le VEGF-A (si absent), puis comparer patients et
    témoins après ajustement sur l''hémoglobine, la ferritine, la CRP, l''âge, le sexe et le poids. On compare le
    résidu d''EPO attendu pour l''hémoglobine mesurée. Le seuil est à écrire avant d''ouvrir les données ; proposition
    de départ : écart standardisé d''au moins 0,5 déviation standard sur l''EPO ajustée, et corrélation avec le
    score de sévérité. On regarde aussi si l''écart se concentre chez les patients à anticorps anti-S1 élevés. La
    piste est réfutée si, après ajustement sur l''hémoglobine et la ferritine, l''EPO ajustée ne diffère pas des
    témoins (intervalle de confiance incluant zéro) dans deux cohortes, ou si l''écart disparaît chez les patients
    sans anémie.'
  donnees_existantes: 'Cohorte « All Eyes on PCS » de Munich (NCT05635552 : 102 patients COVID long dont 62 EM/SFC,
    102 guéris, 96 jamais infectés ; IL-6, ICAM-1, VCAM-1 et marqueurs du fer déjà dosés ; l''EPO est à confirmer).
    Cohorte de Munich de l''étude HIF-2α (41 patients, 24 témoins d''avant la pandémie ; EPO déjà dosée). Cambridge
    COVID BioResource (214 personnes suivies un an ; hémoglobine, fer, expression des gènes du fer ; EPO à confirmer).
    Cohorte finlandaise de 111 patients et 63 témoins (transcriptome des cellules du sang, cibles de HIF à relire).
    Biobanque RECOVER et UK ME/CFS Biobank (EPO et VEGF à confirmer ; accès à demander).'
  risques: 'Un seul article rapporte l''EPO élevée : 41 patients contre 24 témoins, une seule équipe (la préversion
    de 2024 reprend les mêmes données). Les valeurs d''EPO ne sont pas dans le texte lu, seulement sur une figure
    ; aucun chiffre ni intervalle n''a pu être recopié. L''article lui-même note que l''hémoglobine et l''hématocrite
    sont plus bas quand la sévérité est plus haute : une EPO plus haute peut donc simplement répondre à une anémie
    légère (inflammatoire), sans activation propre de HIF-2α ; la piste sur le fer (B012 de la banque, Hanson 2024)
    couvre déjà cette lecture. Les cellules viennent de la rétine humaine en culture ; la protéine S1 n''a pas été
    dosée dans le plasma ; le VEGF protéique était sous le seuil de détection dans les cellules ; pas d''animal
    ni d''essai chez l''homme. HIF-1α et HIF-2α ont aussi des effets protecteurs : la revue de 2025 parle d''un
    double rôle. Une étude de 137 patients (Philippe 2024) lie le VEGF-A à un DLCO abaissé, ce qui peut refléter
    une atteinte du poumon plutôt qu''un signal propre à HIF-2α. Dans une cohorte finlandaise (111 patients, 63
    témoins), le transcriptome global bouge à peine ; le signal d''érythroblastes ne concerne qu''un sous-groupe
    d''hommes. Danger du levier, examiné avant l''efficacité : le belzutifan donne de l''anémie chez 90 % des patients
    et de la fatigue chez 66 % dans l''essai de phase 2 de la maladie de von Hippel-Lindau ; la fatigue est justement
    le symptôme à soigner ici, et une hypoxie ; son usage demande une surveillance étroite et des ajustements de
    dose (guide de 2025), et aucun essai du COVID long ou de l''EM/SFC n''a été trouvé. Il n''est pas proposé comme
    traitement : seule la mesure sur plasmas existants est proposée. Un levier opposé existe (les inhibiteurs des
    prolyl-hydroxylases, qui activent HIF) ; il irait dans le sens contraire et n''est pas évoqué. Relecture du
    2026-11-23, grille statistique : doutes aux questions 1, 2, 3, 4, 5, 6, 7, 9 et 10. Quarante et un patients
    contre 24 témoins d''avant la pandémie, une seule équipe, aucune taille d''effet lisible ; l''activation de
    HIF-2α n''est montrée que sur des cellules en culture.'
