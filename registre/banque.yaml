  origine: agent statistique
  date: '2026-11-22'
  statut: écartée
  relecture:
    date: '2026-11-22'
    lecture: '3 sources rouvertes : 3 en texte intégral.'
    affirmations: '29 affirmations contrôlées : 18 confirmées, 1 inexacte, 10 non trouvées.'
    corrections:
    - Pour une infection au premier ou au deuxième trimestre, trois des quatre rapports de risques ne montrent pas
      de protection (1,07 ; 1,17 ; 1,15 ; 0,89).
    - 'Avec le seul code de diagnostic du COVID long, les rapports de risques tombent à 0,32 et à 0,53 : l''ampleur
      dépend de la définition, pas le sens.'
    - La grossesse n'est repérée que par un accouchement enregistré.
    - Les auteurs situent leur hypothèse immunitaire dans le post-partum, pas au moment de l'infection.
    - 'Niveau ramené de B à C : une seule équipe pour les deux réseaux.'
    inexploree: '« Aucune réplication » est faux : deux études hors dossiers existent, et aucune ne confirme. Une
      cohorte prospective américaine, à symptômes recueillis par questionnaire, ne trouve aucun écart : rapport
      de risques 0,96 (0,63–1,48), 580 femmes enceintes (PMID 41037811) ; son intervalle n''exclut pas l''effet
      des dossiers. À Singapour, les femmes enceintes ont plus de nouveaux diagnostics après l''infection que les
      femmes infectées hors grossesse (PMID 40073919), mais le critère est tout diagnostic remboursé, pas le COVID
      long. L''analyse antérieure de la même équipe américaine donnait 0,85 (PMID 38828129).'
    decision: 'Écartée : voir le motif.'
    contradiction:
      date: '2026-11-22'
      avis: tient en partie
      motif_initial: Signal probablement artefactuel. Il dépend de la définition du cas (questions 5 et 9 de la
        grille), la grossesse n'y est repérée que par l'accouchement (question 8), et il n'est pas retrouvé hors
        des dossiers médicaux américains (question 3). À rouvrir si une cohorte prospective plus grande le retrouve.
      constats:
      - 'La cohorte prospective ne peut pas exclure l''effet : son intervalle contient 0,85 et 0,70, et ses auteurs
        disent qu''un manque de puissance est possible.'
      - 'Au troisième trimestre, elle va dans le sens de la piste : 0,60 (0,33–1,10), soit une différence de risque
        de −4,4 points (−8,6 à −0,2).'
      - 'L''étude de Singapour ne mesure pas le COVID long, mais tout nouveau diagnostic remboursé : ce n''est ni
        une réplication ni une réfutation.'
      - 'Les quatre définitions du cas donnent un rapport sous 1 : l''ampleur varie, pas le sens.'
      suite: 'Mise à l''écart maintenue, motif reformulé : « pas retrouvé » devient « pas confirmé, sans pouvoir
        être exclu ».'
  motif: 'Signal probablement artefactuel tant qu''une étude assez puissante ne l''a pas retrouvé hors des dossiers
    médicaux. Dans ces dossiers, la grossesse n''est repérée que par l''accouchement (question 8 de la grille),
    et l''ampleur de l''effet va de 0,32 à 0,86 selon la définition du cas (questions 5 et 9). La seule cohorte
    prospective donne 0,96 (0,63–1,48) : elle ne confirme pas, sans pouvoir exclure. À rouvrir si une cohorte prospective
    plus grande retrouve l''effet, notamment au troisième trimestre.'
- id: B016
  titre: Une apnée du sommeil diagnostiquée avant l'infection est suivie de plus de COVID long chez l'adulte
  domaine_source: Antécédents sur dossiers médicaux électroniques, trois réseaux américains
  processus_commun: Hypoxie intermittente et sommeil fragmenté avant l'infection
  enonce: L'hypoxie nocturne répétée prépare le terrain du COVID long. L'hypothèse prédit que, parmi les personnes
    apnéiques, celles dont l'apnée est corrigée par la pression positive continue avant l'infection ont moins de
    COVID long. Elle est réfutée si le traitement effectif de l'apnée ne change pas le risque.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « CPAP obstructive sleep apnea long COVID trial cohort adherence
    ». Trouvé : deux études d''observation enregistrées. NCT06052514 : 22 patients sous pression positive continue,
    sans groupe témoin, terminée. NCT05290350 : 300 patients prévus pour mesurer la fréquence de l''apnée, statut
    inconnu. Aucun essai randomisé et aucune comparaison traités contre non traités trouvés. Les textes lus ne rapportent
    aucune donnée de traitement. Le registre ne cite pas l''apnée.'
  test_propose: 'Cohorte de personnes apnéiques diagnostiquées avant 2020, avec l''observance relevée par l''appareil.
    Comparer le risque de COVID long entre apnée traitée et observée, et apnée non traitée, à indice de masse corporelle
    égal. Contrôle négatif : une issue sans lien avec l''hypoxie, pour mesurer le biais du patient observant. Réfutation
    : rapport de risques dont l''intervalle à 95 % est compris entre 0,9 et 1,1. Effectif calculé en Python (deux
    proportions, alpha 0,05, puissance 80 %) : 2 033 personnes par groupe pour voir un rapport de 0,8 si le risque
    de base est de 15 % ; 6 743 par groupe s''il est de 5 %.'
  donnees_existantes: N3C, PCORnet et PEDSnet pour le signal ; aucune base trouvée qui joigne l'observance de l'appareil
    au COVID long
  risques: 'Confusion par l''obésité, mal mesurée dans les dossiers. Surveillance : une personne suivie pour apnée
    consulte plus et reçoit plus de codes. Recouvrement des symptômes : fatigue et troubles de l''attention sont
    aussi des signes d''apnée. Les deux réseaux adultes donnent des résultats très différents. Race, ethnie et vaccination
    manquaient. Chez l''enfant, l''association disparaît après ajustement sur l''obésité. Comparer des patients
    observants à des non-observants expose au biais de l''utilisateur en bonne santé. Relecture du 2026-11-22, grille
    statistique : doutes aux questions 1, 3, 5, 7, 9 et 10. L''obésité est mal mesurée dans les dossiers ; une personne
    suivie pour apnée consulte plus et reçoit plus de codes.'
  niveau: B
  solidite_statistique: 'Environ 2,2 millions de personnes infectées : 1,7 million d''adultes dans N3C, 330 000
    dans PCORnet, 102 000 enfants dans PEDSnet. Rapports de cotes bruts de 1,41 à 3,93 selon le réseau. Après ajustement
    : 75 % de risque en plus dans N3C, 12 % dans PCORnet ; les intervalles de confiance n''ont pas pu être lus.
    Enfants : 1,05 (0,89–1,24). Dans N3C, 89 % de plus chez les femmes et 59 % chez les hommes. Une seule étude,
    trois réseaux. Valeur E calculée en Python : 1,49 pour PCORnet et 2,90 pour N3C. Le résultat de PCORnet tient
    donc à peu de chose. Biais principal : surveillance et confusion par l''obésité.'
  sources:
  - titre: 'Risk of post-acute sequelae of SARS-CoV-2 infection associated with pre-coronavirus disease obstructive
      sleep apnea diagnoses: an electronic health record-based analysis from the RECOVER initiative (Sleep, 2023),
      résumé par Europe PMC'
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:37166330%20AND%20SRC:MED&resultType=core&format=json
    lu: page
    texte: https://pmc.ncbi.nlm.nih.gov/articles/PMC10485569/
  - titre: Obstructive sleep apnea associated with increased risks for long COVID (communiqué du NIH)
    url: https://www.ninds.nih.gov/news-events/news/press-releases/obstructive-sleep-apnea-associated-increased-risks-long-covid
    lu: page
  - titre: Sleep apnea linked to long-COVID symptoms (CIDRAP)
    url: https://www.cidrap.umn.edu/covid-19/sleep-apnea-linked-long-covid-symptoms
    lu: page
  - titre: CPAP Efficacy in Post-COVID-19 Patients With Sleep Apnea (NCT06052514), fiche miroir
    url: https://ctv.veeva.com/study/cpap-efficacy-in-post-covid-patients-with-sleep-apnea
    lu: page
  - titre: Long COVID-19 Fatigue and Obstructive Sleep Apnea (NCT05290350), fiche miroir
    url: https://ctv.veeva.com/study/long-covid-19-fatigue-and-obstructive-sleep-apnea
    lu: page
  - titre: Association of Obstructive Sleep Apnea with Post-Acute Sequelae of SARS-CoV-2 Infection, The American
      journal of medicine 2024 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/38401674/
    lu: page
  - titre: Obstructive sleep apnea is frequent in patients with Long COVID fatigue but is not significantly associated
      with alterations of quality of life and cognition, GeroScience 2026 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/42897409/
    lu: page
  - titre: Nasal Continuous Positive Airway Pressure (CPAP) in Chronic Fatigue and Sleep-disordered Breathing, NCT01368718
      (titre seul ; ajoutée à la relecture)
    url: https://clinicaltrials.gov/study/NCT01368718
    lu: extrait
  origine: agent statistique
  date: '2026-11-22'
  statut: à vérifier
  relecture:
    date: '2026-11-22'
    lecture: '5 sources rouvertes : 3 en texte intégral, 1 par son résumé, 1 page bloquée.'
    affirmations: '47 affirmations contrôlées : 27 confirmées, 1 inexacte, 19 non trouvées.'
    corrections:
    - La race et l'ethnie font partie des variables d'ajustement ; seule la vaccination manque.
    - 'L''article n''a été relu que par son résumé : son texte n''est pas accessible aux programmes. Une lecture
      en ligne, partielle et non contrôlée, donne les intervalles : 1,75 (1,71–1,80) dans N3C et 1,12 (1,08–1,16)
      dans PCORnet.'
    - D'après cette même lecture, la fréquence du COVID long va de 4,9 % à 16,6 % selon le réseau, pour trois définitions
      différentes.
    - 'Niveau laissé à B : deux jeux de données indépendants trouvent le même sens. Il avait d''abord été ramené
      à C, à tort.'
    inexploree: '« Aucune comparaison traités contre non traités » est faux : une enquête sur 24 803 adultes américains,
      d''une autre équipe, retrouve l''association (rapports de cotes de 1,9 à 2,1) et la voit atténuée chez les
      personnes dont l''apnée est traitée (PMID 38401674) ; le traitement y est déclaré, sans précision ni observance.
      Chez 100 patients COVID long testés à domicile, l''apnée est fréquente (53 %) et sans lien avec l''intensité
      des symptômes (PMID 42897409) : c''est une fréquence, pas un risque. Un essai de pression positive contre
      appareil factice dans la fatigue chronique a été arrêté avant son terme (NCT01368718).'
    decision: 'Mise à l''écart levée après contradiction. L''association est retrouvée par deux méthodes différentes
      ; sa taille est instable et la confusion par l''obésité n''est pas écartée. La piste reste à vérifier : l''article
      qui porte le signal n''est accessible aux programmes que par son résumé.'
    contradiction:
      date: '2026-11-22'
      avis: tient en partie
      motif_initial: Signal probablement artefactuel tant qu'une contre-analyse n'est pas faite. Deux réseaux donnent
        1,12 et 1,75 (question 5 de la grille) ; le COVID long y est défini de trois façons, avec des fréquences
        de 5 à 17 % (question 9) ; l'enquête qui retrouve l'association repose sur des déclarations des deux côtés.
        À rouvrir avec une apnée mesurée et une observance relevée par l'appareil.
      constats:
      - '« Probablement artefactuel » dépassait les sources : le résumé de l''article décrit une association atténuée
        mais significative chez l''adulte, concordante entre réseaux, définitions et analyses de sensibilité.'
      - 'Une enquête d''une autre équipe retrouve l''association après ajustement sur l''indice de masse corporelle
        : ce sont deux jeux de données indépendants, pas « une seule étude ».'
      - 'Les intervalles de confiance et les fréquences de 4,9 à 16,6 % ne sont dans aucune copie locale : ils viennent
        d''une lecture en ligne non contrôlée.'
      - 'L''étude par test à domicile mesure une fréquence chez des malades, pas un risque : elle ne va pas contre
        la piste.'
      - Le résumé de l'article dit que la race et l'ethnie sont ajustées ; la page de presse dit qu'elles manquaient.
        La divergence n'est pas levée.
      suite: 'Mise à l''écart levée. La grille avait été appliquée à la lettre, alors que la même situation avait
        été jugée autrement pour l''hypermobilité (B018) : deux façons de mesurer, un même sens. Les deux pistes
        sont maintenant traitées de la même façon.'
- id: B017
  titre: L'EM/SFC porte une signature sanguine de résistance à l'insuline et d'atteinte du foie que l'inactivité
    n'explique pas
  domaine_source: Biomarqueurs sanguins de grandes cohortes (UK Biobank, All of Us) et analyse a posteriori d'un
    essai
  processus_commun: Résistance à l'insuline, enzymes du foie élevées, inflammation de bas grade
  enonce: Une résistance à l'insuline et une atteinte hépatique précèdent l'EM/SFC et y contribuent ; elles n'en
    sont pas la conséquence. L'hypothèse prédit que ces marqueurs sont déjà déplacés avant le diagnostic. Elle est
    réfutée s'ils sont normaux chez les personnes qui ne tomberont malades que plus tard.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « insulin resistance ME/CFS metformin trial », « liver enzymes
    myalgic encephalomyelitis cohort », « pioglitazone long COVID ». Trouvé : aucun essai dans l''EM/SFC qui sélectionne
    sur ces marqueurs. Dans le COVID long installé, l''essai REVIVE compare metformine, fluvoxamine et placebo chez
    1 500 participants, sans sélection sur la résistance à l''insuline et en excluant les diabétiques des bras metformine.
    Le registre affirme qu''aucune étude de la metformine n''existe sur un COVID long installé : ce protocole enregistré
    le contredit ; l''avancement de l''essai n''a pas été vérifié. Aucune étude des cas incidents n''a été trouvée.'
  test_propose: 'Dans UK Biobank, prendre les personnes sans diagnostic au prélèvement de 2006–2010 et qui reçoivent
    ensuite un code d''EM/SFC ou de fatigue post-virale. Comparer leurs marqueurs de départ (rapport triglycérides
    sur HDL, indice TyG, ALT, GGT, HbA1c) à ceux de témoins appariés sur l''âge, le sexe et l''indice de masse corporelle.
    Seuil : écart standardisé d''au moins 0,2, à p inférieur à 0,05/14. Réfutation : intervalles tous compris entre
    −0,1 et 0,1. Effectif calculé en Python (test bilatéral, témoins très nombreux, puissance 90 %) : 441 cas incidents
    pour un écart de 0,2 ; 196 pour 0,3. Le nombre de cas incidents disponibles reste à vérifier. Contrôle négatif
    : un marqueur sans lien attendu.'
  donnees_existantes: UK Biobank (biochimie, métabolomique, dossiers médicaux liés) ; All of Us ; statistiques résumées
    de DecodeME pour une randomisation mendélienne
  risques: 'Causalité inverse : le sang a été prélevé au moment où la maladie était déjà déclarée. Médicaments,
    alimentation et prise de poids des malades peuvent déplacer ces marqueurs ; l''analyse de médiation repose sur
    des mesures d''activité déclarées. Diagnostic auto-déclaré. Biais du volontaire en bonne santé : les formes
    sévères sont probablement absentes. L''ajustement sur l''indice de masse corporelle n''a pas pu être vérifié
    à la lecture. Danger : cette piste ne justifie aucune prise d''antidiabétique hors essai. Relecture du 2026-11-22,
    grille statistique : doutes aux questions 3, 4, 6, 7 et 10. Le sang est prélevé une fois la maladie déclarée
    ; le diagnostic est déclaré par les participants.'
  niveau: C
  solidite_statistique: '1 455 cas auto-déclarés et 131 303 témoins. 116 marqueurs diffèrent chez les femmes et
    chez les hommes ; 91 % des écarts sont petits à moyens (d de Cohen entre 0,2 et 0,5). Sont élevés : protéine
    C-réactive, cystatine C, leucocytes, rapport triglycérides sur HDL, indice TyG, ALT, ALP, GGT, HbA1c. Neuf marqueurs
    sur quatorze retrouvés dans All of Us. Avec l''activité comme médiateur, un seul effet indirect significatif
    sur 3 237. Corrélation génétique avec le diabète de type 2 de 0,15 (p = 3 × 10⁻¹⁰) dans une prépublication sur
    DecodeME. Côté COVID long : essai de la vortioxétine, 147 patients randomisés ; interaction entre traitement,
    temps, protéine C-réactive, rapport triglycérides sur HDL et indice de masse corporelle, p = 0,011, analyse
    non prévue au protocole. Biais principal : causalité inverse.'
  sources:
  - titre: Replicated blood-based biomarkers for myalgic encephalomyelitis not explicable by inactivity (EMBO Molecular
      Medicine, 2025), résumé
    url: https://www.research.ed.ac.uk/en/publications/replicated-blood-based-biomarkers-for-myalgic-encephalomyelitis-n/
    lu: page
    texte: https://pubmed.ncbi.nlm.nih.gov/40537675/
  - titre: Replicated blood-based biomarkers for Myalgic Encephalomyelitis not explicable by inactivity (medRxiv,
      version 2)
    url: https://www.medrxiv.org/content/10.1101/2024.08.26.24312606v2.full
    lu: page
  - titre: 'Impacts of metabolic disruption, body mass index and inflammation on cognitive function in post-COVID-19
      condition: a randomized controlled trial on vortioxetine (Annals of General Psychiatry, 2024)'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10905871
    lu: page
  - titre: 'The REVIVE Trial: multicenter, adaptive, randomized, double-blinded, placebo-controlled study in participants
      with Long COVID-19 (NCT06128967), protocole lu en partie'
    url: https://cdn.clinicaltrials.gov/large-docs/67/NCT06128967/Prot_000.pdf
    lu: page
  - titre: Insights into Pathophysiological Pathways in ME/CFS Through Genetic Correlation and Mendelian Randomization
