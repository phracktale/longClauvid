- id: B019
  titre: Des taux bas d'interleukines 5 et 13 avant une mononucléose précèdent l'EM/SFC sévère
  domaine_source: Cohorte prospective d'étudiants, avec prise de sang avant la maladie
  processus_commun: Cytokines de type 2 (IL-5, IL-13) basses avant l'infection
  enonce: Un tonus bas des cytokines de type 2, mesuré avant l'infection, prédispose à une forme sévère de fatigue
    post-infectieuse. L'hypothèse prédit le même écart, dans le même sens, avant d'autres infections que la mononucléose.
    Elle est réfutée si l'IL-5 et l'IL-13 d'avant l'infection ne diffèrent pas dans une seconde cohorte.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « IL-13 IL-5 low before infection predicts long COVID chronic
    fatigue prospective pre-illness cytokines replication ». Trouvé : les articles de l''équipe d''origine, et une
    étude de jumeaux britanniques limitée à l''IL-6. Aucune réplication de l''IL-5 ou de l''IL-13 d''avant la maladie
    n''a été trouvée, et aucun essai. Le registre ne cite ni ces cytokines ni cette cohorte.'
  test_propose: 'Dans une cohorte disposant de plasma d''avant l''infection, doser l''IL-5 et l''IL-13 chez les
    personnes qui ont ensuite une fatigue persistante après infection et chez des personnes rétablies. Analyse fixée
    d''avance : sens attendu plus bas chez les futurs malades, trois tests (IL-5, IL-13, IL-6), alpha de 0,05/3.
    Réfutation : écarts standardisés dont l''intervalle exclut −0,3. Effectif calculé en Python (test t bilatéral,
    trois témoins par cas, puissance 90 %) : 73 cas et 219 témoins pour un écart de 0,5 ; 29 cas et 87 témoins pour
    0,8.'
  donnees_existantes: 'TwinsUK : plasma d''avant la pandémie et panel de protéines de l''inflammation (présence
    de l''IL-5 et de l''IL-13 à vérifier) ; UK Biobank, protéomique, à vérifier'
  risques: 'Très petit groupe : 18 formes sévères. Nombre de cytokines testées non rapporté, et aucune correction
    pour comparaisons multiples mentionnée. La fiabilité du dosage à des taux bas est à vérifier pour la méthode
    employée. Résultat croisé à connaître : chez les jumeaux britanniques, l''IL-6 d''avant la pandémie ne prédit
    pas la fatigue après le COVID-19, et l''étude d''origine trouve une IL-6 basse, non haute. Étudiants jeunes
    : généralisation incertaine.'
  niveau: C
  solidite_statistique: '4 501 étudiants suivis ; 238 mononucléoses (5,3 %) ; 55 EM/SFC à six mois (23 %). Comparaison
    de départ : 18 formes sévères contre 58 rétablis. IL-5 et IL-13 plus basses avant la maladie ; moyennes, tailles
    d''effet et valeurs de p non rapportées dans les textes lus. Modèle de prédiction : aire sous la courbe 0,795
    (0,669–0,921), sans validation externe. Calcul Python (test t bilatéral, puissance 80 %) : avec 18 et 58 personnes,
    seul un écart standardisé d''au moins 0,77 est détectable ; 0,89 après correction sur trois cytokines ; 1,01
    sur dix. Un écart observé dans ces conditions est donc probablement surestimé. Une seule équipe. Biais principal
    : comparaisons multiples sur un petit effectif.'
  sources:
  - titre: 'Risks for developing ME/CFS in college students following infectious mononucleosis: a prospective cohort
      study (Clinical Infectious Diseases, DOI 10.1093/cid/ciaa1886), résumé'
    url: https://research.luriechildrens.org/en/risks-for-developing-mecfs-in-college-students-following-infectious-mononucleosis-a-prospective-cohort-study
    lu: page
