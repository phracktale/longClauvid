    url: https://pubmed.ncbi.nlm.nih.gov/39622313/
    lu: page
  - titre: 'Post-COVID central hypersomnia, a treatable trait in long COVID: 4 case reports, Frontiers in neurology
      2024 (résumé ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/38419710/
    lu: page
  - titre: The Orexin System and Its Impact on the Autonomic Nervous and Cardiometabolic System in Post-Acute Sequelae
      of COVID-19, Biomedicines 2025 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/40149526/
    lu: page
  origine: agent biologie
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '10 sources rouvertes : 6 en texte intégral, 4 par leur résumé.'
    affirmations: '20 affirmations contrôlées : 15 confirmées, 1 inexacte, 4 non trouvées.'
    corrections:
    - '« Durablement » n''est pas montré : chez la souris K18-hACE2, l''ARN de l''orexine est revenu au niveau des
      témoins au 15e jour ; chez la souris sauvage du second modèle, la baisse est décrite jusqu''au 14e jour, sans
      suivi plus long.'
    - L'orexine A du plasma est normale à 2,5 ans chez 14 survivants de réanimation, qui ne sont pas des patients
      COVID long. Dans le liquide céphalo-rachidien, seuls deux cas isolés de narcolepsie après COVID-19 ont un
      dosage.
    - La patiente du cas clinique a une narcolepsie de type 1 complète, pas un déficit partiel.
    - L'étude du NIH ne trouve pas d'anomalie du sommeil à la polysomnographie chez les patients EM/SFC.
    - Ni les 34 patients ponctionnés ni les 7 patients neuro-COVID n'ont de témoins ponctionnés.
    - 'Niveau ramené de C à D : aucune donnée humaine dans ces maladies.'
    inexploree: 'Aucun dosage cas-témoins de l''orexine du liquide céphalo-rachidien n''a été trouvé. Des cas isolés
      existent : une narcolepsie de type 2 après COVID-19 avec un taux d''hypocrétine « limite » (PMID 39622313)
      ; quatre hypersomnies centrales parmi 530 patients COVID long (PMID 38419710). Une revue de 2025 propose à
      l''inverse de bloquer l''orexine (PMID 40149526) : le sens de l''anomalie n''est pas établi.'
    decision: 'Gardée comme hypothèse théorique, après correction de son énoncé : la baisse décrite chez l''animal
      est aiguë, et aucun dosage cas-témoins n''existe chez les patients. Le test sur liquide céphalo-rachidien
      conservé reste à faire, avec des témoins ponctionnés.'
    contradiction:
      date: '2026-11-22'
      avis: tient en partie
      motif_initial: 'La source qui porte le signal le contredit : chez la souris, l''orexine revient à la normale
        en quinze jours. Aucune mesure n''existe chez les patients, et l''orexine A du plasma est normale chez les
        survivants à 2,5 ans. À rouvrir si un dosage dans le liquide céphalo-rachidien de patients est publié.'
      constats:
      - Le motif généralisait à « la souris » un retour à la normale montré dans un seul des deux modèles ; dans
        l'autre, la baisse est encore là au 14e jour.
      - 'Il écrivait « aucune mesure chez les patients » alors que deux cas isolés ont un dosage du liquide céphalo-rachidien
        : moins de 40 ng/L dans une narcolepsie de type 1, 170 pg/mL dans une narcolepsie de type 2.'
      - 'Le dosage plasmatique normal porte sur 14 survivants de réanimation, pas sur des patients COVID long :
        il ne teste pas la piste.'
      - Selon les auteurs d'un des cas, une perte partielle de neurones à orexine peut laisser un taux normal ou
        réduit dans le liquide céphalo-rachidien.
      suite: 'Mise à l''écart levée. Rien ne contredit la piste chez les patients : elle est sans donnée, comme
        B004, autre hypothèse théorique gardée au niveau D.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      constats:
      - Dix-sept des vingt faits contrôlés sont confirmés.
      - '« Sans suivi plus long » était inexact pour le second modèle animal : des coupes de l''hypothalamus existent
        au 60e jour, mais le texte n''en donne pas le résultat.'
      - 'Le test ne peut pas réfuter une perte partielle de neurones à orexine : selon les auteurs d''un des cas,
        elle laisse un taux normal ou réduit dans le liquide céphalo-rachidien. Il n''a ni seuil ni mesure de somnolence
        nommée.'
      - 'L''orexine A du liquide céphalo-rachidien baisse un peu dans les maladies inflammatoires du système nerveux
        : un taux bas ne désignerait pas à lui seul une perte de neurones à orexine.'
      - 'Trois des quatre hypersomnies centrales décrites après le COVID-19 sont des hypersomnies idiopathiques
        : elles ne montrent pas un déficit en orexine.'
      suite: 'Décision maintenue : vérifiée comme hypothèse théorique, niveau D. Le test est à réécrire : un taux
        normal ne réfute pas une perte partielle.'
- id: B004
  titre: Le canal calcique RyR1 du muscle reste « fuyant » après l'effort chez les patients, comme dans les myopathies
    liées à RYR1
  domaine_source: Myopathies liées au gène RYR1 ; faiblesse du diaphragme sous ventilation mécanique
  processus_commun: 'État du complexe RyR1 sur biopsie musculaire : oxydation, nitrosylation, phosphorylation, perte
    de la calstabine 1'
  enonce: Chez les patients qui ont un malaise après effort, le canal RyR1 laisserait fuir le calcium du réticulum
    plus fort et plus longtemps que chez des témoins. Cette fuite entraînerait lésions et perte de force. Si c'est
    vrai, les biopsies de patients montrent un RyR1 appauvri en calstabine 1, et l'écart avec les témoins se creuse
    après l'effort.
  pourquoi_inexploree: 'Europe PMC, « ryanodine receptor OR RyR1 OR calstabin » avec les termes EM/SFC ou COVID
    long : 2 résultats, soit une seule étude et sa prépublication. Elle porte sur le canal RyR2 dans le cerveau
    de personnes décédées du COVID aigu, pas sur le muscle. Aucune mesure de RyR1 dans le muscle de patients n''a
    été trouvée. ClinicalTrials.gov, « ryanodine OR Rycal OR ARM210 OR dantrolene » et ces maladies : 0 essai. Non
    trouvé ne veut pas dire inexistant.'
  test_propose: Sur des biopsies musculaires déjà congelées, prélevées avant et après un effort, mesurer la calstabine
    1 liée à RyR1 et les modifications du canal. La piste est réfutée si patients et témoins ne diffèrent ni au
    repos ni après l'effort.
  donnees_existantes: Biopsies de l'étude d'Appelman 2024 sur le COVID long (NCT05225688), faites avant et après
    induction du malaise après effort. La quantité de tissu restant est à demander à l'équipe.
  risques: 'Aucune mesure directe dans nos maladies : c''est une hypothèse théorique. L''exercice modifie RyR1 aussi
    chez la personne en bonne santé : il faut des témoins soumis au même effort. La piste recoupe la surcharge sodium–calcium
    du muscle déjà au registre (P07) ; elle s''en distingue par la cible mesurée. Le stabilisateur de RyR1 S48168
    (ARM210) n''a qu''un essai ouvert de phase 1 sur 7 patients : bien toléré sur 29 jours, sans preuve d''efficacité.
    Relecture du 2026-11-22, grille statistique : doutes aux questions 2, 3, 4, 6, 7 et 10. Les travaux sur le canal
    viennent d''un même laboratoire, lié au fabricant ; la ventilation mécanique suffit à rendre le canal fuyant
    chez l''animal : la fuite peut être une conséquence.'
  niveau: D
  sources:
  - titre: 'Remodeling of ryanodine receptor complex causes leaky channels: a molecular mechanism for decreased
      exercise capacity, PNAS 2008 (résumé)'
    url: https://pubmed.ncbi.nlm.nih.gov/18268335/
    lu: page
  - titre: 'Rycal S48168 (ARM210) for RYR1-related myopathies: a phase one, open-label, dose-escalation trial, EClinicalMedicine
      2024 (résumé)'
    url: https://pubmed.ncbi.nlm.nih.gov/38318125/
    lu: page
  - titre: Alzheimer's-like signaling in brains of COVID-19 patients, Alzheimer's & Dementia 2022 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/35112786/
    lu: page
  - titre: Respiratory muscle contractile inactivity induced by mechanical ventilation in piglets leads to leaky
      ryanodine receptors and diaphragm weakness, 2017 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/28260211/
    lu: page
  - titre: Muscle abnormalities worsen after post-exertional malaise in long COVID, Nature Communications 2024 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/38177128/
    lu: page
  - titre: 'Modification of the functional capacity of sarcoplasmic reticulum membranes in patients suffering from
      chronic fatigue syndrome, Neuromuscular disorders : NMD 2003 (résumé ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/12899875/
    lu: page
  origine: agent biologie
  date: '2026-11-22'
  statut: à vérifier
  relecture:
    date: '2026-11-22'
    lecture: '5 sources rouvertes : 3 en texte intégral, 2 par leur résumé.'
    affirmations: '21 affirmations contrôlées : 18 confirmées, 1 inexacte, 2 non trouvées.'
    corrections:
    - L'essai d'ARM210 a inclus 6 personnes, dont une traitée deux fois, et non 7.
    - Les auteurs de cet essai et de l'étude sur le cerveau ont des liens avec le fabricant de la molécule ; la
      fiche ne le dit pas.
    - Dans l'essai, l'action du médicament sur sa cible n'a pas pu être mesurée.
    - 'Chez Appelman, la créatine kinase n''augmente pas après l''effort, ce qui s''accorde mal avec une fuite de
      calcium qui léserait le muscle. Le second prélèvement est fait un jour après l''effort : une anomalie passagère
      a pu disparaître.'
    - 'Niveau laissé à D : une mesure directe de 2003 existe, mais elle n''est connue que par son résumé ; voir
      le test « inexplorée ».'
    inexploree: '« Aucune mesure dans le muscle de patients » est faux : une étude de 2003 décrit, sur des membranes
      du réticulum de patients atteints de syndrome de fatigue chronique, une altération de l''ouverture des canaux
      à ryanodine (PMID 12899875, lue par son résumé, sans effectif). Elle n''a pas été répliquée. Aucune étude
      dans le COVID long, aucun essai enregistré.'
    decision: 'À vérifier : le résultat de 2008 qui porte la piste n''est lu que par son résumé. Hypothèse théorique,
      niveau D. La mesure centrale du test n''a pas pu être faite comme prévu dans l''essai d''ARM210 : sa faisabilité
      sur biopsie est à établir avant de solliciter une équipe.'
    attaque:
      date: '2026-11-22'
      avis: ne tient pas
      decision_initiale: 'Gardée après corrections, comme hypothèse théorique : le test sur les biopsies déjà congelées
        reste le bon, et il a un précédent de 2003 à lire en entier avant de relever le niveau.'
      statut_initial: vérifiée
      constats:
      - Huit des douze faits contrôlés sont confirmés.
      - Le résultat qui porte la piste, un canal RyR1 appauvri en calstabine 1 après l'effort chez l'humain, vient
        de l'article de 2008, lu par son seul résumé. Aucune source lue en entier ne le montre. La règle met la
        piste « à vérifier », comme B008, B009 et B016.
      - 'Ce résumé décrit l''effet de l''effort lui-même, chez la souris et chez l''humain : aucune source ne montre
        un écart entre patients et témoins.'
      - 'Dans l''essai d''ARM210, la mesure que le test propose, la calstabine 1 liée à RyR1, n''a pas pu être faite
        comme prévu : le signal variait trop, jusque sur le tissu témoin. Une analyse exploratoire sur deux participants
        la dit possible si le tissu est bien préparé. « Le test reste le bon » était trop fort.'
      - 'Dans l''étude d''Appelman, les patients travaillent 5 heures par semaine contre 36 pour les témoins, et
        l''inactivité suffit à rendre le canal fuyant chez l''animal : un écart pourrait venir de l''inactivité.'
      - 'Le résumé de 2003 ne nomme ni RyR1 ni la calstabine, et attribue l''anomalie à la fluidité de la membrane
        : c''est un précédent plus lointain que la décision ne le disait.'
      suite: 'Statut ramené de « vérifiée » à « à vérifier » : la règle appliquée à B008, B009 et B016 vaut ici.
        L''article de 2008 (PMID 18268335) s''ajoute aux articles à lire en entier.'
- id: B005
  titre: Le liquide céphalo-rachidien des patients montre un déficit central en catécholamines, du même type que
    dans les synucléinopathies
  domaine_source: Maladie de Parkinson, atrophie multisystématisée, insuffisance autonome pure
  processus_commun: Taux de DOPA, de DOPAC et de DHPG dans le liquide céphalo-rachidien
  enonce: 'Le déficit central en catécholamines mesuré au NIH dans l''EM/SFC post-infectieuse et le neuro-COVID
    long serait un trait stable de la maladie, et non un hasard de petite série. Deux lectures s''opposent : un
    frein fonctionnel, ou un début d''agrégation de l''alpha-synucléine comme dans la maladie de Parkinson. Si la
    seconde est vraie, le test d''amplification de l''alpha-synucléine est plus souvent positif chez les patients
    que chez les témoins.'
  pourquoi_inexploree: 'Europe PMC, « catechol OR catechols OR DOPAC OR DHPG OR droxidopa » avec les termes EM/SFC
    ou COVID long : 13 résultats. Deux études de mesure, de la même équipe du NIH : 16 patients EM/SFC et 21 témoins
    (2024), puis 7 patients neuro-COVID long revus après un an (2024). Aucune réplication indépendante trouvée.
    ClinicalTrials.gov, « droxidopa OR levodopa OR catecholamine » et ces maladies : un seul essai pertinent, ouvert,
    de droxidopa dans le syndrome de fatigue chronique (NCT00977171), arrêté après 3 inclusions faute de recrutement.
    Aucun test d''amplification de l''alpha-synucléine n''a été trouvé dans ces maladies, hors une étude pilote
    sur la muqueuse olfactive après COVID. Non trouvé ne veut pas dire inexistant.'
  test_propose: Sur du liquide céphalo-rachidien déjà prélevé, refaire le dosage des catéchols dans une cohorte
    indépendante et y ajouter un test d'amplification de l'alpha-synucléine. La piste est réfutée si les catéchols
    sont normaux dans la seconde cohorte. La lecture « synucléine » est réfutée si le test n'est pas plus souvent
    positif que chez les témoins.
  donnees_existantes: Liquide céphalo-rachidien des deux études du NIH (Walitt 2024 ; Goldstein 2024) et de 34 patients
    EM/SFC ponctionnés (Jolley 2026). La conservation de ces prélèvements est à confirmer.
  risques: 'Très petits effectifs, une seule équipe, et de nombreuses comparaisons dans l''étude d''origine. La
    norépinéphrine et la dopamine elles-mêmes ne différaient pas entre patients et témoins. Dans l''étude pilote
    sur la muqueuse olfactive, la positivité du test suivait la perte d''odorat, pas les signes moteurs ou cognitifs,
    et sa portée est inconnue selon ses auteurs. La droxidopa est un médicament à risque, qui agit sur la pression
    artérielle ; son seul essai dans le syndrome de fatigue chronique n''a rien pu montrer. Relecture du 2026-11-22,
    grille statistique : doutes aux questions 2, 3, 4, 6, 7 et 10. Seize patients, une seule institution, des médicaments
    non arrêtés ; le test proposé n''a ni seuil ni liquide céphalo-rachidien confirmé.'
  niveau: C
  sources:
  - titre: Deep phenotyping of post-infectious myalgic encephalomyelitis/chronic fatigue syndrome, Nature Communications
      2024 (texte intégral, lu en partie)
    url: https://www.nature.com/articles/s41467-024-45107-3
    lu: page
    texte: https://pubmed.ncbi.nlm.nih.gov/38383456/
  - titre: Persistent Autonomic and Immunologic Abnormalities in Neurologic Post-Acute Sequelae of SARS-CoV2 Infection,
      Neurology 2024 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/39173103/
    lu: page
  - titre: Cerebrospinal fluid biomarkers of central catecholamine deficiency in Parkinson's disease and other synucleinopathies,
      Brain 2012 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/22451506/
    lu: page
  - titre: 'Prevalence of alpha-synuclein seeding activity in the Olfactory Mucosa following SARS-CoV-2 infection:
      results from a pilot study, Acta Neuropathologica 2026 (résumé)'
    url: https://pubmed.ncbi.nlm.nih.gov/42911254/
    lu: page
  - titre: An Open-Label Study To Assess The Clinical Benefit Of Droxidopa In Subjects With Chronic Fatigue Syndrome,
      NCT00977171 (fiche lue par l'interface du registre)
    url: https://clinicaltrials.gov/study/NCT00977171
    lu: page
  - titre: Cerebrospinal fluid opening pressure in relation to symptomatology and craniocervical anatomy in patients
      with ME/CFS, Frontiers in Medicine 2026 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/42614190/
    lu: page
  - titre: 'Central noradrenergic deficiency in post-infectious chronic fatigue: neurobehavioral correlates, Brain
      communications 2026 (résumé ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/42205163/
    lu: page
  - titre: 'Plasma and cerebrospinal fluid monoamine metabolism in patients with chronic fatigue syndrome: preliminary
      findings, Biological psychiatry 1992 (résumé ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/1282370/
    lu: page
  - titre: 'A case series of cutaneous phosphorylated α-synuclein in Long-COVID POTS, Clinical autonomic research
      : official journal of the Clinical Autonomic Research Society 2022 (titre seul ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/35570247/
    lu: extrait
  - titre: Post-COVID-19 Hyposmia Does Not Exhibit Main Neurodegeneration Markers in the Olfactory Pathway, Molecular
      neurobiology 2024 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/38570429/
    lu: page
  origine: agent biologie
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '6 sources rouvertes : 5 en texte intégral, 1 par son résumé.'
    affirmations: '24 affirmations contrôlées : 17 confirmées, 3 inexactes, 4 non trouvées.'
    corrections:
    - 'Dans le neuro-COVID long, un seul patient sur 7 a des taux bas de DOPA, de DOPAC et de DHPG aux deux visites,
      et deux les ont élevés : cette série ne montre pas de déficit général.'
    - « Trait stable » ne repose que sur ces 7 patients.
    - Aucune source ne compare le profil des patients à celui des synucléinopathies, qui varie d'ailleurs de l'une
      à l'autre.
    - Dans l'étude pilote sur la muqueuse olfactive, l'ensemble des personnes infectées ne diffère pas des témoins
      (24,2 % contre 11,9 %, p = 0,10) ; l'écart ne vaut que pour le sous-groupe avec perte d'odorat, plus âgé.
    - Les valeurs de p de l'étude du NIH ne sont pas corrigées pour comparaisons multiples.
    inexploree: 'Quatre travaux manquaient. La même équipe du NIH a publié en 2026 une étude à quatre groupes :
      la voie de la noradrénaline est abaissée dans le liquide céphalo-rachidien des patients EM/SFC post-infectieuse
      et COVID long, pas la voie de la dopamine (PMID 42205163). Cela affaiblit la lecture « synucléine ». Une étude
      de 1992 dosait déjà les métabolites des monoamines chez 19 patients et ne rapporte d''écart que dans le plasma
      (PMID 1282370). Pour la synucléine : une série de cas de dépôts cutanés dans la tachycardie posturale du COVID
      long (PMID 35570247, lettre connue par son titre seul), et une étude sans signe de synucléinopathie dans les
      neurones olfactifs de 10 patients (PMID 38570429). Toujours aucune réplication hors du NIH.'
    decision: 'Gardée après corrections : un déficit des métabolites des catéchols, mesuré par une seule équipe,
      à répliquer hors du NIH. Son recentrage sur la noradrénaline repose sur une étude de 2026 lue par son résumé
      ; la lecture « synucléine » reste la moins étayée, sans être écartée.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections, en la recentrant : déficit noradrénergique à répliquer hors
        du NIH ; la lecture « synucléine » est la moins étayée des deux.'
      constats:
      - Douze des seize faits contrôlés sont confirmés.
      - 'Le recentrage sur la noradrénaline vient de l''étude de 2026, lue par son seul résumé. L''étude de 2024,
        lue en entier, ne le montre pas : la noradrénaline et la dopamine n''y diffèrent pas entre les groupes.'
      - '« Aucune source ne compare aux synucléinopathies » était inexact : le résumé de 2026 inclut un groupe atteint
        de la maladie de Parkinson, dont la voie de la noradrénaline est abaissée elle aussi.'
      - '« Des médicaments non arrêtés », écrit dans les risques, est faux pour l''étude de 2024 : les médicaments
        gênants y ont été arrêtés avant le prélèvement.'
      - 'La série de biopsies de peau n''était pas connue par son titre seul : sa copie donne 63 % de biopsies positives
        sur 8 patients, sans témoins. Elle va dans le sens de la lecture « synucléine ».'
      - 'Dans la cohorte de 34 patients ponctionnés, la ponction n''a été faite que chez les patients : elle ne
        peut pas servir seule de cohorte de réplication.'
      suite: 'Décision reformulée : vérifiée, niveau C. La source du signal, l''étude de 2024, est lue en entier.
        L''étude de 2026 (PMID 42205163) est à lire en entier avant de recentrer la piste.'
- id: B006
  titre: Des auto-anticorps contre la sélénoprotéine P privent les tissus de sélénium et freinent l'activation de
    l'hormone thyroïdienne
  domaine_source: Thyroïdite de Hashimoto ; syndrome de T3 basse des maladies graves
  processus_commun: Auto-anticorps anti-SELENOP, activité de la glutathion peroxydase 3, rapport T3/T4 et T3 inverse
  enonce: 'Chez environ 10 à 16 % des patients EM/SFC, des auto-anticorps gêneraient le transport du sélénium. Les
    désiodases, qui ont besoin de sélénium, transformeraient moins bien la T4 en T3 active : un manque d''hormone
    dans les tissus, que la TSH ne montre pas. Si c''est vrai, les porteurs d''anticorps ont un rapport T3/T4 plus
    bas dans une cohorte indépendante.'
  pourquoi_inexploree: 'Europe PMC, « selenoprotein P OR SELENOP OR selenium » avec les termes EM/SFC ou COVID long
    : 26 résultats. Deux études mesurent ces auto-anticorps, avec le même laboratoire de dosage : 167 patients EM/SFC
    (2023) et 750 adultes après COVID (2026). Une étude de 98 patients décrit la T3 basse (2018). ClinicalTrials.gov,
    « selenium OR selenoprotein » et ces maladies : un essai ouvert de coenzyme Q10 et sélénium sur 8 semaines (NCT05128292,
    42 participants) ; une étude ouverte de cette association est publiée, sur 27 patients non sélectionnés sur
    les anticorps. Aucun essai chez des porteurs d''anticorps n''a été trouvé. Non trouvé ne veut pas dire inexistant.'
  test_propose: Faire doser par un second laboratoire les auto-anticorps anti-SELENOP, le sélénium, la GPX3 et les
    hormones thyroïdiennes (T3, T4, T3 inverse) dans du sérum déjà conservé. La piste est réfutée si les anticorps
    ne sont pas plus fréquents que chez les témoins, ou si les porteurs n'ont pas un rapport T3/T4 plus bas.
  donnees_existantes: 'UK ME/CFS Biobank : sérum de 340 patients, 136 témoins sains et 69 témoins atteints de sclérose
    en plaques. Biobanque RECOVER : sérum.'
  risques: 'Un seul laboratoire dose ces anticorps. Dans l''étude après COVID, ni le sélénium bas, ni la SELENOP
    basse, ni les anticorps pris seuls n''étaient nettement liés à la fatigue ; seule leur combinaison l''était,
    chez 14 à 24 personnes. Dans l''étude de 2018, la T3 libre basse touche 16 patients sur 98 contre 7 témoins
    sur 99, et l''intervalle de confiance touche 1. Les auteurs demandent eux-mêmes des essais. Aucun conseil de
    supplémentation n''en découle : l''innocuité du sélénium ou de la T3 dans ces maladies n''a pas été vérifiée
    ici. Relecture du 2026-11-22, grille statistique : doutes aux questions 2, 3, 4, 6, 7 et 10. Peu de porteurs
    d''anticorps, un seul laboratoire de dosage, une fatigue déclarée par les participants dans l''étude après COVID-19.'
  niveau: C
