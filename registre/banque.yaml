      in Patients with Q Fever Fatigue Syndrome (Qure Study): A Randomized Controlled Trial, Clinical Infectious
      Diseases 2017 (résumé ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/28329131/
    lu: page
