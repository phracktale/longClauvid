    url: https://pubmed.ncbi.nlm.nih.gov/40048515/
    lu: page
  - titre: Communiqué de l'université de Virginie sur l'étude Science 2025 (EurekAlert)
    url: https://www.eurekalert.org/news-releases/1076763
    lu: page
  - titre: Impaired VLCFA-peroxisome-mediated intestinal epithelial repair causes gastrointestinal sequelae of long
