    url: https://pubmed.ncbi.nlm.nih.gov/30665828/
    lu: page
  - titre: Persistent Redox Imbalance in Post-COVID-19 Syndrome, Antioxidants 2026 (texte intégral)
    url: https://pubmed.ncbi.nlm.nih.gov/42650277/
    lu: page
  - titre: Vitamin E and the risk of prostate cancer, the Selenium and Vitamin E Cancer Prevention Trial (SELECT),
      JAMA 2011 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/21990298/
    lu: page
  - titre: High-Dose Vitamin E (Alpha-Tocopherol) Supplementation To Reduce C-Reactive Protein In Patients With
      COVID-19, NCT07412574 (fiche lue par l'interface du registre)
    url: https://clinicaltrials.gov/study/NCT07412574
    lu: page
  origine: agent biologie, zone ferroptose
  date: '2026-11-23'
  statut: vérifiée
  relecture:
    date: '2026-11-23'
    lecture: '9 sources rouvertes : 5 en texte intégral, 3 par leur résumé, 1 fiche de registre.'
    affirmations: '32 affirmations contrôlées : 27 confirmées, 2 inexactes, 1 contredite, 2 non trouvées.'
    corrections:
    - 'Le titre est contredit par la source : dans l''étude de 2025, GPX4 est plus abondant chez les patients, pas
      déficitaire. La mesure porte sur un donneur par groupe.'
    - 'Le test proposé a déjà été fait en partie : dans cette étude, la liprostatine-1, un inhibiteur de la ferroptose,
      n''a pas d''effet significatif sur la prolifération des lymphocytes T de patientes EM/SFC ou COVID long.'
    - Les lymphocytes T des patientes prolifèrent plus, ce qui va à l'inverse d'une mort cellulaire.
    - '« Un glutathion plus haut chez les patients COVID long » ne vaut pas pour les médianes : la différence n''y
      est pas significative.'
    - Chez la souris, la vitamine E n'a rétabli qu'en partie les lymphocytes CD8 spécifiques du virus, sur 3 souris
      par groupe.
    - Quatre sources que la fiche dit lues par leur résumé ont une copie en texte intégral.
    inexploree: 'L''affirmation tient pour la ferroptose elle-même : aucune étude ne la mesure sur des cellules
      de patients, hors l''essai de liprostatine-1 de la source. La recherche remonte des revues et des textes d''hypothèse
      (PMID 37554293, PMID 38310391), et une étude de poumons de personnes décédées du COVID-19. Un essai enregistré
      porte sur la vitamine E et la CRP, pas sur ces maladies.'
    decision: 'Gardée comme hypothèse théorique, niveau ramené de C à D, après correction de son titre : les lipides
      des lymphocytes des patients sont plus oxydés, mais GPX4 n''est pas déficitaire, et la ferroptose n''a été
      mesurée sur aucune cellule de patient. Le test reste à faire en mesurant la mort des cellules, pas leur prolifération.'
    contradiction:
      date: '2026-11-23'
      avis: tient en partie
      motif_initial: La source du signal va contre la lecture que la piste en fait. GPX4 y est plus abondant chez
        les patients, leurs lymphocytes T prolifèrent plus, et l'inhibiteur de ferroptose essayé sur leurs cellules
        n'a pas d'effet significatif sur cette prolifération. L'oxydation des lipides des lymphocytes reste un résultat
        de l'étude ; ce qui tombe est son attribution à la ferroptose. À rouvrir si une étude mesure la mort par
        ferroptose sur des cellules de patients.
      constats:
      - 'Les faits du motif sont exacts, à un près : la prolifération accrue ne vaut que pour les femmes ; chez
        les hommes atteints d''EM/SFC, la source ne trouve pas de différence.'
      - 'L''essai de la liprostatine-1 ne mesure que la prolifération, sur 6 patientes. Il ne mesure ni la survie
        des cellules, ni leur mort, ni l''oxydation des lipides après traitement : il ne teste pas la ferroptose.'
      - GPX4 plus abondant est mesuré sur un donneur par groupe, et peut être une réponse de compensation.
      - '« Ce qui tombe est son attribution à la ferroptose » était trop fort : la source ne soutient pas cette
        lecture, elle ne la contredit pas.'
      suite: 'Mise à l''écart levée. Rien ne contredit la ferroptose chez les patients : elle est sans donnée, comme
        l''orexine (B003). La piste est gardée au niveau D, comme hypothèse théorique.'
- id: B023
  titre: Un taux plasmatique bas du transporteur SLC7A11 (système xc-) à l'hôpital annoncerait le COVID long
  domaine_source: COVID-19 aigu hospitalisé ; ferroptose (système cystine-glutamate xc-, GPX4, ACSL4)
  processus_commun: SLC7A11 (importe la cystine, nécessaire au glutathion), GPX4 et ACSL4 dosés dans le plasma,
    mesurés en phase aiguë puis suivis du COVID long
  enonce: 'Le système xc- importe la cystine, qui sert à fabriquer le glutathion, lequel sert à GPX4. Un système
    xc- faible laisserait les cellules sans défense contre la peroxydation des lipides. Une étude chez 127 patients
    hospitalisés trouve que ceux qui développent un COVID long avaient, à l''entrée, moins de SLC7A11 dans le plasma.
    L''hypothèse : un système xc- déficient en phase aiguë prépare le COVID long. Si c''est vrai, dans une cohorte
    indépendante dont le plasma de la phase aiguë est conservé, les patients qui auront un COVID long à trois mois
    ou plus ont un SLC7A11 plasmatique plus bas à l''entrée que ceux qui guérissent, avec un effet de même sens
    après ajustement sur la gravité aiguë, l''âge et le sexe.'
  pourquoi_inexploree: 'Europe PMC, le 2026-11-23. (1) (ACSL4 OR SLC7A11 OR xCT OR « system xc ») ET (long COVID
    OR post-COVID OR chronic fatigue OR myalgic) dans titre ou résumé : 2 résultats, dont l''étude de 127 patients
    (Zhao 2025) et une prépublication théorique. (2) (ferroptosis OR GPX4) ET (long COVID OR post-COVID OR post-acute
    sequelae) : 10 résultats ; aucun autre ne mesure SLC7A11 ou GPX4 chez des patients avec un suivi du COVID long.
    Les marqueurs de ferroptose en phase aiguë existent par ailleurs chez 120 patients de réanimation (Peleman 2023),
    sans suivi du COVID long dans le résumé. ClinicalTrials.gov (interface v2), « ferroptosis » : 31 études, une
    seule touche le COVID (NCT07412574, vitamine E à forte dose en COVID aigu) ; « GPX4 » : 18 études, aucune dans
    ces maladies. Pas d''essai sélectionné sur SLC7A11 trouvé. Non trouvé ne veut pas dire inexistant.'
  test_propose: 'Dans une cohorte de patients COVID-19 avec plasma de la phase aiguë congelé et suivi d''au moins
    trois mois, doser SLC7A11, GPX4 et ACSL4 dans une seconde équipe (méthode écrite avant, deux techniques si possible,
    car SLC7A11 est une protéine de membrane et son dosage plasmatique est discutable), et comparer ceux qui ont
    un COVID long à ceux qui se rétablissent. Seuil écrit avant les données : écart de SLC7A11 d''au moins 0,5 écart-type
    dans le sens de l''étude de 2025, intervalle de confiance exclu de zéro après ajustement ; un seul marqueur
    est la cible, les deux autres sont secondaires et la correction des comparaisons multiples est faite sur eux.
    La piste est réfutée si SLC7A11 n''est pas plus bas chez les futurs COVID long, ou s''il change de sens après
    ajustement sur la gravité aiguë.'
  donnees_existantes: 'Cohorte de Zhao 2025 : 127 patients hospitalisés pour COVID-19, plasma et PBMC à l''entrée,
    suivi par téléphone à 3 mois ; accès non vérifié. Biobanque RECOVER : citée dans la banque (B012), page non
    rouverte ici ; à confirmer : plasma de la phase aiguë et suivi de plus de trois mois. Une cohorte indépendante
    avec plasma aigu et suivi reste à nommer : je n''en ai pas confirmé.'
  risques: 'Un seul résumé, une seule équipe, 127 patients hospitalisés ; je ne sais pas combien ont un COVID long,
    le résumé ne le dit pas, et le texte intégral n''a pas été ouvert. Le COVID long y est jugé par un appel téléphonique
    trois mois après la sortie de l''hôpital : la définition du cas n''est pas détaillée dans le résumé. Le résumé
    teste plusieurs marqueurs (GPX4, ACSL4, SLC7A11, cytokines) sans dire comment les comparaisons multiples ont
    été corrigées. La mesure est un dosage plasmatique d''une protéine de membrane : ce qu''elle reflète est incertain.
    Le sens est discutable : en cas de stress, beaucoup de cellules augmentent SLC7A11. Après traitement les taux
    de SLC7A11 et de GPX4 remontent, ce qui peut dire que le marqueur suit la gravité aiguë plutôt que d''annoncer
    le COVID long. Chez 120 patients de réanimation, le marqueur de ferroptose MDA tend à monter mais n''a aucun
    lien avec l''issue (Peleman 2023) ; 40 % n''ont aucune signature de mort cellulaire ; le résumé ne dit rien
    du COVID long. Chez la souris exposée à la protéine spike, GPX4 monte ou baisse selon la région du cerveau et
    le délai (Yehia 2026, échantillon limité, de l''aveu des auteurs). Aucun levier n''est proposé : les inhibiteurs
    ou activateurs du système xc- n''ont pas été examinés ici et rien ne permet d''en conseiller. Relecture du 2026-11-23,
    grille statistique : doutes aux questions 1, 2, 3, 4, 5, 7, 9 et 10. Le signal tient à une phrase de résumé,
    sans effectif de COVID long, sans taille d''effet ni ajustement ; le COVID long y est établi par un appel téléphonique
    à trois mois.'
  niveau: C
  sources:
  - titre: Role of Ferroptosis in the Progression of COVID-19 and the Development of Long COVID, Current Medicinal
      Chemistry 2025 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/38310391/
    lu: page
  - titre: Ferroptosis and pyroptosis signatures in critical COVID-19 patients, Cell Death and Differentiation 2023
      (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/37582864/
    lu: page
  - titre: SARS-CoV-2 Spike Protein Induces Time-Dependent and Brain-Region-Specific Alterations in Ferroptosis
      Markers, International Journal of Molecular Sciences 2026 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/41683943/
    lu: page
  - titre: High-Dose Vitamin E (Alpha-Tocopherol) Supplementation To Reduce C-Reactive Protein In Patients With
      COVID-19, NCT07412574 (fiche lue par l'interface du registre)
    url: https://clinicaltrials.gov/study/NCT07412574
    lu: page
  origine: agent biologie, zone ferroptose
  date: '2026-11-23'
  statut: à vérifier
  relecture:
    date: '2026-11-23'
    lecture: '4 sources rouvertes : 2 en texte intégral, 1 par son résumé, 1 fiche de registre.'
    affirmations: '22 affirmations contrôlées : 17 confirmées, 5 non trouvées.'
    corrections:
    - 'Dans le résumé qui porte le signal, SLC7A11 et GPX4 sont liés négativement aux cytokines de l''inflammation
      : le taux bas peut refléter la gravité de la phase aiguë.'
    - '« Sans lien avec l''issue » est incomplet pour l''étude de réanimation : son groupe à signature de ferroptose,
      4 patients, a une mortalité à 90 jours plus haute (rapport de cotes 19,7, de 1,36 à 283,6).'
    - Ni l'étude de réanimation ni l'étude chez la souris ne mesurent SLC7A11.
    - « SLC7A11 monte sous stress » n'est dans aucune copie.
    inexploree: 'L''affirmation tient : aucune autre mesure de SLC7A11 dans ces maladies, aucun essai enregistré.
      La recherche ne remonte que des revues et des textes d''hypothèse.'
    decision: 'Relecture incomplète : l''étude qui porte le signal (PMID 38310391) n''est accessible que par son
      résumé, qui ne donne ni effectif de COVID long ni taille d''effet. La piste reste à vérifier jusqu''à la lecture
      de son texte.'
- id: B024
  titre: Une diarrhée par malabsorption des acides biliaires, avec FGF19 bas et C4 haut, pourrait expliquer une
    partie des diarrhées persistantes du COVID long
  domaine_source: Diarrhée aux acides biliaires (malabsorption des acides biliaires), y compris après une gastro-entérite
    ; syndrome de l'intestin irritable à diarrhée
  processus_commun: Une partie des acides biliaires n'est pas réabsorbée dans l'iléon et arrive dans le côlon. Elle
    se mesure par la rétention du 75SeHCAT, par le C4 sérique (précurseur de la synthèse des acides biliaires, haut
    quand la réabsorption est faible) et par le FGF19 sérique (hormone de l'iléon, basse dans cette maladie).
  enonce: Une diarrhée qui dure plus de trois mois après le COVID-19 est parfois une diarrhée aux acides biliaires,
    comme celle qui suit certaines gastro-entérites. Aucune étude trouvée ne l'a mesurée dans le COVID long. Si
    c'est vrai, une part plus grande des personnes avec diarrhée persistante après le COVID aura un C4 haut et un
    FGF19 bas qu'un groupe post-COVID sans diarrhée, et la diarrhée de ce sous-groupe cédera aux chélateurs d'acides
    biliaires.
  pourquoi_inexploree: 'Requêtes faites le 2026-11-23. Europe PMC, champs titre et résumé : « bile acid malabsorption
    » ET (COVID OU « long COVID ») : 0 résultat. Europe PMC : (« bile acid diarrhoea/diarrhea » OU « bile acid malabsorption
    » OU « bile acid ») ET (COVID-19 OU SARS-CoV-2) ET (diarrhoea OU diarrhea OU « irritable bowel ») : 5 résultats
    ; deux seulement concernent le sujet, un cas clinique en phase aiguë (PMID 35122223) et une étude de cellules
    d''intestin sur le récepteur FXR (PMID 37697930). Europe PMC : (cholestyramine OU colesevelam) ET (« long COVID
    » OU « post-COVID » OU « chronic fatigue ») : 4 résultats, aucun sur la diarrhée. Europe PMC : (FGF19 OU « fibroblast
    growth factor 19 ») ET (COVID OU « chronic fatigue ») : 5 résultats, aucun sur le FGF19 dans le COVID long.
    ClinicalTrials.gov : « bile acid diarrhea AND COVID » : 0 résultat ; (acides biliaires ou chélateurs ou acide
    ursodésoxycholique) ET (long COVID OU post-COVID OU PASC) : 5 résultats, dont une seule étude pertinente, NCT06825819
    (recrutement en cours), qui mesure les acides biliaires secondaires, pas la malabsorption ni un traitement.
    La revue de 2026 sur la diarrhée persistante après le COVID (PMID 42959510) dit que les preuves de traitement
    propres à cette diarrhée sont rares et ne cite pas la diarrhée aux acides biliaires dans son résumé. Non trouvé
    ne veut pas dire inexistant.'
  test_propose: 'Sur des échantillons de sérum déjà stockés de personnes avec COVID long, doser le C4 et le FGF19
    (méthodes publiées) et comparer trois groupes : diarrhée persistante après le COVID, COVID long sans diarrhée,
    personnes guéries. Seuil de départ pour le FGF19 : 117,3 pg/mL, valeur d''une seule équipe, à recalibrer avec
    les témoins du jeu de données. Si un sous-groupe est positif, l''essai suivant est un 75SeHCAT puis un chélateur
    en double aveugle sur ce sous-groupe seul. La piste est réfutée si, dans un groupe d''au moins 100 personnes
    avec diarrhée persistante, la part de C4 haut et FGF19 bas n''est pas plus grande que chez les post-COVID sans
    diarrhée (intervalle de confiance à 95 % de la différence qui contient 0).'
  donnees_existantes: 'NCT06825819 (étude cas-témoins annoncée de 400 personnes avec et sans COVID long, selles
    et sang appariés, en recrutement) : à confirmer, si des sérums restent disponibles pour doser C4 et FGF19 et
    si la diarrhée est notée. Les biobanques du COVID long (RECOVER) et du Royaume-Uni (UK ME/CFS Biobank) sont
    à interroger : non ouvertes pendant cette recherche, leur contenu en sérum et en symptômes digestifs reste à
    confirmer.'
  risques: 'Preuve directe très mince : un cas clinique en phase aiguë, chez un homme de 59 ans sous ventilation
    et corticoïdes (PMID 35122223) ; le reste est une extrapolation depuis l''intestin irritable. Les chiffres de
    référence viennent d''une autre population : malabsorption chez 32 % des patients à diarrhée de l''intestin
    irritable (IC à 95 % de 24 % à 40 %, 10 études, 1034 patients, mesure par 75SeHCAT, PMID 36867517) ; dans cette
    méta-analyse, les seuils de C4 et de FGF19 varient selon les études. Le seuil de FGF19 vient d''une étude chinoise
    de 60 patients et 80 témoins, 23 patients dans le groupe diarrhée aux acides biliaires (PMID 34041651), sans
    réplication vérifiée ici. Une diarrhée après le COVID a d''autres causes plus fréquentes (médicaments, dysbiose,
    intestin irritable) : le groupe témoin doit les exclure. Le FXR active aussi l''ACE2 dans des cellules d''intestin
    (PMID 37697930) : un agoniste de FXR pourrait donc être néfaste, pas seulement inutile. Aucun agoniste de FXR
    n''est proposé ici ; l''acide obéticholique a été retiré du marché après des démangeaisons, des changements
    du cholestérol et des inquiétudes pour le foie, sans bénéfice clinique confirmé (PMID 42961163, résumé). Les
    chélateurs (cholestyramine, colesevelam) ont une tolérance jugée correcte dans six essais de 182 participants
    avec diagnostic objectif (PMID 41090475), mais ils gênent l''absorption d''autres médicaments et peuvent constiper
    ; ce n''est pas un avis médical. L''acide ursodésoxycholique n''a pas amélioré le COVID long dans un essai contrôlé
    de 396 adultes (récupération 68,2 % contre 68,2 % sous placebo, 14 jours, PMID 41771135), mais cet essai n''a
    pas choisi ses patients sur ce mécanisme et ce médicament n''est pas un chélateur. Série sur la malabsorption
    après gastro-entérite : 25 patients, sans groupe témoin, rétrospective (PMID 21389860). Relecture du 2026-11-23,
    grille statistique : doutes aux questions 1, 2, 3, 4, 6, 7, 9 et 10. Un seul patient porte le signal direct,
    sans aucun marqueur dosé ; le seuil de FGF19 vient d''un échantillon sans validation.'
