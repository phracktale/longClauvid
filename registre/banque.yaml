- id: B014
  titre: Le variant de FOXP4 associé au COVID long désigne un sous-type pulmonaire, distinct du COVID long auto-déclaré
    et de l'EM/SFC
  domaine_source: Études d'association pangénomique du COVID long, comparées entre elles
  processus_commun: 'FOXP4, un gène impliqué dans la physiologie du poumon : séquelle respiratoire de l''infection'
  enonce: 'L''association de FOXP4 ne vaut que pour une partie des malades : ceux dont le COVID long a été diagnostiqué
    à l''hôpital ou en clinique et comporte une atteinte respiratoire. Elle ne vaut pas pour la forme dominée par
    la fatigue, proche de l''EM/SFC. L''hypothèse est réfutée si l''allèle à risque est aussi fréquent dans les
    deux formes.'
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « FOXP4 long COVID functional follow-up », « rs9367106 respiratory
    symptoms phenotype ». Trouvé : une analyse purement informatique du variant et une étude sur le cancer du poumon,
    lues par leur titre seulement. Aucune étude trouvée qui compare le génotype selon le type de symptômes, et aucun
    essai. Le registre ne cite pas FOXP4.'
  test_propose: 'Dans une cohorte génotypée où les symptômes sont décrits, comparer la fréquence de l''allèle C
    de rs9367106 entre trois groupes : COVID long respiratoire, COVID long à fatigue dominante, personnes infectées
    et rétablies. Analyse fixée d''avance : rapport de cotes de chaque forme contre les rétablis, puis test de la
    différence entre les deux formes, ajusté sur l''hospitalisation. Réfutation : la forme à fatigue dominante montre
    un rapport de cotes d''au moins 1,3, avec un intervalle qui exclut 1.'
  donnees_existantes: 'Statistiques résumées de l''étude HGI ; cohortes génotypées avec symptômes, à identifier.
    Une cohorte finlandaise serait plus puissante : l''allèle y atteint 7,1 %'
  risques: 'Effet probablement surestimé : il tombe de 1,63 à 1,34 quand la définition des cas s''élargit, et à
    1,30 (p = 3,8 × 10⁻³) quand les témoins sont des personnes infectées. L''allèle est rare chez les Européens
    non finlandais (1,6 %) et fréquent en Asie de l''Est (36 %), d''où un risque de stratification. FOXP4 est aussi
    lié au COVID sévère : l''association peut passer par la gravité de la phase aiguë. Les définitions des cas diffèrent
    d''une étude à l''autre. Relecture du 2026-11-22, grille statistique : doutes aux questions 3, 4, 5, 9 et 10.
    L''effet tombe de 1,63 à 1,16 selon la définition des cas et le choix des témoins ; il n''est retrouvé ni chez
    23andMe ni dans DecodeME.'
  niveau: B
  solidite_statistique: 'Étude HGI : jusqu''à 6 450 cas et 1 093 995 témoins, 24 études, 16 pays. Variant rs9367106
    : rapport de cotes 1,63 (1,40–1,89), p = 1,8 × 10⁻¹⁰ pour la définition stricte (3 018 cas) ; 1,34 (1,20–1,49),
    p = 1,1 × 10⁻⁷ pour la définition large. Répliqué, selon le résumé de l''article publié, sur 9 500 cas et 798
    835 témoins. Deux résultats contraires : non retrouvé chez 23andMe (p = 0,57, 54 390 cas auto-déclarés) et non
    partagé avec l''EM/SFC dans DecodeME (p = 0,59). Ces échecs ne tiennent pas à un manque de puissance : calcul
    Python, test allélique, fréquence supposée de 1,6 %, alpha 0,05 : puissance de 0,995 chez les Européens de 23andMe
    et de 0,89 dans DecodeME, même pour un rapport de cotes de 1,16. Biais principal : hétérogénéité de la définition
    des cas.'
