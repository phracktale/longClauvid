  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '10 sources rouvertes : 5 en texte intégral, 3 par leur résumé, 2 pages lues en partie.'
    affirmations: '25 affirmations contrôlées : 20 confirmées, 4 non trouvées, 1 contredite.'
    corrections:
    - 'La prédiction « normale chez les personnes rétablies » est déjà contredite par une source de la fiche : trois
      mois après l''infection, l''endothéline-1 est élevée chez des survivants non choisis pour leurs symptômes
      (2,52 contre 1,24 pg/mL).'
    - Chez Haffke, l'élévation n'est retrouvée que dans une des deux cohortes.
    - 'Aucune source ne mesure à la fois l''endothéline-1 et le débit sanguin cérébral : le test proposé n''a pas
      encore de jeu de données.'
    - L'essai du macitentan est financé par son fabricant.
    - Le niveau B vaut pour l'élévation après l'infection. Le lien avec les symptômes est moins sûr, et le levier
      n'a aucune donnée.
    inexploree: 'L''affirmation tient pour le levier : aucun essai d''un antagoniste. Le marqueur est plus étudié
      que ne le dit la fiche : il est lié aux symptômes 24 mois après l''infection chez 148 personnes (PMID 37868959)
      et croît avec la gravité de la phase aiguë chez 502 patients (PMID 42859327). Une lettre de 2004 sur l''endothéline-1
      dans le syndrome de fatigue chronique n''a pas pu être lue (PMID 14739476).'
    decision: 'Gardée après corrections. La question utile est devenue : l''endothéline-1 distingue-t-elle les patients
      des personnes infectées et rétablies ?'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      constats:
      - Neuf des onze faits contrôlés sont confirmés.
      - Une correction de la relecture était inexacte. Chez Haffke, l'endothéline-1 est élevée chez les patients
        EM/SFC dans les deux cohortes ; c'est chez les patients sans EM/SFC qu'elle ne l'est que dans la seconde.
      - '« Reste élevée » n''est pas montré à distance : dans la cohorte suivie de 18 à 24 mois, la moyenne est
        revenue dans les valeurs normales, et 30,6 % des personnes restent au-dessus.'
      - Chez les patients COVID long de l'étude espagnole, les symptômes suivent VCAM-1 et non l'endothéline-1 ;
        le lien avec l'endothéline-1 n'y vaut que pour l'EM/SFC.
      - 'Le seul groupe de personnes rétablies compte 20 personnes. Aucune source ne dose l''endothéline-1 et ne
        mesure le débit cérébral chez les mêmes personnes : le test n''a pas de jeu de données.'
      suite: 'Décision maintenue : vérifiée. Le niveau B ne vaut que pour l''élévation dans les mois qui suivent
        l''infection ; le lien avec les symptômes repose sur une équipe, celui avec le débit cérébral sur aucune
        mesure.'
- id: B011
  titre: Les peptides codés par l'ADN mitochondrial, humanine et MOTS-c, sont abaissés dans la fatigue après fièvre
    Q et dans l'EM/SFC
  domaine_source: Syndrome de fatigue après fièvre Q
  processus_commun: Expression des gènes MT-RNR2 (humanine) et MT-RNR1 (MOTS-c) dans les monocytes ; taux d'humanine
  enonce: Une baisse durable des peptides dérivés de la mitochondrie serait une trace commune des fatigues post-infectieuses.
    Si c'est vrai, elle se retrouve dans le COVID long, et elle distingue les personnes fatiguées des personnes
    infectées puis rétablies.
  pourquoi_inexploree: 'Europe PMC, « humanin OR MOTS-c OR mitochondrial-derived peptide » avec les termes EM/SFC
    ou COVID long : 5 résultats. Une seule étude de mesure, sur 10 personnes par groupe (Raijmakers 2019), et une
    prépublication d''opinion en faveur de MOTS-c (2025). Aucune mesure dans le COVID long n''a été trouvée. ClinicalTrials.gov,
    « MOTS-c OR humanin OR mitochondrial-derived peptide » et ces maladies : 0 essai. Non trouvé ne veut pas dire
    inexistant.'
  test_propose: Doser l'humanine et MOTS-c dans du plasma conservé, et lire MT-RNR1 et MT-RNR2 dans des données
    de séquençage d'ARN déjà produites, chez des patients, des témoins sains et des personnes rétablies. La piste
    est réfutée si les taux ne diffèrent pas, ou s'ils sont aussi bas chez les personnes rétablies.
  donnees_existantes: UK ME/CFS Biobank (plasma, sang pour ARN) ; biobanque RECOVER (sérum, cellules mononucléées).
    Aucun jeu de données d'ARN n'a été vérifié pour ces deux gènes dans cette recherche.
  risques: 'Dix personnes par groupe, une seule équipe. Dans cette étude, les témoins séropositifs pour la fièvre
    Q mais sans fatigue avaient eux aussi une expression abaissée, à un moindre degré : le marqueur suit peut-être
    l''infection passée et non la fatigue. L''effet de MOTS-c sur la performance physique vient de la souris. Selon
    la prépublication de 2025, les données de sécurité et d''efficacité chez l''humain manquent. Sur ClinicalTrials.gov,
    le seul essai de MOTS-c repéré chez l''humain est en cours dans le prédiabète. MOTS-c n''a donc pas sa place
    hors d''un essai. Relecture du 2026-11-22, grille statistique : doutes aux questions 1, 2, 3, 4, 5, 6, 7 et
    10. Question 5 : un écart d''expression de 21 à 37 fois sur des gènes d''ARN ribosomique est trop grand pour
    être cru tel quel ; un artefact technique n''est pas exclu, c''est une interprétation de la relecture. La piste
    n''est gardée que pour le résultat d''une autre équipe.'
  niveau: C
  sources:
  - titre: A possible role for mitochondrial-derived peptides humanin and MOTS-c in patients with Q fever fatigue
      syndrome and chronic fatigue syndrome, Journal of Translational Medicine 2019 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/31088495/
