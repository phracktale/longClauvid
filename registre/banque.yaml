  origine: agent biologie
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '10 sources rouvertes : 4 en texte intégral, 4 par leur résumé, 1 page lue en partie, 1 page bloquée.'
    affirmations: '20 affirmations contrôlées : 14 confirmées, 2 inexactes, 4 non trouvées.'
    corrections:
    - L'ARN des kinases PDK a été mesuré chez 75 patients et 43 témoins. Les 200 patients et 102 témoins de la fiche
      valent pour les acides aminés du sérum.
    - 'Aucune source ne mesure l''activité de la pyruvate déshydrogénase ni le lactate à l''effort chez des patients
      : le mécanisme est une hypothèse des auteurs.'
    - La série ouverte de 2018 porte sur un complément alimentaire qui contient du dichloroacétate, pas sur le médicament
      seul.
    - La fiche tait que l'étude de 2016 se dit exploratoire, ne corrige pas ses comparaisons multiples, trouve la
      baisse des acides aminés surtout chez les femmes, et voit PDK1 augmenter avec la durée et la gravité de la
      maladie.
    - L'essai de phase 3 chez l'enfant est en partie financé par le fabricant du médicament.
    - 'Biobanque britannique : la page citée est bloquée. L''article de 2018 qui la décrit compte 350 patients parmi
      600 participants ; les 340 patients et 136 témoins de la fiche n''ont pas été retrouvés.'
    inexploree: 'L''affirmation tient pour le COVID long : aucune étude, aucun essai enregistré. Deux travaux manquaient
      à la fiche : une protéomique de 6 patients EM/SFC, d''une autre équipe, qui trouve des altérations centrées
      sur la pyruvate déshydrogénase dans les cellules du sang (PMID 34209852), et une critique de l''étude de 2016
      parue en 2017 (PMID 29231630), connue par son titre seul.'
    decision: 'Gardée après corrections : le signal de 2016 est fidèlement rapporté, le test sur échantillons conservés
      est faisable.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      constats:
      - Dix-sept des dix-huit faits contrôlés sont confirmés.
      - 'La protéomique de l''autre équipe ne réplique pas le signal : sur 6 patients et 4 témoins, elle trouve
        abaissée une sous-unité régulatrice de la phosphatase (PDPR), pas une hausse des kinases.'
      - 'L''étude de 2016 ne mesure pas le métabolisme dans le muscle des patients et ne corrige pas ses comparaisons
        multiples. Les sérums des patients datent surtout de fin 2014 et de 2015, ceux des témoins de 2012 pour
        62 sur 102 : un effet de lot n''est pas écarté.'
      - 'L''ARN de PDK1 suit la durée, la gravité et l''inactivité : une hausse des kinases peut être une conséquence
        de la maladie.'
      - Le test n'a ni seuil chiffré ni analyse par sexe, alors que la baisse des acides aminés n'est nette que
        chez les femmes.
      suite: 'Décision maintenue : vérifiée, niveau C. Le test est à écrire avec un seuil, une analyse par sexe
        et un ajustement sur la durée et la gravité de la maladie.'
- id: B002
  titre: 'Les peroxysomes fonctionnent mal après l''infection : les plasmalogènes baissent dans l''EM/SFC et les
    peroxysomes se raréfient dans le poumon et l''intestin après le SARS-CoV-2'
  domaine_source: Biologie des peroxysomes et réparation des tissus après une infection virale ; plasmalogènes dans
    la maladie d'Alzheimer
  processus_commun: Plasmalogènes et éthers de phospholipides du plasma ; abondance des peroxysomes dans les macrophages
    et l'épithélium intestinal
  enonce: Un défaut de fonction des peroxysomes persisterait après l'infection chez une partie des patients. Il
    se lirait dans le sang par une baisse des plasmalogènes. Si c'est vrai, les patients COVID long ont des plasmalogènes
    plus bas que des personnes rétablies de la même infection.
  pourquoi_inexploree: 'Europe PMC, « plasmalogen » avec les termes EM/SFC ou COVID long : 4 résultats, dont une
    seule étude de mesure (Che 2022, 106 patients EM/SFC et 91 témoins). Une revue de 2023 écrit que les plasmalogènes
    n''ont pas encore été mesurés dans le COVID long. En élargissant à « peroxisome » : deux études expérimentales
    récentes sur les séquelles du COVID, dans le poumon (2025) et l''intestin (2026). ClinicalTrials.gov, « plasmalogen
    OR fenofibrate OR phenylbutyrate OR peroxisome » et ces maladies : 0 essai. Non trouvé ne veut pas dire inexistant.'
  test_propose: Doser les plasmalogènes et les éthers de phospholipides dans du sérum ou du plasma déjà conservés,
    chez des patients COVID long et des témoins rétablis, puis dans une seconde cohorte EM/SFC. La piste est réfutée
    si les taux ne diffèrent pas, ou si la baisse de 2022 ne se reproduit pas.
  donnees_existantes: UK ME/CFS Biobank (plasma et sérum) ; biobanque RECOVER (sérum). Aucun jeu de données de lipidomique
    public n'a été vérifié dans cette recherche.
  risques: 'La baisse des plasmalogènes vient d''une seule cohorte, et ses auteurs demandent une validation. Elle
    peut refléter autre chose qu''un défaut des peroxysomes. Les deux études sur le COVID portent surtout sur l''animal
    et sur des séquelles pulmonaires ou digestives, pas sur la fatigue. Dans la maladie d''Alzheimer légère, un
    essai de 328 patients avec des plasmalogènes oraux n''a pas atteint son critère principal. Le phénylbutyrate
    de sodium, utilisé chez l''animal dans ces études, a échoué dans la SLA (fiche T11 du registre). Le communiqué
    de l''université dit que d''autres recherches sont nécessaires avant tout usage dans le COVID long. Relecture
    du 2026-11-22, grille statistique : doutes aux questions 2, 3, 4, 6, 7 et 10. Les prélèvements sont faits après
    quatorze ans de maladie en médiane ; les groupes diffèrent par la saison du prélèvement et par le côlon irritable.'
  niveau: C
  sources:
  - titre: Metabolomic Evidence for Peroxisomal Dysfunction in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome,
      International Journal of Molecular Sciences 2022 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/35887252/
    lu: page
  - titre: Macrophage peroxisomes guide alveolar regeneration and limit SARS-CoV-2 tissue sequelae, Science 2025
