  relecture:
    date: '2026-11-23'
    lecture: '10 sources rouvertes : 2 en texte intégral, 7 par leur résumé, 1 fiche de registre.'
    affirmations: '32 affirmations contrôlées : 23 confirmées, 2 inexactes, 7 non trouvées.'
    corrections:
    - 'Le cas clinique n''est pas un cas de phase aiguë : la diarrhée commence au 30e jour, et ses auteurs la rattachent
      à un syndrome post-COVID.'
    - 'Ce cas est une entérite sévère, avec des ulcères saignants de l''iléon et du côlon. Ni le C4 ni le FGF19
      n''y sont dosés : la malabsorption est présumée sur la réponse au chélateur.'
    - L'essai de l'acide ursodésoxycholique traite 14 jours et mesure la récupération à 8 semaines.
    - 'L''étude sur le récepteur FXR est une étude de cellules, et elle conclut que ce récepteur est une cible prometteuse
      : le risque que la fiche en tire est une inférence du déposant.'
    - 'L''essai NCT06825819 exclut les personnes qui ont un trouble digestif chronique : il ne testera pas la piste.'
    - 'La fiche tait un appui : dans une série de 25 patients après une gastro-entérite, 72 % voient leur diarrhée
      disparaître sous cholestyramine.'
    - Une revue de 2026 juge le lien entre acides biliaires et diarrhée après le COVID-19 insuffisamment étayé.
    inexploree: 'L''affirmation tient : aucun dosage du C4 ou du FGF19 dans le COVID long, aucun essai d''un chélateur.
      La recherche ne remonte rien de plus.'
    decision: 'Gardée comme hypothèse théorique, niveau D : le seul appui direct est un cas d''un mois, sans marqueur
      dosé et confondu par d''autres traitements. Le test demande des sérums de patients avec diarrhée persistante
      ; aucun jeu de données n''est confirmé, et les seuils sont à fixer d''avance.'
    attaque:
      date: '2026-11-23'
      avis: tient en partie
      decision_initiale: 'Gardée comme hypothèse théorique, niveau D : le seul appui direct est un cas, sans marqueur
        dosé. Le test sur sérums conservés est simple, mais aucun jeu de données n''est nommé.'
      constats:
      - Neuf des douze faits contrôlés sont confirmés.
      - '« Aucun jeu de données n''est nommé » était inexact : la fiche en nomme trois, dont aucun n''est confirmé.
        Aucune copie ne montre que des sérums de patients avec diarrhée persistante sont conservés.'
      - 'Le cas dure environ un mois et finit sans récidive : il est loin des trois mois de l''énoncé. Son amélioration
        est confondue avec l''albumine, les diurétiques et la nutrition par voie veineuse.'
      - Le seuil de FGF19 ne vaut, selon ses auteurs, que pour un iléon normal ; le cas a des ulcères de l'iléon.
        Aucun seuil de C4 n'est fixé pour le test.
      - 'Question 9 de la grille : la malabsorption du cas est présumée, pas mesurée. Le doute n''est pas retenu
        au sens de la règle, qui vise une mesure déclarée des deux côtés ; il dit seulement que le cas ne prouve
        rien.'
      suite: 'Décision reformulée : vérifiée, niveau D.'
- id: B025
  titre: Le plasma des patients EM/SFC manque d'acides biliaires, ce qui pourrait refléter un déficit de leur transformation
    par le microbiote, avec moins de signal sur les récepteurs TGR5 et FXR
  domaine_source: EM/SFC (métabolomique et métagénomique) ; maladies inflammatoires de l'intestin (perte d'acides
    biliaires secondaires et du signal TGR5)
  processus_commun: Le microbiote transforme les acides biliaires primaires du foie en acides biliaires secondaires,
    qui activent le récepteur TGR5. Cela se mesure par le rapport acides secondaires sur primaires dans les selles
    et le plasma, et par les gènes bactériens de cette transformation.
  enonce: Dans l'EM/SFC, la baisse des acides biliaires du plasma vient d'une moindre transformation des acides
    primaires en acides secondaires par le microbiote, pas seulement de l'inactivité. Si c'est vrai, le rapport
    acides secondaires sur primaires sera plus bas chez les patients que chez des témoins sédentaires de même niveau
    d'activité, il suivra la baisse des gènes bactériens de cette transformation, et il sera le plus bas chez les
    patients dont la maladie est récente.
  pourquoi_inexploree: 'Requêtes faites le 2026-11-23. Europe PMC, titre et résumé : (« bile acid » OU « bile acids
    » OU « bile salt ») ET (ME/CFS OU « chronic fatigue syndrome ») : 10 résultats, dont deux études à plusieurs
    niveaux de mesure (PMID 36758521 et 40715814) et une métabolomique (PMID 28059425) ; les autres ne concernent
    pas la maladie. Europe PMC : (« secondary bile acid(s) » OU « 7alpha-dehydroxylation » OU « bile acid-inducible
    ») ET (« long COVID » OU PASC OU « post-COVID ») : 0 résultat. Europe PMC : « TGR5 » ET (COVID OU SARS-CoV-2)
    : 7 résultats, aucun sur le COVID long ou l''EM/SFC. ClinicalTrials.gov : (acides biliaires, cholestyramine,
    colesevelam, acide ursodésoxycholique) ET (EM/SFC) : 6 résultats, aucun sur l''EM/SFC. Le rapport acides secondaires
    sur primaires et la bioactivité TGR5 n''ont pas été trouvés chez les EM/SFC. Une étude en recrutement chez le
    COVID long (NCT06825819) prévoit de mesurer les acides biliaires secondaires : la piste est donc en cours d''exploration
    pour le COVID long. Non trouvé ne veut pas dire inexistant.'
  test_propose: Sur les données déjà publiées de l'étude de Xiong et collaborateurs (selles en métagénomique et
    plasma, 75 patients à maladie récente, 79 à maladie ancienne, 79 témoins) et sur un jeu indépendant, calculer
    le rapport acides secondaires sur primaires du plasma, puis une bioactivité TGR5 estimée à partir du profil,
    par la méthode décrite dans les maladies inflammatoires de l'intestin (PMID 42481656), et le comparer à l'activité
    physique déclarée ou mesurée. La piste est réfutée si le rapport n'est pas plus bas chez les patients que chez
    les témoins après ajustement sur l'activité physique, l'indice de masse corporelle, l'âge et le sexe, dans les
    deux cohortes, ou si les gènes bactériens de la transformation ne sont pas moins abondants.
  donnees_existantes: 'Les données de l''étude de Xiong et collaborateurs (Cell Host Microbe 2023) et de la suivante
    (Nature Medicine 2025) : leur mise à disposition et la liste des acides biliaires dosés sont à confirmer dans
    les articles, non ouverts en texte intégral pendant cette recherche. La cohorte de Germain et collaborateurs
    (17 patients, 15 témoins) est trop petite pour un test seule. Le suivi de NCT06825819 (400 participants prévus)
    servira de seconde cohorte pour le COVID long, à confirmer.'
  risques: 'Les deux sources ne disent pas la même chose : l''étude de 2017 note une perturbation de la voie des
    acides biliaires primaires dans le plasma, sans que le sens de la variation apparaisse dans le résumé ; elle
    compte 17 patients et 15 témoins et 35 métabolites seulement restent significatifs après correction (Q inférieur
    à 0,15) (PMID 28059425). L''étude de 2023 rapporte une baisse des acides biliaires du plasma (75 patients à
    maladie récente, 79 à maladie ancienne, 79 témoins, résumé seul lu, PMID 36758521) : on ignore dans quelle cohorte,
    pour quels acides, avec quelle taille d''effet. Les deux équipes sont distinctes, mais les deux études sont
    des mesures faites chez des patients déjà malades : la cause peut être l''effet (alimentation, inactivité, médicaments,
    constipation ou diarrhée). La même étude de 2023 dit que, chez les malades à maladie ancienne, la dysbiose microbienne
    s''est largement résorbée ; l''hypothèse microbienne est donc plus plausible au début de la maladie. La preuve
    du lien entre perte de transformation et inflammation vient d''une autre maladie, la maladie inflammatoire de
    l''intestin (PMID 42481656), et reste à prouver ici. Aucun levier n''est testé dans l''EM/SFC. L''acide ursodésoxycholique
    n''a pas amélioré le COVID long dans un essai de 396 adultes en 14 jours (PMID 41771135) ; cet essai n''a pas
    mesuré l''activation de TGR5, mais il freine l''idée que donner un acide biliaire suffit. Danger d''un levier
    : un agoniste de FXR comme l''acide obéticholique a été retiré après démangeaisons, changements du cholestérol
    et inquiétudes pour le foie, sans bénéfice clinique confirmé (PMID 42961163) ; le FXR augmente aussi l''ACE2
    des cellules d''intestin (PMID 37697930). Rien ici ne justifie un essai de traitement ; ce n''est pas un avis
    médical. Relecture du 2026-11-23, grille statistique : doutes aux questions 1, 2, 3, 4, 5, 6, 7 et 10. Aucune
    taille d''effet sur les acides biliaires n''est lisible ; le pilote de 2017 compte 17 patientes, avec un seuil
    de fausses découvertes admis à 15 %.'
  niveau: C
  sources:
  - titre: Multi-'omics of gut microbiome-host interactions in short- and long-term myalgic encephalomyelitis/chronic
