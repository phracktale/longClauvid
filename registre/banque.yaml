  - titre: Shared autonomic phenotype of long COVID and myalgic encephalomyelitis/chronic fatigue syndrome, PLoS
      One 2026 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/41576003/
    lu: page
  - titre: Study of Efficacy of ARA 290 on Corneal Nerve Fiber Density and Neuropathic Symptoms of Subjects With
      Sarcoidosis, NCT02039687 (fiche lue par l'interface du registre)
    url: https://clinicaltrials.gov/study/NCT02039687
    lu: page
  origine: agent biologie
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '7 sources rouvertes : 5 en texte intégral, 1 par son résumé, 1 page lue en partie.'
    affirmations: '20 affirmations contrôlées : 16 confirmées, 1 inexacte, 3 non trouvées.'
    corrections:
    - 'Les deux cohortes de microscopie de la cornée sont transversales : aucune ne suit les patients. Le test proposé
      ne peut pas s''y faire ; il demande de nouvelles mesures.'
    - 'L''essai de 2017 n''a été relu que par son résumé et sa fiche de registre : le site de la revue est bloqué.'
    - Les doses de 1 mg et de 8 mg n'atteignent pas le critère ; seule la dose intermédiaire l'atteint.
    - L'essai est promu par le fabricant de la molécule, dont trois auteurs de l'essai de 2013 sont salariés. Dans
      cet essai de 2013, les fibres de la peau n'augmentent pas de façon significative.
    - 'Chez Bitirgen, la densité des fibres ne baisse que dans le sous-groupe à symptômes neurologiques (ensemble
      : p = 0,141).'
    - 'Niveau ramené de B à C : B vaut pour la perte de fibres, décrite par plusieurs équipes ; le levier n''a aucune
      donnée dans ces maladies.'
    inexploree: 'L''affirmation tient pour le levier : aucune publication ni essai du cibinétide dans ces maladies.
      Au registre, quatre essais de la molécule, achevés ou arrêtés entre 2014 et 2017, dont un de statut inconnu.'
    decision: 'Gardée après corrections, avec un test à refaire : mesurer d''abord, sur une cohorte suivie, si les
      fibres de la cornée remontent quand les symptômes s''améliorent. Dans l''essai de 2017, ni les fibres de la
      peau ni les symptômes ne s''améliorent plus que sous placebo.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections, avec un test à refaire : mesurer d''abord, sur une cohorte suivie,
        si les fibres de la cornée remontent quand les symptômes s''améliorent.'
      constats:
      - Quatorze des dix-sept faits contrôlés sont confirmés ; les trois autres sont des recherches qui ne se rejouent
        pas sur les copies.
      - La fiche de registre de l'essai de 2017 donne ses critères secondaires. La densité des fibres de la peau
        gagne 0,8 fibre par millimètre sous placebo contre 0,4 sous 4 mg ; le score de symptômes baisse de 7,3 points
        sous placebo contre 8,7 sous 4 mg. Le gain de fibres de la cornée ne s'accompagne d'aucun gain net sur la
        peau ni sur les symptômes.
      - Dans l'essai de 2013, le gain cornéen est testé dans chaque groupe contre son propre départ, pas entre les
        groupes, et chaque œil compte comme un échantillon indépendant.
      - 'L''essai de 2017 reste lu par son résumé et sa fiche de registre. La piste reste « vérifiée » parce que
        l''essai de 2013, lu en entier, porte le même signal : c''est la limite de la règle.'
      - 'Aucune cohorte suivie n''est nommée pour le test : les deux cohortes citées sont transversales.'
      suite: 'Décision complétée : vérifiée, niveau C.'
- id: B008
  titre: Des bactéries de l'intestin produisent du D-lactate qui passe dans le sang et trouble la cognition, comme
    dans l'acidose D-lactique du grêle court
  domaine_source: Acidose D-lactique du syndrome du grêle court
  processus_commun: D-lactate dans le plasma ou l'urine ; abondance des bactéries fécales qui en produisent
  enonce: Chez une partie des patients EM/SFC, une élévation modérée et chronique du D-lactate d'origine bactérienne
    contribuerait aux troubles cognitifs. Si c'est vrai, le D-lactate du sang est plus élevé que chez des témoins.
  pourquoi_inexploree: 'Europe PMC, « D-lactate OR D-lactic » avec les termes EM/SFC ou COVID long : 6 résultats.
    Une étude de selles (Sheedy 2009, 108 patients), une revue systématique qui réclame un dosage du D-lactate chez
    les patients (Wallis 2017), et un essai ouvert d''antibiotique et de probiotique sur 44 patients (Wallis 2018).
    Aucun dosage cas-témoins du D-lactate dans le sang n''a été trouvé, ni aucune étude dans le COVID long. ClinicalTrials.gov,
    « D-lactate OR D-lactic » et ces maladies : 7 fiches, dont aucune ne porte sur cette piste. Non trouvé ne veut
    pas dire inexistant.'
  test_propose: Doser le D-lactate, par un dosage qui lui est propre, dans du plasma ou de l'urine déjà conservés,
    chez des patients et des témoins. La piste est réfutée si les taux ne diffèrent pas.
  donnees_existantes: UK ME/CFS Biobank (plasma) ; biobanque RECOVER (sérum, urine, selles).
  risques: 'Dans l''essai ouvert de 2018, le rapport D-lactate sur L-lactate de l''urine n''a pas bougé alors que
    des symptômes s''amélioraient : cela va contre la piste. L''étude de 2009 repose sur des cultures de selles.
    Selon les auteurs de 2018, les streptocoques ne sont ni les seuls ni les premiers producteurs de D-lactate.
    Un essai ouvert ne sépare pas l''effet du traitement de l''effet placebo. L''acidose D-lactique vraie survient
    surtout chez des personnes au grêle court : la transposition à un intestin entier reste à prouver. Relecture
    du 2026-11-22, grille statistique : doutes aux questions 1, 2, 3, 4, 6, 7 et 10. Un seul groupe de recherche,
    des cultures de selles, un essai sans témoin ; le test proposé n''a pas de seuil.'
  niveau: C
  sources:
  - titre: Increased d-lactic Acid intestinal bacteria in patients with chronic fatigue syndrome, In Vivo 2009 (résumé)
    url: https://pubmed.ncbi.nlm.nih.gov/19567398/
    lu: page
