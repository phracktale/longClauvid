      (résumé de congrès, AAN 2026)
    url: https://index.mirasmart.com/AAN2026/PDFfiles/AAN2026-000757.html
    lu: page
  - titre: 'More common than we thought: Hypermobile Ehlers-Danlos Syndrome, comorbidity burden, and long COVID
      risk in a national cohort, PLOS digital health 2026 (résumé ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/42986813/
    lu: page
  - titre: Hereditary Connective Tissue Diseases and Risk of Post-Acute SARS-CoV-2, Viruses 2024 (résumé ; ajoutée
      à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/38543826/
    lu: page
  - titre: 'Variant connective tissue as a risk factor for Long COVID: a case-control study, Research Square 2025,
      prépublication (résumé ; ajoutée à la relecture)'
    url: https://doi.org/10.21203/rs.3.rs-5503490/v1
    lu: page
  origine: agent statistique
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '3 sources rouvertes : 1 en texte intégral, 2 par leur résumé.'
    affirmations: '26 affirmations contrôlées : 16 confirmées, 1 inexacte, 9 non trouvées.'
    corrections:
    - '« Aucune analyse génétique » est contredit par une source de la fiche : le résumé de congrès rapporte des
      variants de MTHFR chez 70 % de 20 patients, sans témoins.'
    - 'La seconde enquête est chiffrée : 1 816 répondants, rapport de cotes de 1,29 (1,00–1,65) pour l''hypermobilité
      généralisée et de 2,12 (1,43–3,16) pour l''hypermobilité extrême (prépublication, DOI 10.21203/rs.3.rs-5503490/v1).'
    - Un auteur de l'étude principale déclare un contrat de conseil avec l'entreprise de l'application.
    - Le seuil de réfutation proposé, une borne haute sous 1,10, est presque la borne basse déjà observée.
    - 'Niveau relevé de C à B : trois équipes, trois façons de mesurer, un même sens ; chaque étude garde un biais
      de mesure.'
    inexploree: 'L''affirmation est fausse sur un point central : l''association a été cherchée avec une hypermobilité
      non déclarée par le patient. Dans une base américaine de 19 millions de dossiers, les personnes qui portent
      un diagnostic de syndrome d''Ehlers-Danlos hypermobile ont près de trois fois plus de COVID long, un risque
      concentré chez celles qui ont déjà une tachycardie posturale ou une EM/SFC (PMID 42986813). Dans une cohorte
      hospitalière, 9,5 % des 63 patients atteints d''une maladie héréditaire du tissu conjonctif ont un COVID long,
      contre 2,5 % (PMID 38543826). Reste inexploré : un score de Beighton mesuré avant l''infection.'
    decision: Gardée après corrections. L'association est retrouvée avec une hypermobilité non déclarée par le patient,
      dans deux études à diagnostics codés que leurs limites empêchent de tenir pour une réplication. Le test suivant
      est une mesure à l'examen, avant l'infection ; aucune cohorte n'est nommée pour le faire.
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: Gardée après corrections. La piste a passé son propre premier test ; le suivant est une
        mesure à l'examen, avant l'infection.
      niveau_initial: B
      constats:
      - Treize des quinze faits contrôlés sont confirmés.
      - '« Trois équipes » était inexact : la seconde enquête sur l''hypermobilité déclarée partage une autrice
        avec la première. Les deux études indépendantes mesurent autre chose, un diagnostic codé.'
      - Dans la base américaine, les trois quarts du groupe portent un code de syndrome d'Ehlers-Danlos non précisé,
        une partie des diagnostics est posée après le COVID-19, et les auteurs disent leurs résultats descriptifs.
      - La cohorte hospitalière repose sur 6 cas de COVID long, dans un groupe qui mêle trois maladies du tissu
        conjonctif.
      - '« Déjà une tachycardie posturale ou une EM/SFC » était inexact : ces diagnostics sont relevés à un moment
        quelconque du suivi, sans ordre dans le temps.'
      - 'Question 9 de la grille : l''hypermobilité et la non-guérison sont déclarées dans le même questionnaire.
        Le doute reste levé en partie par les deux études à diagnostics codés, comme pour B016 ; elles ne valent
        pas une contre-analyse solide.'
      suite: 'Décision reformulée, niveau ramené de B à C : la réplication par une équipe indépendante porte sur
        un diagnostic codé, pas sur l''hypermobilité elle-même. La même règle avait ramené B013 à C.'
- id: B019
  titre: Des taux bas d'interleukines 5 et 13 avant une mononucléose précèdent l'EM/SFC sévère
  domaine_source: Cohorte prospective d'étudiants, avec prise de sang avant la maladie
  processus_commun: Cytokines de type 2 (IL-5, IL-13) basses avant l'infection
  enonce: Un tonus bas des cytokines de type 2, mesuré avant l'infection, prédispose à une forme sévère de fatigue
    post-infectieuse. L'hypothèse prédit le même écart, dans le même sens, avant d'autres infections que la mononucléose.
    Elle est réfutée si l'IL-5 et l'IL-13 d'avant l'infection ne diffèrent pas dans une seconde cohorte.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « IL-13 IL-5 low before infection predicts long COVID chronic
    fatigue prospective pre-illness cytokines replication ». Trouvé : les articles de l''équipe d''origine, et une
    étude de jumeaux britanniques limitée à l''IL-6. Aucune réplication de l''IL-5 ou de l''IL-13 d''avant la maladie
    n''a été trouvée, et aucun essai. Le registre ne cite ni ces cytokines ni cette cohorte.'
  test_propose: 'Dans une cohorte disposant de plasma d''avant l''infection, doser l''IL-5 et l''IL-13 chez les
    personnes qui ont ensuite une fatigue persistante après infection et chez des personnes rétablies. Analyse fixée
    d''avance : sens attendu plus bas chez les futurs malades, trois tests (IL-5, IL-13, IL-6), alpha de 0,05/3.
    Réfutation : écarts standardisés dont l''intervalle exclut −0,3. Effectif calculé en Python (test t bilatéral,
    trois témoins par cas, puissance 90 %) : 73 cas et 219 témoins pour un écart de 0,5 ; 29 cas et 87 témoins pour
    0,8.'
  donnees_existantes: 'TwinsUK : plasma d''avant la pandémie et panel de protéines de l''inflammation (présence
    de l''IL-5 et de l''IL-13 à vérifier) ; UK Biobank, protéomique, à vérifier'
  risques: 'Très petit groupe : 18 formes sévères. Nombre de cytokines testées non rapporté, et aucune correction
    pour comparaisons multiples mentionnée. La fiabilité du dosage à des taux bas est à vérifier pour la méthode
    employée. Résultat croisé à connaître : chez les jumeaux britanniques, l''IL-6 d''avant la pandémie ne prédit
    pas la fatigue après le COVID-19, et l''étude d''origine trouve une IL-6 basse, non haute. Étudiants jeunes
    : généralisation incertaine. Relecture du 2026-11-22, grille statistique : doutes aux questions 2, 3, 4, 7 et
    10. Dix-huit personnes portent le signal, dans un sous-groupe choisi après coup ; le signal est fragile.'
  niveau: C
  solidite_statistique: '4 501 étudiants suivis ; 238 mononucléoses (5,3 %) ; 55 EM/SFC à six mois (23 %). Comparaison
    de départ : 18 formes sévères contre 58 rétablis. IL-5 et IL-13 plus basses avant la maladie ; moyennes, tailles
    d''effet et valeurs de p non rapportées dans les textes lus. Modèle de prédiction : aire sous la courbe 0,795
    (0,669–0,921), sans validation externe. Calcul Python (test t bilatéral, puissance 80 %) : avec 18 et 58 personnes,
    seul un écart standardisé d''au moins 0,77 est détectable ; 0,89 après correction sur trois cytokines ; 1,01
    sur dix. Un écart observé dans ces conditions est donc probablement surestimé. Une seule équipe. Biais principal
    : comparaisons multiples sur un petit effectif.'
  sources:
  - titre: 'Risks for developing ME/CFS in college students following infectious mononucleosis: a prospective cohort
      study (Clinical Infectious Diseases, DOI 10.1093/cid/ciaa1886), résumé'
    url: https://research.luriechildrens.org/en/risks-for-developing-mecfs-in-college-students-following-infectious-mononucleosis-a-prospective-cohort-study
    lu: page
    texte: https://pubmed.ncbi.nlm.nih.gov/33367564/
  - titre: Predictors for Developing Severe Myalgic Encephalomyelitis/Chronic Fatigue Syndrome Following Infectious
      Mononucleosis (Journal of Rehabilitation Therapy, 2022)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8959090
    lu: page
  - titre: Long-COVID fatigue is not predicted by pre-pandemic plasma IL-6 levels in mild COVID-19 (Inflammation
      Research, 2023)
    url: https://link.springer.com/article/10.1007/s00011-023-01722-2
    lu: page
    texte: https://pubmed.ncbi.nlm.nih.gov/36995412/
  - titre: 'Outcomes of ME/CFS following infectious mononucleosis: seven-year follow-up of a prospective study,
      Frontiers in Medicine 2026 (titre seul ; ajoutée à la relecture)'
    url: https://pubmed.ncbi.nlm.nih.gov/41836950/
    lu: extrait
  origine: agent statistique
  date: '2026-11-22'
  statut: vérifiée
  relecture:
    date: '2026-11-22'
    lecture: '3 sources rouvertes : 2 en texte intégral, 1 par son résumé.'
    affirmations: '33 affirmations contrôlées : 21 confirmées, 1 inexacte, 11 non trouvées.'
    corrections:
    - 'Le texte intégral liste 16 cytokines dosées, sans correction pour comparaisons multiples : « nombre non rapporté
      » est faux.'
    - L'analyse n'a été restreinte aux formes sévères qu'après un résultat non significatif sur l'EM/SFC en général.
    - Les deux cytokines ne valent qu'au sein d'un indice à six variables, surtout digestives ; un premier modèle
      avec les seules cytokines était jugé insuffisant (aire sous la courbe de 0,676).
    - 'Chez les jumeaux britanniques, c''est une interleukine 6 haute qui accompagne la fatigue chez les non-infectés
      : le sens est opposé.'
    inexploree: 'L''affirmation tient : les seuls autres travaux viennent de la même cohorte, dont un suivi à sept
      ans (PMID 41836950, connu par son titre seul). Aucune réplication, aucun essai.'
    decision: 'Gardée après corrections, comme signal fragile : le sang prélevé avant la maladie est rare. Le test
      de réplication a un seuil et un effectif calculé, mais rien ne montre que la cohorte nommée dose les deux
      cytokines ni qu''elle compte assez de cas.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections, comme signal fragile : le sang prélevé avant la maladie est
        rare, et le test de réplication est bien écrit.'
      constats:
      - Treize des dix-huit faits contrôlés sont confirmés.
      - '« Un premier modèle avec les seules cytokines » était inexact : ce modèle contenait aussi le score total
        du questionnaire de symptômes. Aucun modèle à cytokines seules n''est rapporté.'
      - 'Le suivi à sept ans n''est plus connu par son titre seul : sa copie est un texte intégral, qui renvoie
        aux résultats de départ déjà publiés. Il n''apporte pas de réplication.'
      - La comparaison de départ vient de l'article de 2021, lu par son résumé, qui nomme l'IL-6 et l'IL-13, pas
        l'IL-5. L'IL-5 n'apparaît que dans l'article de 2022, lu en entier, comme l'une des deux cytokines les plus
        prédictives parmi seize.
      - 'Le jeu de données du test n''est pas acquis : la cohorte de jumeaux compte 282 personnes infectées, et
        sa copie ne dit pas que l''IL-5 et l''IL-13 y sont dosées.'
      suite: 'Décision reformulée : vérifiée, niveau C. La piste reste « vérifiée » parce que l''article de 2022,
        qui porte l''IL-5 et l''IL-13, est lu en entier. L''article de 2021 (PMID 33367564) est à lire en entier
        pour la comparaison de départ.'
- id: B020
  titre: Un nombre de copies d'ADN mitochondrial génétiquement plus élevé est associé à moins d'EM/SFC
  domaine_source: Randomisation mendélienne sur les statistiques résumées de DecodeME
  processus_commun: Nombre de copies d'ADN mitochondrial dans les cellules du sang
  enonce: Un nombre de copies d'ADN mitochondrial bas, déterminé par les gènes, augmente le risque d'EM/SFC. L'hypothèse
    prédit le même effet avec un autre jeu de cas, et un nombre de copies plus bas, mesuré directement, chez les
    malades. Elle est réfutée si la randomisation mendélienne ne se réplique pas ou si la mesure directe ne montre
    aucun écart.
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « mitochondrial DNA copy number ME/CFS long COVID case-control
    », « myalgic encephalomyelitis Mendelian randomization DecodeME ». Trouvé : des études de la fonction mitochondriale
    dans le COVID long, lues par leur titre, et une seule randomisation mendélienne, en prépublication. Aucune réplication
    et aucun essai fondé sur ce marqueur trouvés. Le registre cite DecodeME (P13) pour ses huit régions, pas pour
    cette analyse.'
  test_propose: 'Premier test : refaire la randomisation mendélienne sur un jeu de cas indépendant, avec les mêmes
    instruments, plus la médiane pondérée et l''ordonnée de la méthode d''Egger. La piste tient si le rapport de
    cotes reste sous 1 avec un intervalle qui exclut 1 et si l''ordonnée d''Egger ne s''écarte pas de zéro. Second
    test : dans UK Biobank, comparer le nombre de copies estimé chez les 1 455 cas et chez les témoins, à numération
    sanguine égale. Réfutation : écart standardisé dont l''intervalle exclut −0,1.'
  donnees_existantes: Statistiques résumées de DecodeME ; étude pangénomique du nombre de copies ; UK Biobank (estimation
    du nombre de copies à vérifier)
  risques: 'Prépublication non relue par des pairs. Pléiotropie : le nombre de copies mesuré dans le sang dépend
    probablement de la composition en cellules sanguines, et le volume plaquettaire ressort dans la même analyse
    ; à vérifier. Neuf expositions testées. Les témoins de DecodeME viennent d''UK Biobank, source fréquente des
    instruments : le recouvrement d''échantillons peut biaiser l''estimation, à vérifier. Un effet génétique sur
    toute la vie ne dit pas qu''une intervention chez un malade changerait quelque chose. Relecture du 2026-11-22,
    grille statistique : doutes aux questions 1, 3, 4, 7 et 10. Un rapport de cotes sans intervalle, une prépublication,
    neuf expositions testées ; le nombre de copies mesuré dans le sang dépend de la composition en cellules.'
  niveau: C
  solidite_statistique: '15 579 cas d''EM/SFC. Rapport de cotes d''environ 0,83 par écart type de nombre de copies,
    méthode de la variance inverse pondérée ; intervalle de confiance et valeur de p non donnés dans le texte lu.
    Seuil de Bonferroni annoncé : p inférieur à 5,6 × 10⁻³ pour neuf expositions. Hétérogénéité faible pour ce marqueur
    (Q de Cochran 87,7 pour 82 degrés de liberté, p = 0,31). Deux autres résultats de la même analyse sont plus
    fragiles : glycoprotéines acétylées, rapport d''environ 1,12 (hétérogénéité p = 0,011) ; volume plaquettaire
    moyen, environ 1,09 (hétérogénéité p = 2,3 × 10⁻⁶). Test de direction de Steiger favorable. Ordonnée d''Egger
    et analyse inverse non trouvées dans le texte. Aucune réplication. Biais principal : pléiotropie horizontale.'
  sources:
  - titre: Insights into Pathophysiological Pathways in ME/CFS Through Genetic Correlation and Mendelian Randomization
      (Research Square, prépublication, PDF)
    url: https://www.researchsquare.com/article/rs-9363637/v2.pdf
    lu: page
  - titre: Insights into Pathophysiological Pathways in ME/CFS Through Genetic Correlation and Mendelian Randomization
      (résumé, Sciety)
    url: https://sciety.org/articles/activity/10.21203/rs.3.rs-9363637/v2
    lu: page
  - titre: Novel biomarkers of mitochondrial dysfunction in Long COVID patients
    url: https://pubmed.ncbi.nlm.nih.gov/39495479/
    lu: extrait
  - titre: Could mitochondrial dysfunction be a differentiating marker between chronic fatigue syndrome and fibromyalgia?,
      Antioxidants & redox signaling 2013 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/23600892/
    lu: page
  - titre: HbA1c and leukocyte mtDNA levels as major factors associated with post-COVID-19 syndrome in type 2 diabetes
      patients, Scientific reports 2024 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/39462048/
    lu: page
  - titre: Exploring DNA methylation, telomere length, mitochondrial DNA, and immune function in patients with Long-COVID,
      BMC medicine 2025 (résumé ; ajoutée à la relecture)
    url: https://pubmed.ncbi.nlm.nih.gov/39901177/
    lu: page
  origine: agent statistique
  date: '2026-11-22'
  statut: promue
  relecture:
    date: '2026-11-22'
    lecture: '3 sources rouvertes : 2 en texte intégral, 1 par son résumé.'
    affirmations: '27 affirmations contrôlées : 21 confirmées, 6 non trouvées.'
    corrections:
    - Le texte dit aussi que le nombre de copies n'a pas de corrélation génétique globale avec l'EM/SFC ; la fiche
      ne le dit pas.
    - 'Ni l''intervalle de confiance, ni la valeur de p, ni l''ordonnée d''Egger ne sont dans le texte : ils sont
      renvoyés à un dépôt de données qui n''a pas été lu.'
    - La troisième source mesure l'ADN mitochondrial libre du plasma dans le COVID long, pas le nombre de copies
      dans les cellules.
    inexploree: Des mesures directes existent et ne vont pas toutes dans le sens attendu. Dans l'EM/SFC, le contenu
      en ADN mitochondrial des cellules du sang est normal chez 23 patients (PMID 23600892). Dans le COVID long,
      il est plus bas chez 44 diabétiques atteints que chez 21 non atteints (PMID 39462048) ; une cohorte de 358
      personnes l'a mesuré sans le retenir parmi ses marqueurs (PMID 39901177). Aucune réplication de la randomisation
      mendélienne.
    decision: 'Gardée après corrections : la randomisation mendélienne est à refaire sur un autre jeu de cas, mais
      aucun jeu public et indépendant n''est assez grand aujourd''hui.'
    attaque:
      date: '2026-11-22'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections : la réplication sur un autre jeu de cas ne demande que des statistiques
        résumées.'
      constats:
      - Cinq des huit faits contrôlés sont confirmés.
      - '« Ne demande que des statistiques résumées » n''est montré par aucune source : aucun second jeu de cas
        d''EM/SFC n''y est nommé. Le plan de la piste P17 l''a établi depuis : aucun jeu public et indépendant ne
        dépasse 18 % de puissance.'
      - L'intervalle de confiance existe, dans une figure que la copie ne restitue pas ; ce sont les analyses de
        sensibilité qui sont renvoyées au dépôt de données.
      - 'Dans la cohorte de 358 personnes, le nombre de copies est plus bas chez les patients fatigués avec malaise
        après effort, sans prédire les symptômes : la relecture ne donnait que la seconde moitié.'
      - 'La seule mesure directe dans l''EM/SFC, sur 23 patients et lue par son résumé, est normale : c''est l''un
        des deux critères de réfutation de l''énoncé.'
      - Le nombre de copies n'a pas de corrélation génétique globale avec l'EM/SFC, et les auteurs disent désigner
        des domaines larges, pas des voies causales isolées.
      suite: 'Décision reformulée : promue, niveau C. Rien ne change pour la piste P17 du registre, dont le plan
        dit déjà que le test n''est pas faisable aujourd''hui.'
  promue_en: P17
  promue_le: '2026-11-22'
- id: B021
  titre: À Taïwan, la prise de certains antibiotiques est associée à dix fois moins de syndrome de fatigue chronique
    après une infection, un écart trop grand pour être cru tel quel
  domaine_source: Pharmaco-épidémiologie sur la base de l'assurance maladie de Taïwan
  processus_commun: Antibiotiques à effet immunomodulateur supposé (cyclines, macrolides, quinolones) au décours
    d'une infection
  enonce: 'Une antibiothérapie donnée au moment d''une infection réduit le risque de fatigue chronique persistante.
    L''hypothèse la plus probable est contraire : le signal est un artefact de méthode. La piste est réfutée si
    l''association disparaît quand le temps de suivi est compté à partir de la prescription et que l''antibiotique
    est comparé à un autre antibiotique.'
  pourquoi_inexploree: 'Recherches du 2026-11-22 : « antibiotics chronic fatigue syndrome prevention after infection
    cohort immortal time bias », « doxycycline Q fever fatigue syndrome randomized trial ». Trouvé : un seul essai
    randomisé, dans la fatigue de la fièvre Q, où la doxycycline ne fait pas mieux que le placebo. Aucune contre-analyse
    de la base taïwanaise et aucun essai de prévention trouvés. Le registre ne cite pas les antibiotiques.'
  test_propose: 'Émulation d''un essai cible dans une base d''assurance maladie : inclusion le jour de la prescription,
    comparaison entre deux antibiotiques donnés pour la même infection (par exemple azithromycine contre amoxicilline),
    suivi d''un an, issue définie par un code spécifique et non par « malaise et fatigue ». Contrôle négatif : une
    issue sans lien attendu. Lecture fixée d''avance : si l''intervalle à 95 % du rapport de risques est compris
    entre 0,8 et 1,25, le signal publié est un artefact. Il ne mérite d''être poursuivi que si le rapport reste
    sous 0,8 avec un contrôle négatif neutre.'
  donnees_existantes: Base de l'assurance maladie de Taïwan ; toute base nationale de remboursement comparable
  risques: 'Biais de temps immortel très probable : la définition de l''exposition n''est pas décrite dans le texte
    lu et le biais n''y est pas traité. Codes de diagnostic peu spécifiques, qui incluent « malaise et fatigue »
    : l''incidence mesurée, 3,67 à 5,40 pour 1 000 personnes-années, est très élevée pour une maladie rare. Toutes
    les infections listées y augmentent le risque, de 9 % à 86 %, ce qui évoque un effet de surveillance. Résultat
    contraire : essai randomisé négatif de la doxycycline. Danger : les antibiotiques ont des effets indésirables
    et favorisent les résistances ; rien ici ne justifie d''en prendre. Relecture du 2026-11-22, grille statistique
    : doutes aux questions 2, 3, 4, 5, 7, 8 et 9. Ni la gravité de l''infection ni la raison de la prescription
    ne sont mesurées.'
  niveau: C
  solidite_statistique: '395 811 personnes avec une infection, appariées à autant de témoins. Rapports de risques
    instantanés ajustés : doxycycline 0,10 (0,07–0,15), azithromycine 0,07 (0,05–0,10), moxifloxacine 0,05 (0,04–0,08),
    lévofloxacine 0,04 (0,03–0,06), ciprofloxacine 0,51 (0,31–0,83). Un risque divisé par dix à vingt-cinq par un
    antibiotique courant est invraisemblable : la taille de l''effet est le premier motif de doute. Six antibiotiques
    testés, pas de correction mentionnée. Essai randomisé Qure : 52 patients sous doxycycline et 52 sous placebo
    pendant 24 semaines ; fatigue finale 40,8 (37,3–44,3) contre 37,8 (34,2–41,2), sans avantage. Une seule équipe,
    aucune réplication. Biais principal : temps immortel et classement des cas.'
  sources:
  - titre: 'Increased risk of chronic fatigue syndrome following infection: a 17-year population-based cohort study
      (Journal of Translational Medicine, 2023), lu en partie'
    url: https://link.springer.com/article/10.1186/s12967-023-04636-z
    lu: page
    texte: https://pubmed.ncbi.nlm.nih.gov/37951920/
