  relecture:
    date: '2026-11-23'
    lecture: '9 sources rouvertes : 6 en texte intégral, 2 par leur résumé, 1 page bloquée.'
    affirmations: '36 affirmations contrôlées : 29 confirmées, 2 inexactes, 5 non trouvées.'
    corrections:
    - L'érythropoïétine plus haute des patients reste dans l'intervalle de référence, et aucune valeur n'est donnée
      dans le texte.
    - 'L''activation de HIF-2α n''est pas mesurée chez les patients : elle est montrée sur des cellules en culture,
      à une dose de protéine S1 supérieure aux taux du plasma, et sa dépendance à HIF-2α repose sur le seul belzutifan.'
    - Le plasma des patients n'altère pas la barrière de façon significative par rapport à celui des témoins.
    - Dans la cohorte plus large de la même ville, le VEGF ne diffère pas entre 100 patients et 90 personnes rétablies.
      C'est la cohorte que le test propose de réutiliser, et l'hémoglobine y manque chez 52 patients sur 102.
    - '« Un seul article » est inexact : l''article principal cite d''autres études qui rapportent une érythropoïétine
      plus haute.'
    - La cohorte finlandaise compte 54 patients à symptômes persistants ; les 111 incluent 57 personnes rétablies.
    - 'La fiche tait un appui : une étude de Cambridge rapporte une expression plus haute des gènes de HIF-2α et
      du récepteur de l''érythropoïétine chez les patients à symptômes persistants.'
    inexploree: Deux travaux manquaient. Une protéomique du plasma de 2023, d'une autre équipe, conclut à un état
      de prolifération vasculaire lié à la voie HIF-1 dans le COVID long, avec le VEGF-A validé par dosage (PMID
      37301958, lue par son résumé). Une étude de 2004 a dosé l'érythropoïétine dans le syndrome de fatigue chronique
      (PMID 15016575, connue par son titre seul). Aucun essai enregistré.
    decision: 'Gardée après corrections, sur un appui mince : une érythropoïétine plus haute mais normale, dans
      une seule cohorte. L''activation de HIF-2α chez les patients est une hypothèse, et la source ne rapporte ni
      ajustement sur l''hémoglobine ni lien avec la sévérité. Une hémoglobine plus basse peut suffire à l''expliquer.
      Les questions 5 et 9 de la grille ne sont pas retenues au sens strict : l''effet n''est pas trop grand pour
      être cru, et la mesure n''est pas déclarée des deux côtés.'
    attaque:
      date: '2026-11-23'
      avis: tient en partie
      decision_initiale: 'Gardée après corrections, sur un appui mince : une érythropoïétine plus haute mais normale,
        dans une seule cohorte. L''activation de HIF-2α chez les patients est une hypothèse. Les questions 5 et
        9 de la grille ne sont pas retenues au sens strict : l''effet n''est pas trop grand pour être cru, et la
        mesure n''est pas déclarée des deux côtés.'
      constats:
      - Sept des huit faits contrôlés sont confirmés ; la copie de la protéomique de 2023 n'était pas disponible
        au contradicteur.
      - L'énoncé promet une érythropoïétine plus haute à hémoglobine égale, qui croît avec la sévérité et les anticorps.
        La source ne rapporte ni cet ajustement ni ces corrélations ; elle montre une hémoglobine qui baisse avec
        la sévérité.
      - Le VEGF élevé ne se retrouve pas dans la cohorte voisine, plus grande.
      - L'appui de Cambridge vient d'un test avant correction pour comparaisons multiples, et ses auteurs lisent
        la hausse du gène de HIF-2α comme une réponse au fer.
      suite: 'Décision complétée : vérifiée, niveau C, sans le relever.'
