id: H2
titre: Une boucle interféron relie déficit énergétique, sérotonine basse et réponse aux anti-JAK
statut: ouverte
creee_le: 2026-11-22
endotype: E2
pistes: [P03, P09, P01]
sources: [sicktimes-2026-11, chen-2026, revive-2026]

enonce: >-
  Chez une partie des patients, une signalisation interféron entretenue réduit la sérotonine
  (moindre absorption du tryptophane) et détourne le métabolisme énergétique.
  Les inhibiteurs de JAK agiraient en coupant cette boucle, pas par un effet
  anti-inflammatoire général.

prediction: >-
  Le bénéfice des anti-JAK se concentre chez les patients à signature interféron élevée
  et sérotonine basse, et la sérotonine remonte avant les symptômes.

refutation: >-
  La réponse aux anti-JAK ne dépend pas de la signature interféron initiale,
  ou la sérotonine ne bouge pas chez les répondeurs.

test:
  donnees: Prélèvements des essais REVERSE-LC (baricitinib) et CLEAR-LC (abrocitinib).
  methode: Signature interféron et sérotonine à l'inclusion, puis sous traitement ; analyse pré-enregistrée.
  faisabilite: Essais en cours ou terminés ; dépend de l'accès aux biobanques.

historique:
  - date: 2026-11-22
    evenement: Création à partir du document de cadrage. Hypothèse non évaluée par des pairs.
  - date: 2026-11-22
    evenement: >-
      Transpositions T02, T08 et T09. Le nicotinamide riboside a remonté le NAD+ sans améliorer
      les symptômes dans un essai randomisé de 58 participants : résultat négatif pour l'idée
      d'un déficit énergétique corrigeable en aval. Le VIH fournit un marqueur à doser,
      le rapport kynurénine/tryptophane. Statut inchangé.
  - date: 2026-11-22
    evenement: >-
      Essai REVIVE : chez 399 adultes au COVID long installé, la fluvoxamine, un inhibiteur
      de la recapture de la sérotonine, réduit la fatigue contre placebo (différence de 0,43 point
      à 60 jours et de 0,58 à 90 jours sur l'échelle de sévérité de la fatigue, probabilité
      de supériorité de 99 %). L'essai ne mesure ni la sérotonine ni la signature interféron
      et ne sélectionne pas ses patients : il ne dit pas par quel mécanisme le médicament agit.
      Article rétracté puis republié en novembre 2026, lu par son résumé ; le motif de la
      rétractation n'a pas pu être lu. Statut inchangé.
