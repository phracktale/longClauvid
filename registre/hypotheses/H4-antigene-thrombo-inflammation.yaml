id: H4
titre: L'antigène, et non la réplication virale, entretient la thrombo-inflammation
statut: ouverte
creee_le: 2026-11-22
endotype: E4
pistes: [P14, P08]
sources: [recover-vital-nih, sicktimes-2026-05, antigene-liinc-2023, antigene-706, anrs-symposium-2026]

enonce: >-
  Un antiviral bloque la réplication mais n'élimine pas la protéine spike déjà présente.
  Si c'est la spike persistante qui, liée à la fibrine, entretient l'activation du complément,
  l'échec du nirmatrelvir ne dit rien du rôle de l'antigène.

prediction: >-
  Chez les patients antigène-positifs, un anticorps qui élimine la spike ou neutralise
  la fibrine normalise les marqueurs du complément ; un antiviral ne le fait pas.

refutation: >-
  Les marqueurs du complément ne diffèrent pas selon la présence d'antigène plasmatique.

test:
  donnees: Échantillons de RECOVER-VITAL, dont l'analyse virologique restait à publier en mai 2026.
  methode: Antigène plasmatique et complément terminal sur les mêmes prélèvements, avant et après traitement.
  faisabilite: Échantillons déjà collectés ; dosage de l'antigène en cours de validation par le NIH.

historique:
  - date: 2026-11-22
    evenement: Création à partir du document de cadrage. Hypothèse non évaluée par des pairs.
  - date: 2026-11-22
    evenement: >-
      Lot 1, constat sur des données publiées, lu avant l'écriture du plan (analyses/lot-1/PLAN.md).
      Dans la cohorte LIINC, l'antigène plasmatique n'est pas plus fréquent chez les femmes :
      rapport de prévalence des hommes aux femmes 1,68, intervalle de confiance à 95 %
      de 0,93 à 3,04, sur 171 personnes. Dans cette cohorte, l'antigène n'explique donc pas
      la surreprésentation des femmes. Résultat descriptif, niveau C : statut inchangé.
  - date: 2026-11-22
    evenement: >-
      Symposium ANRS MIE du 2026-11-12, lu dans le résumé publié par l'agence. Une étude cas-témoins
      de l'Institut Cochin rapporte que le virus persiste dans les mégacaryocytes et les plaquettes,
      et que des plaquettes portent du virus infectieux. Cela relie la persistance aux plaquettes,
      donc à la thrombo-inflammation, mais va contre l'idée que la réplication ne joue aucun rôle.
      La cohorte nationale française rapporte, à titre préliminaire, une signature endothéliale
      et inflammatoire persistante. Résultats de conférence, non relus dans un article :
      niveau C, statut inchangé.
