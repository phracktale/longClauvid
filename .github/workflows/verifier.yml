# Lance les contrôles du dépôt à chaque demande de fusion et à chaque arrivée sur main.
# Les contrôles n'ont besoin d'aucune donnée extérieure : le dossier cache/ n'est pas utilisé.
name: Contrôles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 verifier.py
